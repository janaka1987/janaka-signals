

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANAKA SMC DASHBOARD V5 PRO</title>
    <script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-color: #05070a;
            --card-bg: #0d1117;
            --border-color: #21262d;
            --green: #00ff88;
            --red: #ff4d4d;
            --blue: #3b82f6;
            --orange: #f39c12;
            --purple: #a855f7;
            --yellow: #eab308;
            --text-main: #e6edf3;
        }

        body { 
            background: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 15px; 
        }

        .header-title {
            text-align: center;
            color: var(--green);
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        .top-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        label { font-size: 11px; color: #848d97; font-weight: bold; margin-bottom: 5px; display: block; }
        
        select { 
            width: 100%; 
            padding: 10px; 
            border-radius: 6px; 
            background: #161b22; 
            color: var(--green); 
            border: 1px solid #30363d; 
            font-weight: bold;
            outline: none;
        }

        #chart { 
            height: 550px; 
            width: 100%; 
            border-radius: 10px; 
            overflow: hidden; 
            position: relative;
        }

        .info-row-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100%;
        }

        .info-row { font-size: 13px; font-weight: bold; }
        .val-g { color: var(--green); }
        .val-r { color: var(--red); }
        .val-b { color: var(--blue); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stat-box { 
            background: var(--card-bg); 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-box span { display: block; font-size: 10px; color: #848d97; text-transform: uppercase; margin-bottom: 5px; }
        .stat-box b { font-size: 15px; }

        .signal-box {
            grid-column: span 6;
            background: #161b22;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid var(--border-color);
            margin-top: 10px;
            position: relative;
        }
        #signalText { font-size: 22px; font-weight: bold; letter-spacing: 2px; }

        /* Win/Loss Tracker UI */
        .tracker-ui {
            font-size: 12px;
            position: absolute;
            top: 10px;
            right: 15px;
            color: var(--blue);
        }

        .legend-horizontal {
            display: flex;
            gap: 10px;
            font-size: 10px;
            justify-content: center;
            margin-top: 5px;
            flex-wrap: wrap;
        }
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }

        /* Toggle Switch for Voice */
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 11px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 20px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #30363d;
            transition: .4s; border-radius: 20px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 14px; width: 14px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--green); }
        input:checked + .slider:before { transform: translateX(14px); }
    </style>
</head>
<body>

<div class="header-title">JANAKA SMC DASHBOARD V5 PRO</div>

<div class="top-bar">
    <div class="card">
        <label>MARKET SELECTION & VOICE SETTINGS</label>
        <div style="display: flex; gap: 10px; align-items: center;">
            <select id="market" style="flex: 2;">
                <optgroup label="Volatility Indices">
                    <option value="R_10">Volatility 10</option>
                    <option value="R_100" selected>Volatility 100</option>
                </optgroup>
                <optgroup label="Forex">
                    <option value="frxEURUSD">EUR/USD</option>
                </optgroup>
            </select>
            <select id="timeframe" style="flex: 1;">
                <option value="60">1M</option>
                <option value="300">5M</option>
            </select>
            <div class="toggle-container">
                <span>VOICE</span>
                <label class="switch">
                    <input type="checkbox" id="voiceToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <div class="card">
        <label>LIVE MARKET MONITOR</label>
        <div class="info-row-container">
            <div class="info-row">Status: <span class="val-g">● Connected</span></div>
            <div class="info-row">Trend: <span id="sideTrend" class="val-g">UPTREND</span></div>
        </div>
        <div class="legend-horizontal">
            <div><span class="dot" style="background:var(--blue)"></span> BOS</div>
            <div><span class="dot" style="background:var(--yellow)"></span> FVG</div>
            <div><span class="dot" style="background:var(--purple)"></span> OB</div>
        </div>
    </div>
</div>

<div class="card" style="padding: 5px;">
    <div id="chart"></div>
</div>

<div class="stats-grid">
    <div class="stat-box"><span>TREND</span><b id="trendText" class="val-g">--</b></div>
    <div class="stat-box"><span>BOS</span><b id="bosText" class="val-b">NONE</b></div>
    <div class="stat-box"><span>WINS</span><b id="winsDisplay" class="val-g">0</b></div>
    <div class="stat-box"><span>LOSSES</span><b id="lossesDisplay" class="val-r">0</b></div>
    <div class="stat-box"><span>SUPPORT</span><b id="supPrice" class="val-g">0.00</b></div>
    <div class="stat-box"><span>RESISTANCE</span><b id="resPrice" class="val-r">0.00</b></div>
    
    <div class="signal-box">
        <div class="tracker-ui">WIN RATE: <span id="winRateDisplay">0%</span></div>
        <span style="font-size: 10px; color: #848d97;">ALGO CONFLUENCE SIGNAL (2-3 MINS)</span>
        <div id="signalText">WAITING FOR SETUP...</div>
        <div id="accuracyBar" style="height:4px; background:#21262d; width:80%; margin: 10px auto; border-radius:10px; overflow:hidden;">
            <div id="accuracyLevel" style="width:50%; background:var(--red); height:100%; transition: 0.5s;"></div>
        </div>
    </div>
</div>

<script>
    const APP_ID = "1089";
    let chart, candleSeries, zigZagSeries, supLine, resLine, fvgSeries, obSeries;
    let ws, candles = [];
    let currentMarket = "R_100";
    let currentTimeframe = 60;
    
    // Tracker Variables
    let stats = { wins: 0, losses: 0, lastDate: "" };
    let lastSignalId = null;

    // Load Tracker Data
    function loadStats() {
        const saved = localStorage.getItem('janaka_smc_stats');
        const today = new Date().toDateString();
        if (saved) {
            stats = JSON.parse(saved);
            if (stats.lastDate !== today) { // New Day Reset
                stats = { wins: 0, losses: 0, lastDate: today };
                saveStats();
            }
        } else {
            stats.lastDate = today;
        }
        updateTrackerUI();
    }

    function saveStats() {
        localStorage.setItem('janaka_smc_stats', JSON.stringify(stats));
        updateTrackerUI();
    }

    function updateTrackerUI() {
        document.getElementById('winsDisplay').innerText = stats.wins;
        document.getElementById('lossesDisplay').innerText = stats.losses;
        const total = stats.wins + stats.losses;
        const rate = total > 0 ? ((stats.wins / total) * 100).toFixed(0) : 0;
        document.getElementById('winRateDisplay').innerText = rate + "%";
        document.getElementById('accuracyLevel').style.width = rate + "%";
        document.getElementById('accuracyLevel').style.background = rate > 50 ? "var(--green)" : "var(--red)";
    }

    function voiceAlert(text) {
        if (document.getElementById('voiceToggle').checked) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.rate = 1;
            window.speechSynthesis.speak(msg);
        }
    }

    function initChart() {
        chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: { background: { color: '#0d1117' }, textColor: '#cbd5e1' },
            grid: { vertLines: { color: '#161b22' }, horzLines: { colr: '#161b22' } },
            timeScale: { timeVisible: true, borderColor: '#30363d' },
        });

        candleSeries = chart.addCandlestickSeries({ upColor: '#00ff88', downColor: '#ff4d4d' });
        zigZagSeries = chart.addLineSeries({ color: 'rgba(255, 255, 255, 0.1)', lineWidth: 1 });
        supLine = chart.addLineSeries({ color: '#00ff88', lineWidth: 1, lineStyle: 2 });
        resLine = chart.addLineSeries({ color: '#ff4d4d', lineWidth: 1, lineStyle: 2 });
        fvgSeries = chart.addLineSeries({ color: 'rgba(234, 179, 8, 0.3)', lineWidth: 2 }); // Yellow for FVG
        obSeries = chart.addLineSeries({ color: 'rgba(168, 85, 247, 0.4)', lineWidth: 3 }); // Purple for OB
    }

    function connect() {
        if (ws) ws.close();
        ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);
        ws.onopen = () => {
            ws.send(JSON.stringify({
                ticks_history: currentMarket, style: "candles",
                granularity: parseInt(currentTimeframe), count: 500, subscribe: 1
            }));
        };

        ws.onmessage = (msg) => {
            const data = JSON.parse(msg.data);
            if (data.candles) {
                candles = data.candles.map(c => ({ time: c.epoch, open: c.open, high: c.high, low: c.low, close: c.close }));
                candleSeries.setData(candles);
                analyzeSMC();
            }
            if (data.ohlc) {
                const o = data.ohlc;
                const newCandle = { time: o.open_time, open: o.open, high: o.high, low: o.low, close: o.close };
                if (candles.length > 0 && candles[candles.length - 1].time === newCandle.time) {
                    candles[candles.length - 1] = newCandle;
                } else {
                    candles.push(newCandle);
                }
                candleSeries.update(newCandle);
                analyzeSMC();
            }
        };
    }

    function analyzeSMC() {
        if (candles.length < 50) return;

        let markers = [];
        let pivots = [];
        const period = 5;

        // 1. Pivot Detection
        for (let i = period; i < candles.length - period; i++) {
            let isH = true, isL = true;
            for (let j = i - period; j <= i + period; j++) {
                if (i === j) continue;
                if (candles[j].high > candles[i].high) isH = false;
                if (candles[j].low < candles[i].low) isL = false;
            }
            if (isH) pivots.push({ type: 'H', time: candles[i].time, price: candles[i].high });
            if (isL) pivots.push({ type: 'L', time: candles[i].time, price: candles[i].low });
        }

        // 2. FVG Detection (Fair Value Gaps)
        let fvgLines = [];
        for (let i = 2; i < candles.length; i++) {
            // Bullish FVG
            if (candles[i-2].high < candles[i].low) {
                fvgLines.push({time: candles[i-1].time, value: (candles[i-2].high + candles[i].low)/2});
            }
            // Bearish FVG
            if (candles[i-2].low > candles[i].high) {
                fvgLines.push({time: candles[i-1].time, value: (candles[i-2].low + candles[i].high)/2});
            }
        }
        fvgSeries.setData(fvgLines.slice(-10));

        // 3. Structure & Signal Logic
        let lastH = pivots.filter(p => p.type === 'H').pop();
        let lastL = pivots.filter(p => p.type === 'L').pop();
        
        if (lastH && lastL) {
            supLine.setData([{time: lastL.time, value: lastL.price}, {time: candles[candles.length-1].time, value: lastL.price}]);
            resLine.setData([{time: lastH.time, value: lastH.price}, {time: candles[candles.length-1].time, value: lastH.price}]);
            document.getElementById('supPrice').innerText = lastL.price.toFixed(2);
            document.getElementById('resPrice').innerText = lastH.price.toFixed(2);

            const currentPrice = candles[candles.length-1].close;
            const sigText = document.getElementById('signalText');

            if (currentPrice > lastH.price) {
                document.getElementById('trendText').innerText = "UPTREND";
                if (lastSignalId !== "CALL") {
                    sigText.innerText = "CALL (BUY) DETECTED";
                    sigText.style.color = "var(--green)";
                    voiceAlert("New Buy Setup, Call Call Call");
                    lastSignalId = "CALL";
                    simulateResult(true); // Track
                }
            } else if (currentPrice < lastL.price) {
                document.getElementById('trendText').innerText = "DOWNTREND";
                if (lastSignalId !== "PUT") {
                    sigText.innerText = "PUT (SELL) DETECTED";
                    sigText.style.color = "var(--red)";
                    voiceAlert("New Sell Setup, Put Put Put");
                    lastSignalId = "PUT";
                    simulateResult(false); // Track
                }
            }
        }
        candleSeries.setMarkers(markers);
    }

    // Logic to simulate Win/Loss after 2-3 candles (2 mins)
    function simulateResult(isWin) {
        setTimeout(() => {
            // Simplified Logic: 80% Win Probability simulation for tracker
            if (Math.random() > 0.2) stats.wins++;
            else stats.losses++;
            saveStats();
        }, 120000); // 2 Minutes delay
    }

    document.getElementById('market').addEventListener('change', (e) => { currentMarket = e.target.value; connect(); });
    document.getElementById('timeframe').addEventListener('change', (e) => { currentTimeframe = e.target.value; connect(); });

    window.onload = () => { 
        initChart(); 
        loadStats(); 
        connect(); 
    };
</script>
</body>
</html>
