<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JANAKA SMC DASHBOARD V5 PRO</title>
    <!-- TradingView Widget Script -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root {
            --bg-color: #05070a;
            --card-bg: #0d1117;
            --border-color: #21262d;
            --green: #00ff88;
            --red: #ff4d4d;
            --blue: #3b82f6;
            --orange: #f39c12;
            --purple: #a855f7;
            --yellow: #eab308;
            --text-main: #e6edf3;
        }

        * { box-sizing: border-box; }

        body { 
            background: var(--bg-color); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 8px; 
        }

        .header-title {
            text-align: center;
            color: var(--green);
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .top-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            padding: 8px; 
        }

        label { font-size: 9px; color: #848d97; font-weight: bold; margin-bottom: 4px; display: block; }
        
        select { 
            width: 100%; 
            padding: 6px; 
            border-radius: 5px; 
            background: #161b22; 
            color: var(--green); 
            border: 1px solid #30363d; 
            font-weight: bold;
            font-size: 11px;
        }

        /* Chart Area */
        #chart-wrapper {
            position: relative;
            width: 100%;
            height: 380px;
            background: #0d1117;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        #tv_chart_container {
            width: 100%;
            height: 100%;
        }

        /* Signal Analysis Section */
        .signal-section {
            margin-top: 10px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .technical-widget-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
        }

        .info-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            color: var(--yellow);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="header-title">JANAKA SMC DASHBOARD V5 PRO</div>

<div class="top-bar">
    <div class="card">
        <label>SELECT MARKET</label>
        <select id="market" onchange="updateDashboard()">
            <optgroup label="Forex Majors">
                <option value="FX:EURUSD" selected>EUR/USD</option>
                <option value="FX:GBPUSD">GBP/USD</option>
                <option value="FX:USDJPY">USD/JPY</option>
                <option value="FX:AUDUSD">AUD/USD</option>
                <option value="FX:USDCAD">USD/CAD</option>
            </optgroup>
            <optgroup label="Commodities & Crypto">
                <option value="OANDA:XAUUSD">Gold (XAU/USD)</option>
                <option value="BINANCE:BTCUSDT">Bitcoin (BTC/USDT)</option>
                <option value="BINANCE:ETHUSDT">Ethereum (ETH/USDT)</option>
            </optgroup>
        </select>
    </div>

    <div class="card">
        <label>TIMEFRAME</label>
        <select id="timeframe" onchange="updateDashboard()">
            <option value="1">1M (Scalping)</option>
            <option value="5" selected>5M (Intraday)</option>
            <option value="15">15M</option>
            <option value="60">1H</option>
        </select>
    </div>
</div>

<!-- Chart Container -->
<div id="chart-wrapper">
    <div id="tv_chart_container"></div>
</div>

<!-- Technical Signals Section -->
<div class="signal-section">
    <div class="info-box">
        TECHNICAL ANALYSIS & SIGNALS
    </div>
    
    <div class="technical-widget-container" id="technical_widget">
        <!-- TradingView Technical Analysis Widget dynamic insert -->
    </div>
</div>

<script>
    function loadChart(symbol, timeframe) {
        document.getElementById('tv_chart_container').innerHTML = '';
        
        new TradingView.widget({
            "autosize": true,
            "symbol": symbol,
            "interval": timeframe,
            "timezone": "Asia/Colombo",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#0d1117",
            "enable_publishing": false,
            "hide_top_toolbar": false,
            "allow_symbol_change": false,
            "container_id": "tv_chart_container"
        });
    }

    function loadSignals(symbol, timeframe) {
        const widgetContainer = document.getElementById('technical_widget');
        widgetContainer.innerHTML = ''; 

        // Timeframe mapping for TradingView Technical Analysis Widget
        let tfMap = "5m";
        if (timeframe === "1") tfMap = "1m";
        if (timeframe === "5") tfMap = "5m";
        if (timeframe === "15") tfMap = "15m";
        if (timeframe === "60") tfMap = "1h";

        const script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js';
        script.async = true;
        script.innerHTML = JSON.stringify({
            "interval": tfMap,
            "width": "100%",
            "isTransparent": true,
            "height": 380,
            "symbol": symbol,
            "showIntervalTabs": false,
            "displayMode": "single",
            "locale": "en",
            "colorTheme": "dark"
        });

        widgetContainer.appendChild(script);
    }

    function updateDashboard() {
        const symbol = document.getElementById('market').value;
        const timeframe = document.getElementById('timeframe').value;

        loadChart(symbol, timeframe);
        loadSignals(symbol, timeframe);
    }

    // Initial Load
    window.onload = function() {
        updateDashboard();
    };
</script>
</body>
</html>
