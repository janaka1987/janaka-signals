<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JANAKA SMC DASHBOARD V6 PRO + LED SIGNALS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

<style>
*{ margin:0; padding:0; box-sizing:border-box; }
:root{
    --bg:#05070A;
    --card:#111827;
    --border:#233044;
    --green:#00FF88;
    --red:#FF4D4D;
    --blue:#38BDF8;
    --text:#FFFFFF;
    --muted:#94A3B8;
    --neon-glow: 0 0 15px rgba(0, 255, 136, 0.4);
}

body{ background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); padding:16px; overflow-x:hidden; }
.container{ width:100%; max-width:1700px; margin:auto; }

.title{
    font-size:32px; font-weight:800; text-align:center; letter-spacing:2px; margin-bottom:20px;
    color:var(--green); text-shadow: 0 0 8px rgba(0,255,136,.6), 0 0 25px rgba(0,255,136,.25);
}

.grid-top{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:18px; }
.card{ background:linear-gradient(180deg, #111827, #0B1220); border:1px solid var(--border); border-radius:20px; padding:18px; box-shadow: 0 12px 25px rgba(0,0,0,.35); }
.card h3{ font-size:17px; font-weight:700; color:var(--blue); margin-bottom:14px; letter-spacing:.5px; }

select{ width:100%; height:56px; background:#08111F; color:white; border:1px solid #334155; border-radius:14px; padding:0 16px; font-size:17px; outline:none; transition:.25s; }
select:focus{ border-color:var(--green); box-shadow: 0 0 12px rgba(0,255,136,.3); }

.status{ font-size:17px; line-height:34px; }
.status span{ font-weight:700; color:var(--green); }

.chart-card{ padding:14px; }
.chart-title{ font-size:18px; font-weight:700; color:var(--blue); margin-bottom:12px; }
#chart{ width:100%; height:560px; border-radius:16px; overflow:hidden; background:#0A1322; border:1px solid var(--border); }

.bottom-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:18px; }

.info-box{
    background: linear-gradient(180deg, #111827, #0A1322); border:1px solid var(--border);
    border-radius:18px; padding:22px; text-align:center; box-shadow: 0 8px 20px rgba(0,0,0,.35);
}

.info-title{ font-size:14px; font-weight:600; letter-spacing:1px; color:var(--muted); margin-bottom:12px; }
.info-value{ font-size:26px; font-weight:700; font-family: 'JetBrains Mono', monospace; }

/* LED Effect */
.led-box {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.led-indicator {
    width: 20px; height: 20px; border-radius: 50%; margin-bottom: 10px;
    background: #334155; box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
}
.led-active-buy { background: var(--green); box-shadow: 0 0 20px var(--green); }
.led-active-sell { background: var(--red); box-shadow: 0 0 20px var(--red); }

.green{ color:var(--green); }
.cyan{ color:var(--blue); }
.red{ color:var(--red); }

@media(max-width:900px){
    .title{ font-size:26px; }
    .grid-top{ grid-template-columns:1fr; }
    .bottom-grid{ grid-template-columns:1fr; }
    #chart{ height:520px; }
}
</style>
</head>
<body>

<div class="container">
    <div class="title">JANAKA SMC DASHBOARD V6 PRO</div>

    <div class="grid-top">
        <div class="card">
            <h3>📊 SELECT MARKET</h3>
            <select id="market">
                <option value="R_10">Volatility 10</option>
                <option value="R_25">Volatility 25</option>
                <option value="R_50" selected>Volatility 50</option>
                <option value="R_75">Volatility 75</option>
                <option value="R_100">Volatility 100</option>
                <option value="JD10">Jump 10</option>
                <option value="JD25">Jump 25</option>
                <option value="JD50">Jump 50</option>
                <option value="JD75">Jump 75</option>
                <option value="JD100">Jump 100</option>
                <option value="RDBEAR">Bear Market</option>
                <option value="RDBULL">Bull Market</option>
                <option value="frxEURUSD">EUR / USD</option>
                <option value="frxGBPUSD">GBP / USD</option>
                <option value="frxUSDJPY">USD / JPY</option>
                <option value="frxAUDUSD">AUD / USD</option>
            </select>
        </div>

        <div class="card">
            <h3>🌐 CONNECTION STATUS</h3>
            <div class="status">
                Status : <span id="status">Connecting...</span><br><br>
                Market : <span id="marketName">Volatility 50</span>
            </div>
        </div>
    </div>

    <div class="card chart-card">
        <div class="chart-title">📈 LIVE MARKET CHART</div>
        <div id="chart"></div>
    </div>

    <div class="bottom-grid">
        <div class="info-box">
            <div class="info-title">📈 SMC TREND</div>
            <div class="info-value green" id="trend">WAIT</div>
        </div>

        <div class="info-box led-box">
            <div class="info-title">⚡ SIGNAL LED</div>
            <div id="led" class="led-indicator"></div>
            <div class="info-value" id="signalValue">NEUTRAL</div>
        </div>

        <div class="info-box">
            <div class="info-title">🛠 SYSTEM</div>
            <div class="info-value cyan" id="systemStatus">READY</div>
        </div>
    </div>
</div>

<script>
/*=========================================
            CONFIG
=========================================*/
const APP_ID = "1089";
const TIMEFRAME = 60;
const MAX_CANDLES = 300;

/*=========================================
        GLOBAL VARIABLES
=========================================*/
let ws = null;
let chart = null;
let candleSeries = null;
let trendSeries = null; 
let ema9Series = null;
let ema21Series = null;
let candles = [];
let currentMarket = "R_50";
let resistanceLine = null;
let supportLine = null;

/*=========================================
            DOM
=========================================*/
const marketSelect = document.getElementById("market");
const marketName = document.getElementById("marketName");
const status = document.getElementById("status");
const trend = document.getElementById("trend");
const systemStatus = document.getElementById("systemStatus");
const signalValue = document.getElementById("signalValue");
const led = document.getElementById("led");
const chartContainer = document.getElementById("chart");

/*=========================================
        NEW: TECHNICAL CALCULATIONS
=========================================*/
function calculateEMA(data, period) {
    let k = 2 / (period + 1);
    let emaArray = [];
    let prevEma = data[0].close;
    emaArray.push({ time: data[0].time, value: prevEma });

    for (let i = 1; i < data.length; i++) {
        let currentEma = (data[i].close - prevEma) * k + prevEma;
        emaArray.push({ time: data[i].time, value: currentEma });
        prevEma = currentEma;
    }
    return emaArray;
}

function calculateRSI(data, period = 14) {
    if (data.length < period + 1) return 50;
    let gains = 0, losses = 0;
    for (let i = 1; i <= period; i++) {
        let diff = data[data.length - i].close - data[data.length - i - 1].close;
        if (diff >= 0) gains += diff; else losses -= diff;
    }
    let rs = (gains / period) / (losses / period);
    return 100 - (100 / (1 + rs));
}

/*=========================================
        SMC LOGIC (AUTOMATIC)
=========================================*/
function calculateSMC() {
    if (candles.length < 20) return;

    let markers = [];
    let swings = [];
    const windowSize = 4;

    for (let i = windowSize; i < candles.length - windowSize; i++) {
        let isHigh = true; let isLow = true;
        for (let j = 1; j <= windowSize; j++) {
            if (candles[i].high < candles[i-j].high || candles[i].high < candles[i+j].high) isHigh = false;
            if (candles[i].low > candles[i-j].low || candles[i].low > candles[i+j].low) isLow = false;
        }
        if (isHigh) swings.push({ type: 'H', price: candles[i].high, time: candles[i].time });
        if (isLow) swings.push({ type: 'L', price: candles[i].low, time: candles[i].time });
    }

    let lastH = null, lastL = null;
    let currentDir = ""; 
    let lineData = [];

    swings.forEach((s) => {
        let label = ""; let color = "#FFFFFF";
        if (s.type === 'H') {
            if (lastH && s.price > lastH.price) {
                label = "HH"; color = "#00FF88";
                markers.push({ time: s.time, position: 'aboveBar', color: '#FFD700', shape: 'arrowDown', text: 'BOS' });
                currentDir = "UPTREND";
            } else if (lastH && s.price < lastH.price) {
                label = "LH"; color = "#FF4D4D";
                if(currentDir === "UPTREND") markers.push({ time: s.time, position: 'aboveBar', color: '#FF00FF', shape: 'arrowDown', text: 'CHOCH' });
                currentDir = "DOWNTREND";
            }
            lastH = s;
        } else {
            if (lastL && s.price < lastL.price) {
                label = "LL"; color = "#FF4D4D";
                markers.push({ time: s.time, position: 'belowBar', color: '#FFD700', shape: 'arrowUp', text: 'BOS' });
            } else if (lastL && s.price > lastL.price) {
                label = "HL"; color = "#00FF88";
                if(currentDir === "DOWNTREND") markers.push({ time: s.time, position: 'belowBar', color: '#FF00FF', shape: 'arrowUp', text: 'CHOCH' });
            }
            lastL = s;
        }
        if (label !== "") markers.push({ time: s.time, position: s.type === 'H' ? 'aboveBar' : 'belowBar', color: color, shape: 'text', text: label });
        lineData.push({ time: s.time, value: s.price });
    });

    // --- INTEGRATING EMA 9/21 SIGNAL LOGIC ---
    let ema9Data = calculateEMA(candles, 9);
    let ema21Data = calculateEMA(candles, 21);
    ema9Series.setData(ema9Data);
    ema21Series.setData(ema21Data);

    let lastEma9 = ema9Data[ema9Data.length - 1].value;
    let lastEma21 = ema21Data[ema21Data.length - 1].value;
    let currentRsi = calculateRSI(candles, 14);

    if (lastEma9 > lastEma21 && currentRsi > 50) {
        signalValue.innerText = "BUY";
        signalValue.className = "info-value green";
        led.className = "led-indicator led-active-buy";
        markers.push({ time: candles[candles.length-1].time, position: 'belowBar', color: '#00FF88', shape: 'arrowUp', text: '★ BUY' });
    } else if (lastEma9 < lastEma21 && currentRsi < 50) {
        signalValue.innerText = "SELL";
        signalValue.className = "info-value red";
        led.className = "led-indicator led-active-sell";
        markers.push({ time: candles[candles.length-1].time, position: 'aboveBar', color: '#FF4D4D', shape: 'arrowDown', text: '★ SELL' });
    } else {
        signalValue.innerText = "NEUTRAL";
        signalValue.className = "info-value cyan";
        led.className = "led-indicator";
    }

    candleSeries.setMarkers(markers);
    trendSeries.setData(lineData);
    trend.innerText = currentDir || "ANALYZING";
    trend.style.color = currentDir === "UPTREND" ? "#00FF88" : "#FF4D4D";

    // Auto S/R
    if (resistanceLine) candleSeries.removePriceLine(resistanceLine);
    if (supportLine) candleSeries.removePriceLine(supportLine);
    const highSwings = swings.filter(s => s.type === 'H');
    const lowSwings = swings.filter(s => s.type === 'L');
    if (highSwings.length >= 2) {
        resistanceLine = candleSeries.createPriceLine({ price: highSwings[highSwings.length-1].price, color: '#FF4D4D', lineWidth: 2, title: 'RESISTANCE' });
    }
    if (lowSwings.length >= 2) {
        supportLine = candleSeries.createPriceLine({ price: lowSwings[lowSwings.length-1].price, color: '#00FF88', lineWidth: 2, title: 'SUPPORT' });
    }
}

/*=========================================
        CREATE CHART
=========================================*/
function createChart(){
    chart = LightweightCharts.createChart(chartContainer,{
        layout:{ background:{ color:"#05070A" }, textColor:"#E5E7EB" },
        grid:{ vertLines:{ color:"#162033" }, horzLines:{ color:"#162033" } },
        rightPriceScale:{ borderColor:"#253244" },
        timeScale:{ borderColor:"#253244", timeVisible:true },
        width:chartContainer.clientWidth, height:560
    });

    candleSeries = chart.addCandlestickSeries({ upColor:"#00FF88", downColor:"#FF4D4D", borderUpColor:"#00FF88", borderDownColor:"#FF4D4D", wickUpColor:"#00FF88", wickDownColor:"#FF4D4D" });
    trendSeries = chart.addLineSeries({ color: 'rgba(56, 189, 248, 0.4)', lineWidth: 1, lineStyle: 2 });
    
    // Adding EMA lines visually
    ema9Series = chart.addLineSeries({ color: '#38BDF8', lineWidth: 2, title: 'EMA 9' });
    ema21Series = chart.addLineSeries({ color: '#F59E0B', lineWidth: 2, title: 'EMA 21' });

    window.addEventListener("resize",()=>{ chart.applyOptions({ width:chartContainer.clientWidth }); });
}

/*=========================================
        START APP & CONNECT
=========================================*/
createChart();

function connectDeriv() {
    status.innerHTML = "CONNECTING...";
    if (ws) ws.close();
    ws = new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=1089");
    ws.onopen = () => {
        status.innerHTML = "ONLINE";
        ws.send(JSON.stringify({ ticks_history: currentMarket, count: 300, end: "latest", granularity: TIMEFRAME, style: "candles" }));
    };
    ws.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        if (data.candles) {
            candles = data.candles.map(c => ({ time: Number(c.epoch), open: Number(c.open), high: Number(c.high), low: Number(c.low), close: Number(c.close) }));
            candleSeries.setData(candles);
            calculateSMC();
            systemStatus.innerHTML = "LIVE";
            ws.send(JSON.stringify({ ticks: currentMarket, subscribe: 1 }));
        }
        if (data.tick) {
            let price = Number(data.tick.quote);
            let epoch = Number(data.tick.epoch);
            let candleTime = Math.floor(epoch / TIMEFRAME) * TIMEFRAME;
            if (candles.length === 0) return;
            let lastCandle = candles[candles.length - 1];
            if (candleTime === lastCandle.time) {
                lastCandle.close = price;
                if (price > lastCandle.high) lastCandle.high = price;
                if (price < lastCandle.low) lastCandle.low = price;
                candleSeries.update(lastCandle);
            } else {
                let newCandle = { time: candleTime, open: price, high: price, low: price, close: price };
                candles.push(newCandle);
                if (candles.length > 300) candles.shift();
                candleSeries.update(newCandle);
                calculateSMC();
            }
        }
    };
    ws.onclose = () => { status.innerHTML = "OFFLINE"; setTimeout(connectDeriv, 2000); };
}

marketSelect.addEventListener("change", () => {
    currentMarket = marketSelect.value;
    marketName.innerHTML = marketSelect.options[marketSelect.selectedIndex].text;
    candles = [];
    connectDeriv();
});
    
connectDeriv();
</script>
</body>
</html>
