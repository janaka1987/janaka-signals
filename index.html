<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANAKA SIGNALS - Master Trading Dashboard</title>
    <!-- TradingView Lightweight Charts Stable Production Build -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --bg-dark: #070a0f;
            --card-bg: #0e131f;
            --border-color: #1e293b;
            --text-main: #cbd5e1;
            --bullish: #22c55e;
            --bearish: #ef4444;
            --accent: #3b82f6;
            --gold: #eab308;
            --purple: #a855f7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .dashboard-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 15px;
        }

        /* Top Header Component */
        .header-panel {
            grid-column: 1 / span 2;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .logo-area h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo-area h1 span { color: var(--accent); }
        .logo-area p { margin: 3px 0 0 0; font-size: 11px; color: #64748b; font-weight: 600; }

        .market-meta-grid {
            display: flex;
            gap: 30px;
            font-size: 13px;
        }

        .meta-box hdf { display: block; font-size: 11px; color: #64748b; margin-bottom: 2px; text-transform: uppercase; }
        .meta-box val { font-weight: bold; color: #fff; }

        /* Left Column Structure */
        .left-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            position: relative;
        }

        .asset-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        select {
            background-color: #1e293b;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            max-width: 280px;
        }

        .live-price-block { text-align: right; }
        .live-price-block h2 { margin: 0; font-size: 24px; color: var(--bullish); font-family: monospace; }
        .live-price-block span { font-size: 12px; font-weight: bold; }

        /* Chart Elements */
        #main-chart { width: 100%; height: 380px; background-color: #070a0f; border-radius: 6px; overflow: hidden; border: 1px solid #1e293b; }
        #rsi-chart { width: 100%; height: 110px; background-color: #070a0f; border-radius: 6px; overflow: hidden; border: 1px solid #1e293b; margin-top: 10px; }

        /* Right Column Structure */
        .right-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .signal-box {
            text-align: center;
            padding: 20px 15px;
            border-radius: 8px;
            background: linear-gradient(145deg, #111827, #060b13);
            border: 1px solid var(--border-color);
        }

        .signal-badge { font-size: 42px; font-weight: 900; margin: 10px 0; color: var(--bullish); text-shadow: 0 0 20px rgba(34,197,94,0.3); }

        /* Toggle Button Styles for Audio Alert Switch */
        .alarm-toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #111827;
            padding: 10px 15px;
            border-radius: 6px;
            margin-top: 12px;
            border: 1px solid #1e293b;
        }
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--bullish); }
        input:checked + .slider:before { transform: translateX(22px); }

        /* Tables & Items Labels Grid Mapping */
        .panel-header { font-size: 12px; font-weight: bold; color: #64748b; border-bottom: 1px solid #1e293b; padding-bottom: 5px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #0f172a; }
        .status-row span.val { color: #fff; font-weight: 600; }
        .status-row span.check { color: var(--bullish); font-weight: bold; }

        .history-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        .history-table th { padding: 8px; color: #64748b; background-color: #0f172a; }
        .history-table td { padding: 8px; border-bottom: 1px solid #1e293b; color: #fff; }
        .pill { padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        .pill.buy { background-color: rgba(34,197,94,0.15); color: var(--bullish); }
        .pill.sell { background-color: rgba(239,68,68,0.15); color: var(--bearish); }
    </style>
</head>
<body>
