<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JANAKA SMC DASHBOARD V3</title>

<script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>

<style>
body{
  background:#0b1220;
  color:white;
  font-family:Arial,sans-serif;
  margin:0;
  padding:15px;
}

h1{
  text-align:center;
  color:#00ff88;
  margin-top:0;
}

.card{
  background:#111c2e;
  border:1px solid #1f3b5b;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}

select{
  width:100%;
  padding:10px;
  font-size:16px;
  border-radius:8px;
  background:#0f172a;
  color:white;
  border:none;
}

#chart{
  height:500px;
  width:100%;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.box{
  background:#0f172a;
  padding:12px;
  border-radius:10px;
}

.value{
  font-size:18px;
  font-weight:bold;
  margin-top:5px;
}

.small{
  color:#94a3b8;
  font-size:13px;
}
</style>
</head>

<body>

<h1>JANAKA SMC DASHBOARD V3</h1>

<div class="card">
  <h3>Select Market</h3>
  <select id="market">
    <option value="R_10">Volatility 10</option>
    <option value="R_25">Volatility 25</option>
    <option value="R_50">Volatility 50</option>
    <option value="R_75">Volatility 75</option>
    <option value="R_100" selected>Volatility 100</option>

    <option value="JD10">Jump 10</option>
    <option value="JD25">Jump 25</option>
    <option value="JD50">Jump 50</option>
    <option value="JD75">Jump 75</option>
    <option value="JD100">Jump 100</option>

    <option value="RDBEAR">Bear Market</option>
    <option value="RDBULL">Bull Market</option>

    <option value="frxEURUSD">EUR/USD</option>
    <option value="frxGBPUSD">GBP/USD</option>
    <option value="frxUSDJPY">USD/JPY</option>
    <option value="frxAUDUSD">AUD/USD</option>
  </select>
</div>

<div class="card">
  <h3>Market Info</h3>
  <p>Selected Market: <span id="marketName">Volatility 100</span></p>
  <p>Status: <span id="status">Connecting...</span></p>
  <p class="small" id="infoText">Loading 1 minute candles...</p>
</div>

<div class="card">
  <h3>📈 Live Candlestick Chart</h3>
  <div id="chart"></div>
</div>



<div class="card">
  <h3>⚡ Market Structure</h3>
  <p>BOS: <span id="bos">NONE</span></p>
  <p>CHOCH: <span id="choch">NONE</span></p>
  <p>Trend: <span id="trend">WAIT</span></p>
</div>

<script>
const APP_ID = "1089";
const TIMEFRAME = 60; // 1 minute candles
const MAX_CANDLES = 150;

const marketSelect = document.getElementById("market");
const marketNameEl = document.getElementById("marketName");
const statusEl = document.getElementById("status");
const infoTextEl = document.getElementById("infoText");
const chartContainer = document.getElementById("chart");

let ws = null;
let chart = null;
let candleSeries = null;
//--------------------------------------------------
// DATA
//--------------------------------------------------

let candles = [];
let markers = [];

const PIVOT = 2;
const MAX_SWINGS = 200;

let currentMarket = marketSelect.value;

//--------------------------------------------------
// SWINGS
//--------------------------------------------------

let swingHighs = [];
let swingLows = [];

let lastSwingHigh = null;
let lastSwingLow = null;

//--------------------------------------------------
// MARKET STRUCTURE
//--------------------------------------------------

let HH = null;
let HL = null;
let LH = null;
let LL = null;

let previousHH = null;
let previousHL = null;
let previousLH = null;
let previousLL = null;

let trend = "RANGE";

let BOS = "NONE";
let CHOCH = "NONE";

//--------------------------------------------------
// STRUCTURE STATE
//--------------------------------------------------

let lastBreakDirection = null;
let lastStructureType = null;

//--------------------------------------------------
// LIQUIDITY
//--------------------------------------------------

let weakHigh = null;
let weakLow = null;

let strongHigh = null;
let strongLow = null;

//--------------------------------------------------
// ARRAYS
//--------------------------------------------------

let bosLines = [];
let chochLines = [];
let structureLabels = [];
let lastBOS = null;
let lastCHOCH = null;
function setText(id, text){
  document.getElementById(id).innerText = text;
}

function resetStructure() {

    candles = [];
    markers = [];

    swingHighs = [];
    swingLows = [];

    lastSwingHigh = null;
    lastSwingLow = null;

    HH = null;
    HL = null;
    LH = null;
    LL = null;

    previousHH = null;
    previousHL = null;
    previousLH = null;
    previousLL = null;

    trend = "RANGE";

    BOS = "NONE";
    CHOCH = "NONE";

    lastBreakDirection = null;
    lastStructureType = null;

    weakHigh = null;
    weakLow = null;

    strongHigh = null;
    strongLow = null;

    bosLines = [];
    chochLines = [];
    structureLabels = [];

    

    setText("bos", "NONE");
    setText("choch", "NONE");
    setText("trend", "WAIT");

    if (candleSeries) {
        candleSeries.setData([]);
        if (candleSeries.setMarkers) {
            candleSeries.setMarkers([]);
        }
    }
}

function marketToDisplayName(value){
  const opt = [...marketSelect.options].find(o => o.value === value);
  return opt ? opt.text : value;
}

function updateMarketName(){
  marketNameEl.innerText = marketToDisplayName(currentMarket);
}

function createChartIfNeeded(){
  if (chart) return;

  chart = LightweightCharts.createChart(chartContainer, {
    layout: {
      background: { color: "#0f172a" },
      textColor: "#ffffff"
    },
    grid: {
      vertLines: { color: "#1f2937" },
      horzLines: { color: "#1f2937" }
    },
    rightPriceScale: {
      borderColor: "#1f2937"
    },
    timeScale: {
      borderColor: "#1f2937",
      timeVisible: true,
      secondsVisible: false
    },
    width: chartContainer.clientWidth,
    height: 500
  });

  candleSeries = chart.addCandlestickSeries({
    upColor: "#00ff88",
    downColor: "#ff4d4d",
    borderUpColor: "#00ff88",
    borderDownColor: "#ff4d4d",
    wickUpColor: "#00ff88",
    wickDownColor: "#ff4d4d"
});
    
    
    

  const ro = new ResizeObserver(entries => {
    for (const entry of entries) {
      const { width } = entry.contentRect;
      chart.applyOptions({ width: Math.floor(width) });
    }
  });
  ro.observe(chartContainer);
}

function connect(){
  if (ws) {
    try { ws.close(); } catch (e) {}
    ws = null;
  }

  statusEl.innerText = "Connecting...";
  infoTextEl.innerText = "Loading 1 minute candles...";
  resetStructure();
  candles = [];
  if (candleSeries) candleSeries.setData([]);

  ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

  ws.onopen = () => {
    statusEl.innerText = "Connected 🟢";

    ws.send(JSON.stringify({
      ticks_history: currentMarket,
      end: "latest",
      style: "candles",
      granularity: TIMEFRAME,
      count: MAX_CANDLES,
      subscribe: 1
    
    }));
  
ws.send(JSON.stringify({
    ticks: currentMarket,
    subscribe: 1
}));
};
  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
if (data.msg_type === "tick") {

    const price = Number(data.tick.quote);
    const epoch = Number(data.tick.epoch);

    const candleTime = Math.floor(epoch / 60) * 60;

    if (candles.length === 0) return;

    let last = candles[candles.length - 1];

    if (last.time === candleTime) {

        last.close = price;

        if (price > last.high) last.high = price;
        if (price < last.low) last.low = price;

        candleSeries.update(last);

    } else {

        const newCandle = {
            time: candleTime,
            open: last.close,
            high: price,
            low: price,
            close: price
        };

        candles.push(newCandle);

        if (candles.length > MAX_CANDLES) {
            candles.shift();
        }

        candleSeries.update(newCandle);

        buildStructureFromCandles();
    }

    return;
}
    if (data.error) {
      statusEl.innerText = "Error 🔴";
      infoTextEl.innerText = data.error.message || "API error";
      return;
    }

    if (data.msg_type === "candles" && Array.isArray(data.candles)) {
      const formatted = data.candles
        .map(c => ({
          time: Number(c.epoch),
          open: Number(c.open),
          high: Number(c.high),
          low: Number(c.low),
          close: Number(c.close)
        }))
        .filter(c => Number.isFinite(c.time) && Number.isFinite(c.open) && Number.isFinite(c.high) && Number.isFinite(c.low) && Number.isFinite(c.close));

      candles = formatted;
      candleSeries.setData(candles);
      chart.timeScale().fitContent();

      infoTextEl.innerText = `Loaded ${candles.length} candles`;
      buildStructureFromCandles();
      return;
    }

    if (data.msg_type === "history" && data.history && Array.isArray(data.history.prices) && Array.isArray(data.history.times)) {
      // Fallback if the API returns history arrays.
      const prices = data.history.prices;
      const times = data.history.times;

      const fallback = [];
      for (let i = 0; i < Math.min(prices.length, times.length); i++) {
        const p = Number(prices[i]);
        const t = Number(times[i]);
        if (Number.isFinite(p) && Number.isFinite(t)) {
          fallback.push({
            time: t,
            open: p,
            high: p,
            low: p,
            close: p
          });
        }
      }

      if (fallback.length) {
        candles = fallback;
        candleSeries.setData(candles);
        chart.timeScale().fitContent();
        infoTextEl.innerText = `Loaded ${candles.length} candles`;
        buildStructureFromCandles();
      }
      return;
    }

    // Live candle update fallback
    if (data.msg_type === "candles" && data.candles && !Array.isArray(data.candles)) {
      const c = data.candles;
      const candle = {
        time: Number(c.epoch),
        open: Number(c.open),
        high: Number(c.high),
        low: Number(c.low),
        close: Number(c.close)
      };

      if (Number.isFinite(candle.time) && Number.isFinite(candle.open) && Number.isFinite(candle.high) && Number.isFinite(candle.low) && Number.isFinite(candle.close)) {
        upsertCandle(candle);
      }
    }
  };

  ws.onerror = () => {
    statusEl.innerText = "Error 🔴";
    infoTextEl.innerText = "WebSocket error";
  };

  ws.onclose = () => {
    statusEl.innerText = "Disconnected 🔴";
  };
}

function upsertCandle(candle){
  if (!candles.length) {
    candles.push(candle);
    candleSeries.setData(candles);
    return;
  }

  const last = candles[candles.length - 1];

  if (last.time === candle.time) {
    candles[candles.length - 1] = candle;
    candleSeries.update(candle);
  } else if (candle.time > last.time) {
    candles.push(candle);
    if (candles.length > MAX_CANDLES) candles.shift();
    candleSeries.update(candle);
  } else {
    const idx = candles.findIndex(x => x.time === candle.time);
    if (idx >= 0) {
      candles[idx] = candle;
      candleSeries.setData(candles);
    }
  }

  buildStructureFromCandles();
}
function detectSwingPoints() {

    swingHighs = [];
    swingLows = [];
    markers = [];

    if (candles.length < (PIVOT * 2 + 1))
        return;

    for (let i = PIVOT; i < candles.length - PIVOT; i++) {

        let isSwingHigh = true;
        let isSwingLow = true;

        const currentHigh = candles[i].high;
        const currentLow = candles[i].low;

        for (let j = i - PIVOT; j <= i + PIVOT; j++) {

            if (j === i)
                continue;

            if (candles[j].high >= currentHigh)
                isSwingHigh = false;

            if (candles[j].low <= currentLow)
                isSwingLow = false;
        }

        if (isSwingHigh) {

            swingHighs.push({
                index: i,
                time: candles[i].time,
                price: currentHigh
            });

            markers.push({
                time: candles[i].time,
                position: "aboveBar",
                color: "#ff4444",
                shape: "arrowDown",
                text: ""
            });
        }

        if (isSwingLow) {

            swingLows.push({
                index: i,
                time: candles[i].time,
                price: currentLow
            });

            markers.push({
                time: candles[i].time,
                position: "belowBar",
                color: "#00ff88",
                shape: "arrowUp",
                text: ""
            });
        }
    }

    if (swingHighs.length > MAX_SWINGS)
        swingHighs.splice(0, swingHighs.length - MAX_SWINGS);

    if (swingLows.length > MAX_SWINGS)
        swingLows.splice(0, swingLows.length - MAX_SWINGS);

    
}
function filterStructureSwings() {

    let filteredHighs = [];

    for (const s of swingHighs) {

        if (filteredHighs.length === 0) {
            filteredHighs.push(s);
            continue;
        }

        let last = filteredHighs[filteredHighs.length - 1];

        if (s.index - last.index < PIVOT * 3) {

            if (s.price > last.price)
                filteredHighs[filteredHighs.length - 1] = s;

        } else {

            filteredHighs.push(s);

        }
    }

    swingHighs = filteredHighs;

    let filteredLows = [];

    for (const s of swingLows) {

        if (filteredLows.length === 0) {
            filteredLows.push(s);
            continue;
        }

        let last = filteredLows[filteredLows.length - 1];

        if (s.index - last.index < PIVOT * 3) {

            if (s.price < last.price)
                filteredLows[filteredLows.length - 1] = s;

        } else {

            filteredLows.push(s);

        }
    }

    swingLows = filteredLows;

}
    function buildStructureFromCandles() {

    if (candles.length < (PIVOT * 2 + 1))
        return;

    detectSwingPoints();
filterStructureSwings();
    HH = null;
    HL = null;
    LH = null;
    LL = null;

    //============================
// STRUCTURE CLASSIFICATION
//============================

HH = null;
HL = null;
LH = null;
LL = null;

let lastHigh = null;
let lastLow = null;

for (const sh of swingHighs) {

    if (!lastHigh) {

        sh.type = "HH";
        lastHigh = sh;
        HH = sh;
        continue;

    }

    if (sh.price > lastHigh.price) {

        sh.type = "HH";
        HH = sh;

    } else {

        sh.type = "LH";
        LH = sh;

    }

    lastHigh = sh;
}

for (const sl of swingLows) {

    if (!lastLow) {

        sl.type = "HL";
        lastLow = sl;
        HL = sl;
        continue;

    }

    if (sl.price > lastLow.price) {

        sl.type = "HL";
        HL = sl;

    } else {

        sl.type = "LL";
        LL = sl;

    }

    lastLow = sl;
}
    

 
    
    



    

        
        
            

    
        

        
        

    //------------------------------------------------
    // Dashboard
    //------------------------------------------------

    

    //------------------------------------------------
    // Trend
    //------------------------------------------------

    //------------------------------------------------
// BOS
//------------------------------------------------

BOS = "NONE";
trend = "RANGE";

const lastCandle = candles[candles.length - 1];

// Up Trend
if (HH && HL) {

    trend = "UPTREND";

    if (
        lastCandle.close > HH.price &&
        brokenSwing !== HH.time
    ) {

        BOS = "BOS UP";
brokenSwing = HH.time;

lastBOS = {
    time: lastCandle.time,
    direction: "UP"
};

markers.push({
    time: lastCandle.time,
    position: "aboveBar",
    color: "#ffff00",
    shape: "arrowUp",
    text: "BOS"
});

        
            
    }
}

// Down Trend
if (LH && LL) {

    trend = "DOWNTREND";

    if (
        lastCandle.close < LL.price &&
        brokenSwing !== LL.time
    ) {

    BOS = "BOS DOWN";
brokenSwing = LL.time;

lastBOS = {
    time: lastCandle.time,
    direction: "DOWN"
};

markers.push({
    time: lastCandle.time,
    position: "belowBar",
    color: "#ffff00",
    shape: "arrowDown",
    text: "BOS"
});

        
            
    }
}

drawStructureMarkers();

setText("bos", BOS);
setText("choch", CHOCH);
setText("trend", trend);






    


            





        

        







    

    

  

 

    

    
    
}
        
function drawStructureMarkers() {

    let allMarkers = [];

    // HH / LH
    swingHighs.forEach(s => {

        allMarkers.push({
            time: s.time,
            position: "aboveBar",
            color: s.type === "HH" ? "#00bfff" : "#ff9900",
            shape: "arrowDown",
            text: s.type || ""
        });

    });

    // HL / LL
    swingLows.forEach(s => {

        allMarkers.push({
            time: s.time,
            position: "belowBar",
            color: s.type === "HL" ? "#00ff66" : "#ff3333",
            shape: "arrowUp",
            text: s.type || ""
        });

    });

    // BOS
    if (lastBOS) {

        allMarkers.push({

            time: lastBOS.time,
            position: BOS === "BOS UP" ? "aboveBar" : "belowBar",
            color: "#FFD700",
            shape: BOS === "BOS UP" ? "arrowUp" : "arrowDown",
            text: "BOS"

        });

    }

    // CHOCH
    if (lastCHOCH) {

        allMarkers.push({

            time: lastCHOCH.time,
            position: CHOCH === "CHOCH UP" ? "belowBar" : "aboveBar",
            color: "#00FFFF",
            shape: CHOCH === "CHOCH UP" ? "arrowUp" : "arrowDown",
            text: "CHOCH"

        });

    }

    candleSeries.setMarkers(allMarkers);

}

    

    
    
            

    
    
            

    







        

            
        



        


        
        

    


marketSelect.addEventListener("change", () => {
  currentMarket = marketSelect.value;
  updateMarketName();
  connect();
});

updateMarketName();
createChartIfNeeded();
connect();
</script>

</body>
</html>
