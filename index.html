<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANAKA SMC DASHBOARD V4 PRO</title>
    <script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-color: #05070a;
            --card-bg: #0d1117;
            --border-color: #21262d;
            --green: #00ff88;
            --red: #ff4d4d;
            --blue: #3b82f6;
            --orange: #f39c12;
            --text-main: #e6edf3;
        }

        body { 
            background: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 15px; 
        }

        .header-title {
            text-align: center;
            color: var(--green);
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        /* Top Bar Layout for the small boxes */
        .top-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        label { font-size: 11px; color: #848d97; font-weight: bold; margin-bottom: 5px; display: block; }
        
        select { 
            width: 100%; 
            padding: 10px; 
            border-radius: 6px; 
            background: #161b22; 
            color: var(--green); 
            border: 1px solid #30363d; 
            font-weight: bold;
            outline: none;
        }

        #chart { 
            height: 550px; 
            width: 100%; 
            border-radius: 10px; 
            overflow: hidden; 
            position: relative;
        }

        .info-row-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100%;
        }

        .info-row { font-size: 13px; font-weight: bold; }
        .val-g { color: var(--green); }
        .val-r { color: var(--red); }
        .val-b { color: var(--blue); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stat-box { 
            background: var(--card-bg); 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-box span { display: block; font-size: 10px; color: #848d97; text-transform: uppercase; margin-bottom: 5px; }
        .stat-box b { font-size: 15px; }

        .legend-horizontal {
            display: flex;
            gap: 15px;
            font-size: 11px;
            justify-content: center;
            margin-top: 5px;
        }
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>

<div class="header-title">JANAKA SMC DASHBOARD V4 PRO</div>

<!-- Top Boxes moved above chart -->
<div class="top-bar">
    <div class="card">
        <label>MARKET SELECTION & TIMEFRAME</label>
        <div style="display: flex; gap: 10px;">
            <select id="market">
                <optgroup label="Volatility Indices">
                    <option value="R_10">Volatility 10</option>
                    <option value="R_25">Volatility 25</option>
                    <option value="R_50">Volatility 50</option>
                    <option value="R_75">Volatility 75</option>
                    <option value="R_100" selected>Volatility 100</option>
                </optgroup>
                <optgroup label="Forex">
                    <option value="frxEURUSD">EUR/USD</option>
                    <option value="frxGBPUSD">GBP/USD</option>
                </optgroup>
            </select>
            <select id="timeframe">
                <option value="60">1M</option>
                <option value="300">5M</option>
                <option value="900">15M</option>
                <option value="3600">1H</option>
            </select>
        </div>
    </div>

    <div class="card">
        <label>LIVE MARKET MONITOR</label>
        <div class="info-row-container">
            <div class="info-row">Status: <span class="val-g">● Connected</span></div>
            <div class="info-row">Trend: <span id="sideTrend" class="val-g">UPTREND</span></div>
            <div class="info-row">Time: <span id="serverTime" style="color:#848d97">--:--:--</span></div>
        </div>
        <div class="legend-horizontal">
            <div><span class="dot" style="background:var(--green)"></span> Bullish</div>
            <div><span class="dot" style="background:var(--red)"></span> Bearish</div>
            <div><span class="dot" style="background:var(--blue)"></span> BOS/CHOCH</div>
        </div>
    </div>
</div>

<!-- Full Width Chart -->
<div class="card" style="padding: 5px;">
    <div id="chart"></div>
</div>

<!-- Bottom Stats -->
<div class="stats-grid">
    <div class="stat-box"><span>TREND</span><b id="trendText" class="val-g">ANALYZING</b></div>
    <div class="stat-box"><span>BOS</span><b id="bosText" class="val-b">NONE</b></div>
    <div class="stat-box"><span>CHOCH</span><b id="chochText" class="val-b">NONE</b></div>
    <div class="stat-box"><span>SUPPORT</span><b id="supPrice" class="val-g">0.00</b></div>
    <div class="stat-box"><span>RESISTANCE</span><b id="resPrice" class="val-r">0.00</b></div>
</div>

<script>
    const APP_ID = "1089";
    let chart, candleSeries, trendLineSeries, ws, srLines = [];
    let candles = [];
    let currentMarket = "R_100";
    let currentTimeframe = 60;

    function initChart() {
        chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: { background: { color: '#0d1117' }, textColor: '#cbd5e1' },
            grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            rightPriceScale: { borderColor: '#30363d' },
            timeScale: { borderColor: '#30363d', timeVisible: true }
        });

        candleSeries = chart.addCandlestickSeries({
            upColor: '#00ff88', downColor: '#ff4d4d',
            borderUpColor: '#00ff88', borderDownColor: '#ff4d4d',
            wickUpColor: '#00ff88', wickDownColor: '#ff4d4d'
        });

        // Series for Auto Trend Line
        trendLineSeries = chart.addLineSeries({
            color: '#f39c12',
            lineWidth: 2,
            lineStyle: 0,
            lineType: 0,
        });
    }

    function connect() {
        if (ws) ws.close();
        ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

        ws.onopen = () => {
            candles = [];
            candleSeries.setData([]);
            trendLineSeries.setData([]);
            ws.send(JSON.stringify({
                ticks_history: currentMarket,
                end: "latest", style: "candles",
                granularity: parseInt(currentTimeframe),
                count: 300, subscribe: 1
            }));
        };

        ws.onmessage = (msg) => {
            const data = JSON.parse(msg.data);
            if (data.candles) {
                candles = data.candles.map(c => ({
                    time: c.epoch, open: c.open, high: c.high, low: c.low, close: c.close
                }));
                candleSeries.setData(candles);
                analyzeSMC();
            }
            if (data.ohlc) {
                const o = data.ohlc;
                const newCandle = { time: o.open_time, open: o.open, high: o.high, low: o.low, close: o.close };
                candleSeries.update(newCandle);
                document.getElementById('serverTime').innerText = new Date().toLocaleTimeString();

                if (candles.length > 0 && candles[candles.length-1].time === newCandle.time) {
                    candles[candles.length-1] = newCandle;
                } else {
                    candles.push(newCandle);
                }
                if(candles.length % 2 === 0) analyzeSMC();
            }
        };
    }

    function analyzeSMC() {
        if (candles.length < 30) return;

        const period = 10; 
        let highs = [], lows = [], markers = [];
        
        for (let i = period; i < candles.length - period; i++) {
            let isHigh = true, isLow = true;
            for (let j = i - period; j <= i + period; j++) {
                if (candles[j].high > candles[i].high) isHigh = false;
                if (candles[j].low < candles[i].low) isLow = false;
            }
            if (isHigh) highs.push({ time: candles[i].time, price: candles[i].high });
            if (isLow) lows.push({ time: candles[i].time, price: candles[i].low });
        }

        // --- TREND LINE LOGIC ---
        // Draw trend line based on the last two significant pivots
        let trendData = [];
        if (highs.length >= 2 && lows.length >= 2) {
            const lastHigh = highs[highs.length - 1];
            const prevHigh = highs[highs.length - 2];
            const lastLow = lows[lows.length - 1];
            const prevLow = lows[lows.length - 2];

            // If price is in an uptrend, connect lows, if downtrend, connect highs
            const currentTrend = candles[candles.length-1].close > candles[candles.length-20].close ? 'UP' : 'DOWN';
            
            if (currentTrend === 'UP') {
                trendData = [{ time: prevLow.time, value: prevLow.price }, { time: lastLow.time, value: lastLow.price }];
                // Extend the line to the current candle
                const slope = (lastLow.price - prevLow.price) / (lastLow.time - prevLow.time);
                trendData.push({ time: candles[candles.length-1].time, value: lastLow.price + slope * (candles[candles.length-1].time - lastLow.time) });
            } else {
                trendData = [{ time: prevHigh.time, value: prevHigh.price }, { time: lastHigh.time, value: lastHigh.price }];
                const slope = (lastHigh.price - prevHigh.price) / (lastHigh.time - prevHigh.time);
                trendData.push({ time: candles[candles.length-1].time, value: lastHigh.price + slope * (candles[candles.length-1].time - lastHigh.time) });
            }
        }
        trendLineSeries.setData(trendData);

        // BOS & Markers Logic
        const lastClose = candles[candles.length - 1].close;
        const prevHighPrice = highs[highs.length - 1]?.price;
        const prevLowPrice = lows[lows.length - 1]?.price;

        if (prevHighPrice && lastClose > prevHighPrice) {
            document.getElementById('bosText').innerText = "BULLISH BOS";
            document.getElementById('trendText').innerText = "UPTREND";
            document.getElementById('sideTrend').innerText = "UPTREND";
            document.getElementById('sideTrend').className = "val-g";
        } else if (prevLowPrice && lastClose < prevLowPrice) {
            document.getElementById('bosText').innerText = "BEARISH BOS";
            document.getElementById('trendText').innerText = "DOWNTREND";
            document.getElementById('sideTrend').innerText = "DOWNTREND";
            document.getElementById('sideTrend').className = "val-r";
        }

        // Support/Resistance update
        if(prevHighPrice) document.getElementById('resPrice').innerText = prevHighPrice.toFixed(2);
        if(prevLowPrice) document.getElementById('supPrice').innerText = prevLowPrice.toFixed(2);
    }

    document.getElementById('market').addEventListener('change', (e) => { currentMarket = e.target.value; connect(); });
    document.getElementById('timeframe').addEventListener('change', (e) => { currentTimeframe = e.target.value; connect(); });

    window.onload = () => { initChart(); connect(); };
</script>

</body>
</html>
