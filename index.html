<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JANAKA SMC DASHBOARD V6 PRO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#05070A;

font-family:'Inter',sans-serif;

color:white;

padding:16px;

}

.container{

max-width:1600px;

margin:auto;

}

.title{

text-align:center;

font-size:34px;

font-weight:800;

color:#00ff88;

letter-spacing:2px;

margin-bottom:20px;

text-shadow:
0 0 10px #00ff88,
0 0 20px #00ff88;

}

.card{

background:#111827;

border:1px solid #1f2937;

border-radius:18px;

padding:16px;

margin-bottom:16px;

box-shadow:

0 8px 25px rgba(0,0,0,.45);

}

.card h3{

font-size:18px;

margin-bottom:12px;

color:#60a5fa;

}

.top-grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:16px;

margin-bottom:16px;

}

select{

width:100%;

height:54px;

background:#0F172A;

color:white;

border:1px solid #334155;

border-radius:12px;

padding:0 14px;

font-size:17px;

outline:none;

}

select:focus{

border-color:#00ff88;

}

.status{

font-size:17px;

line-height:32px;

}

.status span{

font-weight:bold;

color:#00ff88;

}

#chart{

width:100%;

height:560px;

border-radius:16px;

overflow:hidden;

}

.bottom-grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:14px;

margin-top:16px;

}

.info-box{

background:#0F172A;

border:1px solid #1f2937;

border-radius:16px;

padding:16px;

text-align:center;

}

.info-title{

font-size:15px;

color:#94A3B8;

margin-bottom:10px;

}

.info-value{

font-size:24px;

font-weight:700;

font-family:'JetBrains Mono',monospace;

}

.green{

color:#00ff88;

}

.red{

color:#ff4d4d;

}

.blue{

color:#60a5fa;

}

.yellow{

color:#facc15;

}

@media(max-width:768px){

.title{

font-size:26px;

}

.top-grid{

grid-template-columns:1fr;

}

.bottom-grid{

grid-template-columns:1fr 1fr;

}

#chart{

height:520px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="title">

JANAKA SMC DASHBOARD V6 PRO

</div>

<div class="top-grid">

<div class="card">

<h3>Market</h3>

<select id="market">

<option value="R_10">Volatility 10</option>

<option value="R_25">Volatility 25</option>

<option value="R_50" selected>Volatility 50</option>

<option value="R_75">Volatility 75</option>

<option value="R_100">Volatility 100</option>

<option value="JD10">Jump 10</option>

<option value="JD25">Jump 25</option>

<option value="JD50">Jump 50</option>

<option value="JD75">Jump 75</option>

<option value="JD100">Jump 100</option>

<option value="RDBEAR">Bear Market</option>

<option value="RDBULL">Bull Market</option>

<option value="frxEURUSD">EUR/USD</option>

<option value="frxGBPUSD">GBP/USD</option>

<option value="frxUSDJPY">USD/JPY</option>

<option value="frxAUDUSD">AUD/USD</option>

</select>

</div>

<div class="card">

<h3>Connection</h3>

<div class="status">

Status :
<span id="status">

Disconnected

</span>

<br><br>

Market :

<span id="marketName">

Volatility 50

</span>

</div>

</div>

</div>

<div class="card">

<h3>Live Market</h3>

<div id="chart"></div>

</div>

<div class="bottom-grid">

<div class="info-box">

<div class="info-title">

Trend

</div>

<div class="info-value green" id="trend">

WAIT

</div>

</div>

<div class="info-box">

<div class="info-title">

Signal

</div>

<div class="info-value yellow" id="signal">

NONE

</div>

</div>

<div class="info-box">

<div class="info-title">

BOS

</div>

<div class="info-value blue" id="bos">

NONE

</div>

</div>

<div class="info-box">

<div class="info-title">

CHOCH

</div>

<div class="info-value red" id="choch">

NONE

</div>

</div>

</div>

</div>

</body>

</html>
