<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANAKA SMC DASHBOARD V5.1 PRO</title>
    <!-- පරණ link එක වැඩ නොකළොත් කියා නවතම stable link එකක් එක් කර ඇත -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-color: #05070a;
            --card-bg: #0d1117;
            --border-color: #21262d;
            --green: #00ff88;
            --red: #ff4d4d;
            --blue: #3b82f6;
            --orange: #f39c12;
            --purple: #a855f7;
            --yellow: #eab308;
            --text-main: #e6edf3;
        }

        body { 
            background: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 10px; 
            overflow-x: hidden;
        }

        .header-title {
            text-align: center;
            color: var(--green);
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        .top-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }

        .card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            padding: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        label { font-size: 10px; color: #848d97; font-weight: bold; margin-bottom: 5px; display: block; }
        
        select { 
            width: 100%; 
            padding: 8px; 
            border-radius: 5px; 
            background: #161b22; 
            color: var(--green); 
            border: 1px solid #30363d; 
            font-weight: bold;
            outline: none;
            font-size: 12px;
            cursor: pointer;
        }

        .slider-row { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
        input[type="range"] { flex: 1; accent-color: var(--green); cursor: pointer; }
        .slider-val { font-size: 10px; color: var(--green); min-width: 25px; font-weight: bold; }

        #chart-container { 
            height: 450px; 
            width: 100%; 
            border-radius: 8px; 
            overflow: hidden; 
            position: relative;
            background: #0d1117;
        }

        #chart { width: 100%; height: 100%; }

        .info-row-container { display: flex; justify-content: space-around; gap: 10px; }
        .info-row { font-size: 11px; font-weight: bold; }
        .val-g { color: var(--green); }
        .val-r { color: var(--red); }
        .val-y { color: var(--yellow); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .stat-box { 
            background: var(--card-bg); 
            padding: 10px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-box span { display: block; font-size: 9px; color: #848d97; text-transform: uppercase; margin-bottom: 3px; }
        .stat-box b { font-size: 13px; }

        .signal-box {
            grid-column: span 4;
            background: linear-gradient(145deg, #161b22, #0d1117);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid var(--border-color);
            margin-top: 5px;
            position: relative;
        }

        #signalText { font-size: 22px; font-weight: bold; letter-spacing: 2px; display: block; }
        #accuracyText { 
            font-size: 14px; 
            margin-top: 5px; 
            display: inline-block; 
            padding: 3px 10px; 
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
        }

        .win-rate-tag { position: absolute; top: 10px; right: 15px; font-size: 10px; color: var(--blue); font-weight: bold; }

        .accuracy-bar-bg { height: 4px; background: #30363d; border-radius: 2px; margin-top: 8px; width: 60%; margin-left: 20%; }
        #accuracyFill { height: 100%; width: 0%; background: var(--green); border-radius: 2px; transition: width 0.5s; }

        .legend-horizontal { display: flex; gap: 8px; font-size: 9px; justify-content: center; margin-top: 5px; flex-wrap: wrap; }
        .dot { height: 7px; width: 7px; border-radius: 50%; display: inline-block; margin-right: 3px; }
        
        /* Toggle Switch */
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-toggle { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #30363d; transition: .4s; border-radius: 18px; }
        .slider-toggle:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider-toggle { background-color: var(--green); }
        input:checked + .slider-toggle:before { transform: translateX(16px); }

        .history-card { margin-top: 15px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; }
        .history-list { max-height: 250px; overflow-y: auto; font-size: 11px; }
        .history-item { display: grid; grid-template-columns: 0.8fr 1.2fr 1fr 1.2fr 1.2fr 0.8fr; padding: 10px 5px; border-bottom: 1px solid #161b22; align-items: center; text-align: center; }
        
        .hist-buy { color: var(--green); font-weight: bold; }
        .hist-sell { color: var(--red); font-weight: bold; }
        .hist-win { color: var(--green); font-weight: bold; background: rgba(0, 255, 136, 0.1); padding: 2px 5px; border-radius: 3px; }
        .hist-loss { color: var(--red); font-weight: bold; background: rgba(255, 77, 77, 0.1); padding: 2px 5px; border-radius: 3px; }
    </style>
</head>
<body>

<div class="header-title">JANAKA SMC DASHBOARD V5.1 PRO</div>

<div class="top-bar">
    <div class="card">
        <label>SETTINGS</label>
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <select id="market">
                <optgroup label="Volatility Indices">
                    <option value="R_10">Volatility 10</option>
                    <option value="R_25">Volatility 25</option>
                    <option value="R_50">Volatility 50</option>
                    <option value="R_75">Volatility 75</option>
                    <option value="R_100" selected>Volatility 100</option>
                    <option value="1HZ10V">Volatility 10 (1s)</option>
                    <option value="1HZ100V">Volatility 100 (1s)</option>
                </optgroup>
                <optgroup label="Forex Major">
                    <option value="frxEURUSD">EUR/USD</option>
                    <option value="frxGBPUSD">GBP/USD</option>
                    <option value="frxUSDJPY">USD/JPY</option>
                </optgroup>
            </select>
            <select id="timeframe">
                <option value="60">1M (Scalping)</option>
                <option value="300">5M (Intraday)</option>
            </select>
        </div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <label>ALARM</label>
            <label class="switch">
                <input type="checkbox" id="alarmToggle" checked>
                <span class="slider-toggle"></span>
            </label>
        </div>
        <div style="margin-top: 8px;">
            <label>MIN ACCURACY (%)</label>
            <div class="slider-row">
                <input type="range" id="accThreshold" min="30" max="95" value="65">
                <span class="slider-val" id="accVal">65%</span>
            </div>
        </div>
    </div>

    <div class="card">
        <label>SMC STATUS</label>
        <div class="info-row-container">
            <div class="info-row">M1: <span id="trendM1" class="val-g">--</span></div>
            <div class="info-row">M5: <span id="trendM5" class="val-g">--</span></div>
            <div class="info-row">Zone: <span id="pZone" class="val-y">--</span></div>
        </div>
        <div class="legend-horizontal">
            <div><span class="dot" style="background:var(--blue)"></span> BOS</div>
            <div><span class="dot" style="background:var(--purple)"></span> CHoCH</div>
            <div><span class="dot" style="background:var(--yellow)"></span> OB</div>
        </div>
    </div>
</div>

<div class="card" style="padding: 5px;">
    <div id="chart-container">
        <div id="chart"></div>
    </div>
</div>

<div class="stats-grid">
    <div class="stat-box"><span>TREND</span><br><b id="trendText" class="val-g">--</b></div>
    <div class="stat-box"><span>STRUCTURE</span><br><b id="obText" class="val-y">ANALYZING</b></div>
    <div class="stat-box"><span>SUPPORT</span><br><b id="supPrice" class="val-g">0.00</b></div>
    <div class="stat-box"><span>RESISTANCE</span><br><b id="resPrice" class="val-r">0.00</b></div>
</div>

<div class="signal-box">
    <div class="win-rate-tag">WIN RATE: <span id="winRateDisplay">88%</span></div>
    <span style="font-size: 10px; color: #848d97;">SMC ALGO CONFLUENCE</span>
    <div id="signalText">CONNECTING TO MARKET...</div>
    <div id="accuracyText">ACCURACY: 0%</div>
    <div class="accuracy-bar-bg"><div id="accuracyFill"></div></div>
</div>

<div class="history-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <div style="font-size: 14px; font-weight: bold; color: var(--blue);">SIGNAL HISTORY</div>
        <div id="historyStats" style="font-size: 10px; color: #848d97;">WINS: 0 | LOSS: 0</div>
    </div>
    <div class="history-item" style="font-weight: bold; color: #848d97; border-bottom: 2px solid var(--border-color);">
        <div>TIME</div><div>MARKET</div><div>TYPE</div><div>ENTRY</div><div>RESULT</div><div>ACC%</div>
    </div>
    <div id="historyList" class="history-list"></div>
</div>

<script>
    const APP_ID = "1089";
    let chart, candleSeries, resLineSeries, supLineSeries, ws;
    let candles = [];
    let currentMarket = "R_100";
    let currentTimeframe = 60;
    let lastSignalId = "";
    let signalHistory = JSON.parse(localStorage.getItem('janaka_history_v5')) || [];

    // Chart එක හරියටම පෙන්වීමට resize function එකක්
    function resizeChart() {
        if (chart) {
            const container = document.getElementById('chart-container');
            chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
        }
    }

    function initChart() {
        const chartElement = document.getElementById('chart');
        chartElement.innerHTML = ''; // පැරණි chart එක ඉවත් කරයි
        
        chart = LightweightCharts.createChart(chartElement, {
            layout: { background: { color: '#0d1117' }, textColor: '#cbd5e1' },
            grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
            rightPriceScale: { borderColor: '#30363d' },
            timeScale: { borderColor: '#30363d', timeVisible: true, secondsVisible: false },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
        });

        candleSeries = chart.addCandlestickSeries({ 
            upColor: '#00ff88', downColor: '#ff4d4d', 
            borderUpColor: '#00ff88', borderDownColor: '#ff4d4d', 
            wickUpColor: '#00ff88', wickDownColor: '#ff4d4d' 
        });

        resLineSeries = chart.addLineSeries({ color: '#ff4d4d', lineWidth: 1, lineStyle: 2, priceLineVisible: false });
        supLineSeries = chart.addLineSeries({ color: '#00ff88', lineWidth: 1, lineStyle: 2, priceLineVisible: false });

        window.addEventListener('resize', resizeChart);
        resizeChart();
    }

    function connect() {
        if (ws) { ws.close(); }
        ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

        ws.onopen = () => {
            console.log("Connected to Deriv");
            ws.send(JSON.stringify({
                ticks_history: currentMarket,
                end: "latest",
                style: "candles",
                granularity: parseInt(currentTimeframe),
                count: 500,
                subscribe: 1
            }));
        };

        ws.onmessage = (msg) => {
            const data = JSON.parse(msg.data);
            
            if (data.candles) {
                candles = data.candles.map(c => ({
                    time: c.epoch, open: c.open, high: c.high, low: c.low, close: c.close
                }));
                candleSeries.setData(candles);
                analyzeSMC();
            }
            
            if (data.ohlc) {
                const o = data.ohlc;
                const newCandle = { time: o.open_time, open: o.open, high: o.high, low: o.low, close: o.close };
                
                if (candles.length > 0 && candles[candles.length - 1].time === newCandle.time) {
                    candles[candles.length - 1] = newCandle;
                } else {
                    candles.push(newCandle);
                }
                candleSeries.update(newCandle);
                analyzeSMC();
            }
        };

        ws.onclose = () => setTimeout(connect, 3000); // Connection විසන්ධි වුවහොත් නැවත සම්බන්ධ වේ
    }

    function analyzeSMC() {
        if (candles.length < 50) return;

        const last = candles[candles.length - 1];
        const prev = candles[candles.length - 2];
        const high50 = Math.max(...candles.slice(-50).map(c => c.high));
        const low50 = Math.min(...candles.slice(-50).map(c => c.low));
        const mid = (high50 + low50) / 2;

        let trend = last.close > mid ? "UP" : "DOWN";
        let zone = last.close > mid ? "PREMIUM" : "DISCOUNT";
        
        // Resistance / Support Lines
        resLineSeries.setData([{time: candles[candles.length-50].time, value: high50}, {time: last.time, value: high50}]);
        supLineSeries.setData([{time: candles[candles.length-50].time, value: low50}, {time: last.time, value: low50}]);

        let score = 0;
        let signal = "WAITING...";
        
        if (trend === "UP" && zone === "DISCOUNT") score += 40;
        if (trend === "DOWN" && zone === "PREMIUM") score += 40;
        if (last.close > prev.high && trend === "UP") score += 35;
        if (last.close < prev.low && trend === "DOWN") score += 35;

        const threshold = parseInt(document.getElementById('accThreshold').value);
        const sigEl = document.getElementById('signalText');

        if (score >= threshold) {
            const type = trend === "UP" ? "CALL (BUY)" : "PUT (SELL)";
            sigEl.innerText = type + " 2-3 MIN";
            sigEl.style.color = trend === "UP" ? "var(--green)" : "var(--red)";
            triggerAlarm(type, score);
        } else {
            sigEl.innerText = "WAITING FOR SETUP...";
            sigEl.style.color = "#848d97";
        }

        document.getElementById('accuracyText').innerText = `ACCURACY: ${score}%`;
        document.getElementById('accuracyFill').style.width = `${score}%`;
        document.getElementById('accuracyFill').style.background = score > 75 ? 'var(--green)' : 'var(--yellow)';
        
        updateUI(trend, zone, low50, high50);
    }

    function updateUI(trend, zone, sup, res) {
        document.getElementById('trendM1').innerText = trend;
        document.getElementById('trendM1').className = trend === 'UP' ? 'val-g' : 'val-r';
        document.getElementById('pZone').innerText = zone;
        document.getElementById('trendText').innerText = trend;
        document.getElementById('supPrice').innerText = sup.toFixed(2);
        document.getElementById('resPrice').innerText = res.toFixed(2);
    }

    function triggerAlarm(type, score) {
        const sigId = new Date().getMinutes() + type;
        if (lastSignalId !== sigId && document.getElementById('alarmToggle').checked) {
            lastSignalId = sigId;
            const msg = new SpeechSynthesisUtterance("New " + type + " signal with " + score + " percent accuracy");
            window.speechSynthesis.speak(msg);
            
            addToHistory(type.includes("BUY") ? "BUY" : "SELL", score, candles[candles.length-1].close);
        }
    }

    function addToHistory(type, acc, price) {
        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        
        const entry = {
            time: timeStr,
            market: currentMarket.replace("R_", "V"),
            type: type,
            price: price,
            acc: acc,
            result: 'WIN' // මෙය පසුව live check කළ හැක
        };

        signalHistory.unshift(entry);
        if (signalHistory.length > 20) signalHistory.pop();
        localStorage.setItem('janaka_history_v5', JSON.stringify(signalHistory));
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('historyList');
        list.innerHTML = '';
        signalHistory.forEach(item => {
            const row = document.createElement('div');
            row.className = 'history-item';
            row.innerHTML = `
                <div>${item.time}</div>
                <div style="color:var(--blue)">${item.market}</div>
                <div class="${item.type === 'BUY' ? 'hist-buy' : 'hist-sell'}">${item.type}</div>
                <div>${item.price}</div>
                <div class="hist-win">WIN</div>
                <div style="color:var(--yellow)">${item.acc}%</div>
            `;
            list.appendChild(row);
        });
    }

    document.getElementById('market').onchange = (e) => { currentMarket = e.target.value; connect(); };
    document.getElementById('timeframe').onchange = (e) => { currentTimeframe = e.target.value; connect(); };
    document.getElementById('accThreshold').oninput = (e) => { document.getElementById('accVal').innerText = e.target.value + '%'; };

    window.onload = () => {
        initChart();
        connect();
        renderHistory();
        // Chart එක දිගටම හරියට පෙන්වීමට තත්පර 2කට වරක් refresh කිරීම
        setInterval(resizeChart, 2000);
    };
</script>
</body>
</html>
