<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JANAKA SMC DASHBOARD V5 PRO</title>
    <!-- Lightweight Charts Secure CDN for GitHub Pages -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-color: #05070a;
            --card-bg: #0d1117;
            --border-color: #21262d;
            --green: #00ff88;
            --red: #ff4d4d;
            --blue: #3b82f6;
            --yellow: #eab308;
            --text-main: #e6edf3;
        }

        * { box-sizing: border-box; }

        body { 
            background: var(--bg-color); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 8px; 
        }

        .header-title {
            text-align: center;
            color: var(--green);
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .top-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            padding: 8px; 
        }

        label { font-size: 9px; color: #848d97; font-weight: bold; margin-bottom: 4px; display: block; }
        
        select { 
            width: 100%; 
            padding: 6px; 
            border-radius: 5px; 
            background: #161b22; 
            color: var(--green); 
            border: 1px solid #30363d; 
            font-weight: bold;
            font-size: 11px;
        }

        /* Chart Wrapper optimized for Mobile */
        #chart-wrapper {
            position: relative;
            width: 100%;
            height: 380px;
            background: #0d1117;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        #chart { 
            width: 100%; 
            height: 100%; 
        }

        #status-overlay {
            position: absolute;
            top: 5px;
            left: 5px;
            z-index: 10;
            background: rgba(5, 7, 10, 0.85);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            color: var(--yellow);
            font-weight: bold;
            border: 1px solid var(--border-color);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin-top: 8px;
        }

        .stat-box { 
            background: var(--card-bg); 
            padding: 8px; 
            border-radius: 6px; 
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-box span { display: block; font-size: 8px; color: #848d97; text-transform: uppercase; }
        .stat-box b { font-size: 12px; }

        .decision-box {
            margin-top: 8px;
            padding: 10px;
            border-radius: 8px;
            background: #111;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: var(--yellow);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="header-title">JANAKA SMC DASHBOARD V5</div>

<div class="top-bar">
    <div class="card">
        <label>MARKET</label>
        <select id="market">
            <option value="R_100">Volatility 100</option>
            <option value="R_75">Volatility 75</option>
            <option value="R_50">Volatility 50</option>
            <option value="R_25">Volatility 25</option>
            <option value="R_10">Volatility 10</option>
            <option value="1HZ100V">Volatility 100 (1s)</option>
        </select>
    </div>

    <div class="card">
        <label>TIMEFRAME</label>
        <select id="timeframe">
            <option value="60">1M (Scalping)</option>
            <option value="300">5M (Intraday)</option>
        </select>
    </div>
</div>

<div id="chart-wrapper">
    <div id="status-overlay">STATUS: INITIALIZING...</div>
    <div id="chart"></div>
</div>

<div class="stats-grid">
    <div class="stat-box"><span>1M TREND</span><b id="trendText" style="color:var(--green)">--</b></div>
    <div class="stat-box"><span>SUPPORT</span><b id="supPrice" style="color:var(--green)">0.00</b></div>
    <div class="stat-box"><span>RESISTANCE</span><b id="resPrice" style="color:var(--red)">0.00</b></div>
    <div class="stat-box"><span>LAST PRICE</span><b id="lastPrice" style="color:var(--blue)">0.00</b></div>
</div>

<div class="decision-box">
    SIGNAL : <span id="finalDecision">WAIT</span>
</div>

<script>
    let chart, candleSeries;
    let ws = null;
    let candles = [];

    function updateStatus(text, color = "var(--yellow)") {
        const el = document.getElementById('status-overlay');
        if(el) {
            el.innerText = text;
            el.style.color = color;
        }
    }

    function initChart() {
        const container = document.getElementById('chart');
        
        // Chart Library Check
        if (typeof LightweightCharts === 'undefined') {
            updateStatus("ERROR: Chart JS Library Failed to Load!", "var(--red)");
            return false;
        }

        try {
            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: container.clientHeight,
                layout: { background: { color: '#0d1117' }, textColor: '#cbd5e1' },
                grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
                rightPriceScale: { borderColor: '#30363d' },
                timeScale: { borderColor: '#30363d', timeVisible: true }
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#00ff88', downColor: '#ff4d4d',
                borderUpColor: '#00ff88', borderDownColor: '#ff4d4d',
                wickUpColor: '#00ff88', wickDownColor: '#ff4d4d'
            });

            // Auto Resize for Mobile Orientation Change
            window.addEventListener('resize', () => {
                if (chart && container) {
                    chart.applyOptions({ 
                        width: container.clientWidth,
                        height: container.clientHeight 
                    });
                }
            });

            return true;
        } catch (e) {
            updateStatus("Init Error: " + e.message, "var(--red)");
            return false;
        }
    }

    function connectWebSocket() {
        const market = document.getElementById('market').value;
        const timeframe = parseInt(document.getElementById('timeframe').value);

        updateStatus("Connecting to Market...", "var(--yellow)");

        if (ws) {
            ws.close();
        }

        // Connecting via Secure WebSocket (wss://)
        ws = new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=1089");

        ws.onopen = () => {
            updateStatus("Loading Market Data...", "var(--green)");
            ws.send(JSON.stringify({
                ticks_history: market,
                end: "latest",
                style: "candles",
                granularity: timeframe,
                count: 300,
                subscribe: 1
            }));
        };

        ws.onmessage = (msg) => {
            const data = JSON.parse(msg.data);

            if (data.candles) {
                updateStatus("LIVE MARKET ACTIVE", "var(--green)");
                candles = data.candles.map(c => ({
                    time: c.epoch, open: c.open, high: c.high, low: c.low, close: c.close
                }));
                candleSeries.setData(candles);
                analyzeData();
            }

            if (data.ohlc) {
                const o = data.ohlc;
                const newCandle = { time: o.open_time, open: o.open, high: o.high, low: o.low, close: o.close };
                
                if (candles.length > 0 && candles[candles.length - 1].time === newCandle.time) {
                    candles[candles.length - 1] = newCandle;
                } else {
                    candles.push(newCandle);
                }
                candleSeries.update(newCandle);
                analyzeData();
            }
        };

        ws.onerror = () => {
            updateStatus("WS Connection Error!", "var(--red)");
        };

        ws.onclose = () => {
            updateStatus("Disconnected. Retrying...", "var(--yellow)");
            setTimeout(connectWebSocket, 3000);
        };
    }

    function analyzeData() {
        if(candles.length < 5) return;
        const last = candles[candles.length - 1];
        const prev = candles[candles.length - 2];

        document.getElementById('lastPrice').innerText = last.close.toFixed(2);
        document.getElementById('supPrice').innerText = Math.min(...candles.slice(-20).map(c => c.low)).toFixed(2);
        document.getElementById('resPrice').innerText = Math.max(...candles.slice(-20).map(c => c.high)).toFixed(2);

        if(last.close > prev.close) {
            document.getElementById('trendText').innerText = "BULLISH";
            document.getElementById('trendText').style.color = "var(--green)";
            document.getElementById('finalDecision').innerText = "BUY";
            document.getElementById('finalDecision').style.color = "var(--green)";
        } else {
            document.getElementById('trendText').innerText = "BEARISH";
            document.getElementById('trendText').style.color = "var(--red)";
            document.getElementById('finalDecision').innerText = "SELL";
            document.getElementById('finalDecision').style.color = "var(--red)";
        }
    }

    document.getElementById('market').addEventListener('change', connectWebSocket);
    document.getElementById('timeframe').addEventListener('change', connectWebSocket);

    window.addEventListener('load', () => {
        setTimeout(() => {
            if (initChart()) {
                connectWebSocket();
            }
        }, 500); // Small delay for mobile browsers
    });
</script>
</body>
</html>
