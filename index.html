<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANAKA ICT SMC DASHBOARD V3</title>
    <script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { background:#0b1220; color:white; font-family:Arial,sans-serif; margin:0; padding:15px; }
        h1 { text-align:center; color:#00ff88; margin-top:0; }
        .card { background:#111c2e; border:1px solid #1f3b5b; border-radius:12px; padding:15px; margin-bottom:12px; }
        select { width:100%; padding:10px; font-size:16px; border-radius:8px; background:#0f172a; color:white; border:none; }
        #chart { height:500px; width:100%; border-radius: 8px; overflow: hidden; }
        .status-box { display: flex; justify-content: space-between; font-weight: bold; }
        .bullish { color: #00ff88; }
        .bearish { color: #ff4d4d; }
    </style>
</head>
<body>

<h1>JANAKA ICT DASHBOARD V3</h1>

<div class="card">
    <select id="market">
        <option value="R_100">Volatility 100</option>
        <option value="R_75">Volatility 75</option>
        <option value="R_50">Volatility 50</option>
        <option value="R_25">Volatility 25</option>
        <option value="R_10">Volatility 10</option>
        <option value="frxEURUSD">EUR/USD</option>
        <option value="frxGBPUSD">GBP/USD</option>
    </select>
</div>

<div class="card">
    <div class="status-box">
        <div>Trend: <span id="trend">WAIT</span></div>
        <div>Last Event: <span id="event">NONE</span></div>
    </div>
</div>

<div class="card">
    <div id="chart"></div>
</div>

<script>
const APP_ID = "1089";
const marketSelect = document.getElementById("market");
let ws, chart, candleSeries, candles = [];

// ICT State
let swingHighs = [], swingLows = [];
let currentTrend = "Neutral"; // Bullish / Bearish
let lastHighPrice = 0, lastLowPrice = 0;

function initChart() {
    chart = LightweightCharts.createChart(document.getElementById('chart'), {
        layout: { background: { color: '#0f172a' }, textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#1f2937' }, horzLines: { color: '#1f2937' } },
        timeScale: { timeVisible: true, secondsVisible: false }
    });
    candleSeries = chart.addCandlestickSeries({
        upColor: '#00ff88', downColor: '#ff4d4d',
        borderUpColor: '#00ff88', borderDownColor: '#ff4d4d',
        wickUpColor: '#00ff88', wickDownColor: '#ff4d4d'
    });
}

function connect() {
    if (ws) ws.close();
    candles = [];
    candleSeries.setData([]);
    
    ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);
    ws.onopen = () => {
        ws.send(JSON.stringify({
            ticks_history: marketSelect.value,
            end: "latest", style: "candles", granularity: 60, count: 300, subscribe: 1
        }));
    };

    ws.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        if (data.candles) {
            data.candles.forEach(c => updateCandleData(c));
            processICTLogic();
        }
        if (data.ohlc) {
            updateCandleData(data.ohlc);
            processICTLogic();
        }
    };
}

function updateCandleData(c) {
    const candle = {
        time: c.epoch || c.open_time,
        open: parseFloat(c.open),
        high: parseFloat(c.high),
        low: parseFloat(c.low),
        close: parseFloat(c.close)
    };
    if (candles.length > 0 && candles[candles.length - 1].time === candle.time) {
        candles[candles.length - 1] = candle;
    } else {
        candles.push(candle);
    }
    if (candles.length > 300) candles.shift();
    candleSeries.update(candle);
}

function processICTLogic() {
    if (candles.length < 10) return;

    let markers = [];
    swingHighs = [];
    swingLows = [];

    // 1. Detect Fractals (ICT Swing Points - 3 candle pattern)
    for (let i = 2; i < candles.length - 1; i++) {
        // Swing High (STH)
        if (candles[i].high > candles[i-1].high && candles[i].high > candles[i+1].high) {
            let type = (swingHighs.length > 0 && candles[i].high > swingHighs[swingHighs.length-1].price) ? "HH" : "LH";
            swingHighs.push({ price: candles[i].high, time: candles[i].time, type: type });
            markers.push({ time: candles[i].time, position: 'aboveBar', color: '#ff4d4d', shape: 'arrowDown', text: type });
        }
        // Swing Low (STL)
        if (candles[i].low < candles[i-1].low && candles[i].low < candles[i+1].low) {
            let type = (swingLows.length > 0 && candles[i].low < swingLows[swingLows.length-1].price) ? "LL" : "HL";
            swingLows.push({ price: candles[i].low, time: candles[i].time, type: type });
            markers.push({ time: candles[i].time, position: 'belowBar', color: '#00ff88', shape: 'arrowUp', text: type });
        }
    }

    // 2. Market Structure Analysis (BOS / CHOCH)
    const lastCandle = candles[candles.length - 1];
    const prevHigh = swingHighs.length > 1 ? swingHighs[swingHighs.length - 2] : null;
    const prevLow = swingLows.length > 1 ? swingLows[swingLows.length - 2] : null;

    let eventText = "NONE";

    if (prevHigh && prevLow) {
        // Bullish Break (CHOCH or BOS)
        if (lastCandle.close > prevHigh.price) {
            if (currentTrend === "Bearish") {
                eventText = "CHOCH 🟢";
                currentTrend = "Bullish";
                markers.push({ time: lastCandle.time, position: 'aboveBar', color: '#00ccff', shape: 'circle', text: 'CHOCH' });
            } else if (currentTrend === "Bullish") {
                eventText = "BOS 🟢";
                markers.push({ time: lastCandle.time, position: 'aboveBar', color: '#00ccff', shape: 'circle', text: 'BOS' });
            } else {
                currentTrend = "Bullish";
            }
        }
        // Bearish Break (CHOCH or BOS)
        else if (lastCandle.close < prevLow.price) {
            if (currentTrend === "Bullish") {
                eventText = "CHOCH 🔴";
                currentTrend = "Bearish";
                markers.push({ time: lastCandle.time, position: 'belowBar', color: '#ffaa00', shape: 'circle', text: 'CHOCH' });
            } else if (currentTrend === "Bearish") {
                eventText = "BOS 🔴";
                markers.push({ time: lastCandle.time, position: 'belowBar', color: '#ffaa00', shape: 'circle', text: 'BOS' });
            } else {
                currentTrend = "Bearish";
            }
        }
    }

    // UI Updates
    document.getElementById("trend").innerText = currentTrend.toUpperCase();
    document.getElementById("trend").className = currentTrend === "Bullish" ? "bullish" : "bearish";
    document.getElementById("event").innerText = eventText;
    
    candleSeries.setMarkers(markers);
}

marketSelect.addEventListener("change", connect);
initChart();
connect();
</script>
</body>
</html>
