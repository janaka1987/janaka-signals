<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JANAKA SMC DASHBOARD V6 PRO - FULL LABELS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

<style>
*{ margin:0; padding:0; box-sizing:border-box; }
:root{
    --bg:#05070A; --card:#111827; --border:#233044;
    --green:#00FF88; --red:#FF4D4D; --blue:#38BDF8; --text:#FFFFFF; --muted:#94A3B8;
}
body{ background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); padding:16px; overflow-x:hidden; }
.container{ width:100%; max-width:1700px; margin:auto; }
.title{ font-size:32px; font-weight:800; text-align:center; letter-spacing:2px; margin-bottom:20px; color:var(--green); text-shadow: 0 0 8px rgba(0,255,136,.6); }
.grid-top{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:18px; }
.card{ background:linear-gradient(180deg, #111827, #0B1220); border:1px solid var(--border); border-radius:20px; padding:18px; position:relative; }
.card h3{ font-size:17px; font-weight:700; color:var(--blue); margin-bottom:14px; }
select{ width:100%; height:50px; background:#08111F; color:white; border:1px solid #334155; border-radius:14px; padding:0 16px; font-size:17px; outline:none; }
#chart { width:100%; height:500px; }
#rsi-chart { width:100%; height:180px; }
.bottom-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:18px; }
.info-box{ background: #111827; border:1px solid var(--border); border-radius:18px; padding:22px; text-align:center; }
.info-title{ font-size:14px; font-weight:600; color:var(--muted); margin-bottom:12px; }
.info-value{ font-size:26px; font-weight:700; font-family: 'JetBrains Mono', monospace; }
.led-indicator { width: 20px; height: 20px; border-radius: 50%; margin: 0 auto 10px; background: #334155; }
.led-buy { background: var(--green); box-shadow: 0 0 15px var(--green); }
.led-sell { background: var(--red); box-shadow: 0 0 15px var(--red); }
@media(max-width:900px){ .grid-top, .bottom-grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<div class="container">
    <div class="title">JANAKA SMC DASHBOARD V6 PRO</div>
    <div class="grid-top">
        <div class="card">
            <h3>📊 SELECT MARKET</h3>
            <select id="market">
                <option value="R_10">Volatility 10</option>
                <option value="R_25">Volatility 25</option>
                <option value="R_50" selected>Volatility 50</option>
                <option value="R_75">Volatility 75</option>
                <option value="R_100">Volatility 100</option>
            </select>
        </div>
        <div class="card">
            <h3>🌐 CONNECTION STATUS</h3>
            <div style="line-height:25px;">
                Status : <span id="status" style="color:var(--red)">Disconnected</span><br>
                Market : <span id="marketName" style="color:var(--blue)">Volatility 50</span>
            </div>
        </div>
    </div>

    <div class="card" style="margin-bottom:20px;">
        <h3>📈 LIVE SMC CANDLESTICK CHART (SMC LABELS ON)</h3>
        <div id="chart"></div>
    </div>

    <div class="card" style="margin-bottom:20px;">
        <h3>📊 RSI INDICATOR (14)</h3>
        <div id="rsi-chart"></div>
    </div>

    <div class="bottom-grid">
        <div class="info-box">
            <div class="info-title">📈 SMC TREND</div>
            <div class="info-value" id="trend" style="color:var(--green)">ANALYZING</div>
        </div>
        <div class="info-box">
            <div class="info-title">⚡ SIGNAL</div>
            <div id="led" class="led-indicator"></div>
            <div class="info-value" id="signalValue">NEUTRAL</div>
        </div>
        <div class="info-box">
            <div class="info-title">🛠 SYSTEM</div>
            <div class="info-value" id="lastTick" style="color:var(--blue)">WAITING...</div>
        </div>
    </div>
</div>

<script>
const APP_ID = "1089";
const TIMEFRAME = 60;
let ws = null, mainChart = null, rsiChart = null;
let candleSeries = null, ema9Series = null, ema21Series = null, rsiSeries = null, trendSeries = null;
let candles = [];
let currentMarket = "R_50";
let pingInterval = null;

function initCharts() {
    const chartOptions = {
        layout: { background: { color: "#05070A" }, textColor: "#94A3B8" },
        grid: { vertLines: { color: "#162033" }, horzLines: { color: "#162033" } },
        timeScale: { borderColor: "#233044", timeVisible: true, secondsVisible: false },
        priceScale: { autoScale: true },
        crosshair: { mode: 0 }
    };

    if(mainChart) { document.getElementById("chart").innerHTML = ""; document.getElementById("rsi-chart").innerHTML = ""; }

    mainChart = LightweightCharts.createChart(document.getElementById("chart"), chartOptions);
    candleSeries = mainChart.addCandlestickSeries({ upColor: "#00FF88", downColor: "#FF4D4D", borderVisible: false, wickUpColor: "#00FF88", wickDownColor: "#FF4D4D" });
    
    // EMA Lines
    ema9Series = mainChart.addLineSeries({ color: '#38BDF8', lineWidth: 1, priceLineVisible: false });
    ema21Series = mainChart.addLineSeries({ color: '#F59E0B', lineWidth: 1, priceLineVisible: false });
    
    // SMC S/R Line - Solid Style
    trendSeries = mainChart.addLineSeries({ color: 'rgba(255, 255, 255, 0.4)', lineWidth: 1, lineStyle: 0, priceLineVisible: false });

    rsiChart = LightweightCharts.createChart(document.getElementById("rsi-chart"), chartOptions);
    
    // RSI Main Line - Dashed price line hidden
    rsiSeries = rsiChart.addLineSeries({ color: '#F59E0B', lineWidth: 2, priceLineVisible: false });
    
    // 30, 50, 70 Levels - Solid lines as requested
    rsiSeries.createPriceLine({ price: 70, color: '#FF4D4D', lineWidth: 1, lineStyle: 0, title: '70' });
    rsiSeries.createPriceLine({ price: 50, color: '#94A3B8', lineWidth: 1, lineStyle: 0, title: '50' });
    rsiSeries.createPriceLine({ price: 30, color: '#00FF88', lineWidth: 1, lineStyle: 0, title: '30' });
}

function calculateSMC() {
    if (candles.length < 30) return;
    let markers = [];
    let swings = [];
    let windowSize = 5;

    for (let i = windowSize; i < candles.length - windowSize; i++) {
        let isHigh = true, isLow = true;
        for (let j = 1; j <= windowSize; j++) {
            if (candles[i].high < candles[i-j].high || candles[i].high < candles[i+j].high) isHigh = false;
            if (candles[i].low > candles[i-j].low || candles[i].low > candles[i+j].low) isLow = false;
        }
        if (isHigh) swings.push({ type: 'H', price: candles[i].high, time: candles[i].time });
        if (isLow) swings.push({ type: 'L', price: candles[i].low, time: candles[i].time });
    }

    let lastH = null, lastL = null, currentDir = "", lineData = [];
    
    swings.forEach((s) => {
        let label = "", color = "#FFFFFF";
        if (s.type === 'H') {
            if (lastH && s.price > lastH.price) {
                label = "HH"; color = "#00FF88";
                markers.push({ time: s.time, position: 'aboveBar', color: '#FFD700', shape: 'arrowDown', text: 'BOS' });
                currentDir = "UPTREND";
            } else if (lastH && s.price < lastH.price) {
                label = "LH"; color = "#FF4D4D";
                if(currentDir === "UPTREND") markers.push({ time: s.time, position: 'aboveBar', color: '#FF00FF', shape: 'arrowDown', text: 'CHOCH' });
                currentDir = "DOWNTREND";
            }
            lastH = s;
        } else {
            if (lastL && s.price < lastL.price) {
                label = "LL"; color = "#FF4D4D";
                markers.push({ time: s.time, position: 'belowBar', color: '#FFD700', shape: 'arrowUp', text: 'BOS' });
                currentDir = "DOWNTREND";
            } else if (lastL && s.price > lastL.price) {
                label = "HL"; color = "#00FF88";
                if(currentDir === "DOWNTREND") markers.push({ time: s.time, position: 'belowBar', color: '#FF00FF', shape: 'arrowUp', text: 'CHOCH' });
                currentDir = "UPTREND";
            }
            lastL = s;
        }
        // ALL LABELS KEPT HERE
        if (label !== "") markers.push({ time: s.time, position: s.type === 'H' ? 'aboveBar' : 'belowBar', color: color, shape: 'text', text: label });
        lineData.push({ time: s.time, value: s.price });
    });

    candleSeries.setMarkers(markers);
    trendSeries.setData(lineData);
    const trendEl = document.getElementById("trend");
    trendEl.innerText = currentDir || "ANALYZING";
    trendEl.style.color = currentDir === "UPTREND" ? "#00FF88" : "#FF4D4D";
}

function updateIndicators() {
    if (candles.length < 25) return;
    
    const calcEMA = (data, p) => {
        let k = 2/(p+1), ema = [{time: data[0].time, value: data[0].close}];
        for(let i=1; i<data.length; i++) {
            ema.push({time: data[i].time, value: (data[i].close - ema[i-1].value) * k + ema[i-1].value});
        }
        return ema;
    };

    const calcRSI = (data, p) => {
        let results = [];
        for (let i = p; i < data.length; i++) {
            let up = 0, down = 0;
            for (let j = 0; j < p; j++) {
                let diff = data[i-j].close - data[i-j-1].close;
                if (diff > 0) up += diff; else down -= diff;
            }
            let rs = (up/p) / (down/p || 1);
            results.push({ time: data[i].time, value: 100 - (100 / (1 + rs)) });
        }
        return results;
    };

    ema9Series.setData(calcEMA(candles, 9));
    ema21Series.setData(calcEMA(candles, 21));
    const rsiVal = calcRSI(candles, 14);
    rsiSeries.setData(rsiVal);

    if(rsiVal.length > 0) {
        const lastR = rsiVal[rsiVal.length-1].value;
        const sig = document.getElementById("signalValue"), led = document.getElementById("led");
        if(lastR > 60) { sig.innerText = "BUY"; sig.style.color = "var(--green)"; led.className = "led-indicator led-buy"; }
        else if(lastR < 40) { sig.innerText = "SELL"; sig.style.color = "var(--red)"; led.className = "led-indicator led-sell"; }
        else { sig.innerText = "NEUTRAL"; sig.style.color = "white"; led.className = "led-indicator"; }
    }
    
    calculateSMC();
}

function connect() {
    if (ws) { ws.close(); clearInterval(pingInterval); }
    ws = new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=" + APP_ID);

    ws.onopen = () => {
        document.getElementById("status").innerText = "ONLINE";
        document.getElementById("status").style.color = "var(--green)";
        pingInterval = setInterval(() => { if(ws.readyState === 1) ws.send(JSON.stringify({ping: 1})); }, 30000);
        ws.send(JSON.stringify({ ticks_history: currentMarket, count: 500, end: "latest", granularity: TIMEFRAME, style: "candles" }));
    };

    ws.onmessage = (msg) => {
        const res = JSON.parse(msg.data);
        if (res.candles) {
            candles = res.candles.map(c => ({ time: Number(c.epoch), open: Number(c.open), high: Number(c.high), low: Number(c.low), close: Number(c.close) }));
            candleSeries.setData(candles);
            updateIndicators();
            ws.send(JSON.stringify({ ohlc: currentMarket, granularity: TIMEFRAME, subscribe: 1 }));
        }
        if (res.ohlc) {
            const o = res.ohlc;
            const newC = { time: Number(o.open_time), open: Number(o.open), high: Number(o.high), low: Number(o.low), close: Number(o.close) };
            candleSeries.update(newC);
            document.getElementById("lastTick").innerText = "PRICE: " + newC.close;
            const lastIdx = candles.length - 1;
            if (lastIdx >= 0 && newC.time === candles[lastIdx].time) { candles[lastIdx] = newC; } 
            else { candles.push(newC); if (candles.length > 500) candles.shift(); }
            updateIndicators();
        }
    };

    ws.onclose = () => { setTimeout(connect, 3000); };
}

document.getElementById("market").addEventListener("change", (e) => {
    currentMarket = e.target.value;
    document.getElementById("marketName").innerText = e.target.options[e.target.selectedIndex].text;
    initCharts(); connect();
});

initCharts();
connect();
</script>
</body>
</html>
