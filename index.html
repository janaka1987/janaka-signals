<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JANAKA FOREX SMC DASHBOARD PRO</title>
    <!-- TradingView Charting Engine Script -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root {
            --bg-color: #05070a;
            --card-bg: #0d1117;
            --border-color: #21262d;
            --green: #00ff88;
            --red: #ff4d4d;
            --blue: #3b82f6;
            --yellow: #eab308;
            --text-main: #e6edf3;
        }

        * { box-sizing: border-box; }

        body { 
            background: var(--bg-color); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 8px; 
        }

        .header-title {
            text-align: center;
            color: var(--green);
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .top-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            padding: 8px; 
        }

        label { font-size: 9px; color: #848d97; font-weight: bold; margin-bottom: 4px; display: block; }
        
        select { 
            width: 100%; 
            padding: 6px; 
            border-radius: 5px; 
            background: #161b22; 
            color: var(--green); 
            border: 1px solid #30363d; 
            font-weight: bold;
            font-size: 11px;
        }

        #chart-wrapper {
            position: relative;
            width: 100%;
            height: 480px;
            background: #0d1117;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        #tv_chart_container {
            width: 100%;
            height: 100%;
        }

        .smc-status-bar {
            margin-top: 8px;
            padding: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            justify-content: space-around;
            font-size: 10px;
            font-weight: bold;
        }

        .smc-item { display: flex; align-items: center; gap: 4px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
    </style>
</head>
<body>

<div class="header-title">JANAKA FOREX SMC PRO DASHBOARD</div>

<div class="top-bar">
    <div class="card">
        <label>FOREX PAIR</label>
        <select id="market" onchange="loadForexSMCChart()">
            <option value="FX:EURUSD" selected>EUR/USD</option>
            <option value="FX:GBPUSD">GBP/USD</option>
            <option value="FX:USDJPY">USD/JPY</option>
            <option value="FX:AUDUSD">AUD/USD</option>
            <option value="FX:USDCAD">USD/CAD</option>
            <option value="FX:USDCHF">USD/CHF</option>
            <option value="OANDA:XAUUSD">GOLD (XAU/USD)</option>
        </select>
    </div>

    <div class="card">
        <label>TIMEFRAME</label>
        <select id="timeframe" onchange="loadForexSMCChart()">
            <option value="1">1M (Scalping)</option>
            <option value="5" selected>5M (Intraday)</option>
            <option value="15">15M</option>
            <option value="60">1H</option>
        </select>
    </div>
</div>

<div id="chart-wrapper">
    <div id="tv_chart_container"></div>
</div>

<div class="smc-status-bar">
    <div class="smc-item"><div class="dot" style="background:var(--green)"></div> BOS</div>
    <div class="smc-item"><div class="dot" style="background:var(--yellow)"></div> CHoCH</div>
    <div class="smc-item"><div class="dot" style="background:var(--blue)"></div> HH / HL / LH / LL</div>
    <div class="smc-item"><div class="dot" style="background:var(--red)"></div> S/R & Trendlines</div>
</div>

<script>
    function loadForexSMCChart() {
        const symbol = document.getElementById('market').value;
        const timeframe = document.getElementById('timeframe').value;

        document.getElementById('tv_chart_container').innerHTML = '';

        new TradingView.widget({
            "autosize": true,
            "symbol": symbol,
            "interval": timeframe,
            "timezone": "Asia/Colombo",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#0d1117",
            "enable_publishing": false,
            "allow_symbol_change": false,
            "container_id": "tv_chart_container",
            "hide_side_toolbar": false,
            "drawings_access": { "type": "black", "tools": [ { "name": "Regression Trend" } ] },
            "disabled_features": ["use_localstorage_for_settings"],
            "enabled_features": ["study_templates"],
            "studies": [
                /* Built-in High Low Structure & Pivot Breaks for Auto Structure */
                "STD;Pivot%1Points%1High%1Low",
                "STD;Zig_Zag"
            ]
        });
    }

    window.onload = function() {
        loadForexSMCChart();
    };
</script>
</body>
</html>
