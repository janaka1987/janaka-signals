<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANAKA SMC V5 PRO - FIXED</title>
    <!-- පරණ ලින්ක් එක වෙනුවට වඩාත් වේගවත් JSDelivr ලින්ක් එක පාවිච්චි කර ඇත -->
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-color: #05070a;
            --card-bg: #0d1117;
            --border-color: #21262d;
            --green: #00ff88;
            --red: #ff4d4d;
            --blue: #3b82f6;
            --yellow: #eab308;
            --text-main: #e6edf3;
        }

        body { 
            background: var(--bg-color); 
            color: var(--text-main); 
            font-family: sans-serif; 
            margin: 0; 
            padding: 10px; 
            overflow-x: hidden;
        }

        .header-title {
            text-align: center;
            color: var(--green);
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            padding: 10px; 
            margin-bottom: 10px;
        }

        select, input { 
            width: 100%; 
            padding: 10px; 
            border-radius: 5px; 
            background: #161b22; 
            color: var(--green); 
            border: 1px solid #30363d; 
            margin-top: 5px;
        }

        #chart { 
            height: 350px; 
            width: 100%; 
            min-height: 350px; /* චාර්ට් එක නොපෙනී යාම වැලැක්වීමට */
            border-radius: 8px;
            background: #0d1117;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .stat-box { 
            background: var(--card-bg); 
            padding: 10px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color);
            text-align: center;
            font-size: 12px;
        }

        .signal-box {
            background: #161b22;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid var(--border-color);
            margin-top: 10px;
        }

        #signalText { font-size: 20px; font-weight: bold; }
        
        .history-list { max-height: 150px; overflow-y: auto; font-size: 11px; margin-top: 10px; }
        .history-item { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; padding: 5px; border-bottom: 1px solid #161b22; text-align: center;}
    </style>
</head>
<body>

<div class="header-title">JANAKA SMC V5 PRO</div>

<div class="card">
    <label style="font-size: 12px; color: #848d97;">SELECT MARKET</label>
    <select id="market">
        <option value="R_10">Volatility 10</option>
        <option value="R_25">Volatility 25</option>
        <option value="R_50">Volatility 50</option>
        <option value="R_75">Volatility 75</option>
        <option value="R_100" selected>Volatility 100</option>
        <option value="1HZ10V">Volatility 10 (1s)</option>
        <option value="1HZ100V">Volatility 100 (1s)</option>
    </select>
</div>

<div id="chart"></div>

<div class="stats-grid">
    <div class="stat-box">TREND: <b id="trendText">--</b></div>
    <div class="stat-box">ZONE: <b id="zoneText">--</b></div>
    <div class="stat-box">SUPPORT: <b id="supPrice" style="color:var(--green)">0.00</b></div>
    <div class="stat-box">RESIST: <b id="resPrice" style="color:var(--red)">0.00</b></div>
</div>

<div class="signal-box">
    <div id="signalText">ANALYZING...</div>
    <div id="accuracyText" style="font-size: 14px; color: var(--yellow);">Accuracy: 0%</div>
</div>

<div class="card">
    <div style="font-weight: bold; font-size: 12px; border-bottom: 1px solid #30363d; padding-bottom: 5px;">HISTORY</div>
    <div id="historyList" class="history-list"></div>
</div>

<script>
    // ඔබේ App ID එක මෙතන දාන්න (නැත්නම් 1089 තියන්න)
    const APP_ID = "33yT1dsi34DD6WXIM9hB6"; 
    let chart, candleSeries, ws;
    let currentMarket = "R_100";
    let currentTimeframe = 60;
    let candles = [];
    let lastSignal = "";

    function initChart() {
        const chartElement = document.getElementById('chart');
        chart = LightweightCharts.createChart(chartElement, {
            layout: { background: { color: '#0d1117' }, textColor: '#cbd5e1' },
            grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
            timeScale: { timeVisible: true, secondsVisible: false }
        });
        candleSeries = chart.addCandlestickSeries({
            upColor: '#00ff88', downColor: '#ff4d4d',
            borderUpColor: '#00ff88', borderDownColor: '#ff4d4d',
            wickUpColor: '#00ff88', wickDownColor: '#ff4d4d'
        });

        // Resize chart for mobile
        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartElement.clientWidth });
        });
    }

    function connect() {
        if (ws) ws.close();
        
        // WebSocket URL with single quotes to avoid symbol issues
        ws = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=' + APP_ID);

        ws.onopen = () => {
            console.log("Connected to " + currentMarket);
            candles = [];
            candleSeries.setData([]);
            ws.send(JSON.stringify({
                ticks_history: currentMarket,
                end: "latest",
                style: "candles",
                granularity: currentTimeframe,
                count: 300,
                subscribe: 1
            }));
        };

        ws.onmessage = (msg) => {
            const data = JSON.parse(msg.data);

            // Market Symbol එක වැරදි නම් Alert එකක් ලබා දෙයි
            if (data.error) {
                alert("Market Error: " + data.error.message + " (" + currentMarket + ")");
                return;
            }

            if (data.candles) {
                candles = data.candles.map(c => ({
                    time: c.epoch,
                    open: c.open,
                    high: c.high,
                    low: c.low,
                    close: c.close
                }));
                candleSeries.setData(candles);
                analyzeSMC();
            }

            if (data.ohlc) {
                const o = data.ohlc;
                const newCandle = {
                    time: o.open_time,
                    open: o.open,
                    high: o.high,
                    low: o.low,
                    close: o.close
                };
                if (candles.length > 0 && candles[candles.length - 1].time === newCandle.time) {
                    candles[candles.length - 1] = newCandle;
                } else {
                    candles.push(newCandle);
                }
                candleSeries.update(newCandle);
                analyzeSMC();
            }
        };

        ws.onclose = () => {
            setTimeout(connect, 3000); // Reconnect if closed
        };
    }

    function analyzeSMC() {
        if (candles.length < 50) return;

        const last = candles[candles.length - 1];
        const prev = candles[candles.length - 20];
        const high50 = Math.max(...candles.slice(-50).map(c => c.high));
        const low50 = Math.min(...candles.slice(-50).map(c => c.low));
        const eq = (high50 + low50) / 2;

        const trend = last.close > prev.close ? "UP" : "DOWN";
        const zone = last.close > eq ? "PREMIUM" : "DISCOUNT";

        document.getElementById('trendText').innerText = trend;
        document.getElementById('trendText').style.color = trend === "UP" ? "var(--green)" : "var(--red)";
        document.getElementById('zoneText').innerText = zone;
        document.getElementById('supPrice').innerText = low50.toFixed(2);
        document.getElementById('resPrice').innerText = high50.toFixed(2);

        // Signal Logic
        let score = 50;
        let signal = "WAITING...";
        let color = "#848d97";

        if (trend === "UP" && zone === "DISCOUNT") {
            score = 88;
            signal = "CALL (BUY) 2M";
            color = "var(--green)";
            triggerSignal("BUY", score);
        } else if (trend === "DOWN" && zone === "PREMIUM") {
            score = 88;
            signal = "PUT (SELL) 2M";
            color = "var(--red)";
            triggerSignal("SELL", score);
        } else {
            lastSignal = "";
        }

        document.getElementById('signalText').innerText = signal;
        document.getElementById('signalText').style.color = color;
        document.getElementById('accuracyText').innerText = "Accuracy: " + score + "%";
    }

    function triggerSignal(type, score) {
        if (lastSignal === type) return;
        lastSignal = type;

        // Add to history
        const history = document.getElementById('historyList');
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `
            <span>${time}</span>
            <span style="color:var(--blue)">${currentMarket}</span>
            <span style="color:${type === 'BUY' ? 'var(--green)' : 'var(--red)'}">${type}</span>
            <span>${score}%</span>
        `;
        history.prepend(item);

        // Sound Notification
        try {
            const msg = new SpeechSynthesisUtterance("New " + type + " Signal");
            window.speechSynthesis.speak(msg);
        } catch(e) {}
    }

    window.onload = () => {
        initChart();
        connect();
    };

    document.getElementById('market').addEventListener('change', (e) => {
        currentMarket = e.target.value;
        connect();
    });

</script>
</body>
</html>
