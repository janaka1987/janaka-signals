<script>
    // App ID 1089 වෙනුවට වැඩ කරන 31063 පාවිච්චි කරමු
    const APP_ID = "31063"; 
    let chart, candleSeries, ws;
    let currentMarket = "R_100";
    let currentTimeframe = 60;

    function initChart() {
        const chartElement = document.getElementById('chart');
        chart = LightweightCharts.createChart(chartElement, {
            layout: { background: { color: '#0d1117' }, textColor: '#cbd5e1' },
            grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
            timeScale: { timeVisible: true }
        });
        candleSeries = chart.addCandlestickSeries({
            upColor: '#00ff88', downColor: '#ff4d4d',
            borderUpColor: '#00ff88', borderDownColor: '#ff4d4d',
            wickUpColor: '#00ff88', wickDownColor: '#ff4d4d'
        });
    }

    function connect() {
        // පරණ සම්බන්ධතා තිබේ නම් ඒවා වසා දමන්න
        if (ws) ws.close();

        // Deriv සර්වර් එකට සම්බන්ධ වීම
        ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

        ws.onopen = () => {
            console.log("Connected!");
            // දත්ත ඉල්ලීම
            ws.send(JSON.stringify({
                ticks_history: currentMarket,
                end: "latest",
                style: "candles",
                granularity: parseInt(currentTimeframe),
                count: 300,
                subscribe: 1
            }));
        };

        ws.onmessage = (msg) => {
            const data = JSON.parse(msg.data);
            
            // මුල්ම වතාවට දත්ත (History) ලැබෙන විට
            if (data.candles) {
                const history = data.candles.map(c => ({
                    time: c.epoch,
                    open: c.open,
                    high: c.high,
                    low: c.low,
                    close: c.close
                }));
                candleSeries.setData(history);
            }
            
            // සෑම තත්පරයකම අලුත් Candle එක ලැබෙන විට
            if (data.ohlc) {
                candleSeries.update({
                    time: parseInt(data.ohlc.open_time),
                    open: parseFloat(data.ohlc.open),
                    high: parseFloat(data.ohlc.high),
                    low: parseFloat(data.ohlc.low),
                    close: parseFloat(data.ohlc.close)
                });
                // SMC Analysis function එක මෙතනට කැඳවන්න
                analyzeSMC(); 
            }
        };

        ws.onclose = () => setTimeout(connect, 5000); // Disconnect වුනොත් නැවත සම්බන්ධ වෙන්න
    }

    window.onload = () => {
        initChart();
        connect();
    };
</script>
