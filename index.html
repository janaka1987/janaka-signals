<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMC PRO FOREX TRADING DASHBOARD</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root {
            --bg: #090d16;
            --card: #121824;
            --border: #1e293b;
            --green: #10b981;
            --red: #ef4444;
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 8px;
        }

        .header {
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: var(--green);
            padding: 6px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px;
        }

        label {
            font-size: 10px;
            color: var(--text-sub);
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }

        select {
            width: 100%;
            padding: 8px;
            background: #1e293b;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            outline: none;
        }

        #chart-container {
            width: 100%;
            height: 460px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 8px;
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .bias-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 8px;
        }

        .bias-title { font-size: 11px; color: var(--text-sub); font-weight: 600; }
        .bias-status { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 4px; }
        .bullish { background: rgba(16, 185, 129, 0.2); color: var(--green); }
        .bearish { background: rgba(239, 68, 68, 0.2); color: var(--red); }

        .checklist-title {
            font-size: 11px;
            color: var(--text-sub);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .check-item input {
            accent-color: var(--green);
            width: 14px;
            height: 14px;
        }

        .tip-box {
            font-size: 10px;
            color: var(--text-sub);
            background: #0f172a;
            border-left: 3px solid var(--accent);
            padding: 6px 8px;
            border-radius: 4px;
            margin-top: 6px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="header">SMC PRO FOREX DASHBOARD</div>

<div class="controls">
    <div class="card">
        <label>FOREX PAIR</label>
        <select id="pairSelect" onchange="updateChart()">
            <option value="FX:EURUSD" selected>EUR / USD</option>
            <option value="FX:GBPUSD">GBP / USD</option>
            <option value="FX:USDJPY">USD / JPY</option>
            <option value="FX:AUDUSD">AUD / USD</option>
            <option value="OANDA:XAUUSD">GOLD (XAU/USD)</option>
        </select>
    </div>
    <div class="card">
        <label>TIMEFRAME</label>
        <select id="tfSelect" onchange="updateChart()">
            <option value="1">1M (Scalp)</option>
            <option value="5" selected>5M (Intraday)</option>
            <option value="15">15M</option>
            <option value="60">1H</option>
        </select>
    </div>
</div>

<div id="chart-container"></div>

<div class="analysis-grid">
    <!-- Quick Entry Checklist -->
    <div class="card">
        <div class="checklist-title">SMC ENTRY CONFIRMATIONS</div>
        <label class="check-item">
            <input type="checkbox"> Higher Timeframe (1H/15M) Trend Alignment
        </label>
        <label class="check-item">
            <input type="checkbox"> Clear BOS or CHoCH Structure Break
        </label>
        <label class="check-item">
            <input type="checkbox"> Liquidity Sweep / Fakeout Completed
        </label>
        <label class="check-item">
            <input type="checkbox"> Price Entered Unmitigated Order Block / FVG
        </label>
        
        <div class="tip-box">
            <strong>Pro Tip:</strong> Indicator එකේ Label එක වැටුණු සැනින් Trade ගන්න එපා. Checkbox 3ක්වත් Confirm වුණාට පස්සේ විතරක් Order Block එකෙන් Entry එක ගන්න.
        </div>
    </div>
</div>

<script>
    function updateChart() {
        const symbol = document.getElementById('pairSelect').value;
        const interval = document.getElementById('tfSelect').value;

        document.getElementById('chart-container').innerHTML = '';

        new TradingView.widget({
            "autosize": true,
            "symbol": symbol,
            "interval": interval,
            "timezone": "Asia/Colombo",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#121824",
            "enable_publishing": false,
            "hide_top_toolbar": false,
            "hide_legend": false,
            "save_image": false,
            "container_id": "chart-container"
        });
    }

    window.onload = function() {
        updateChart();
    };
</script>

</body>
</html>
