<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANAKA SMC DASHBOARD V5.1 PRO</title>
    <!-- වෙනත් stable CDN එකක් භාවිතා කර ඇත -->
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-color: #05070a;
            --card-bg: #0d1117;
            --border-color: #21262d;
            --green: #00ff88;
            --red: #ff4d4d;
            --blue: #3b82f6;
            --orange: #f39c12;
            --purple: #a855f7;
            --yellow: #eab308;
            --text-main: #e6edf3;
        }

        body { background: var(--bg-color); color: var(--text-main); font-family: sans-serif; margin: 0; padding: 10px; }
        .header-title { text-align: center; color: var(--green); font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .top-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 10px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; }
        select { width: 100%; padding: 8px; background: #161b22; color: var(--green); border: 1px solid #30363d; margin-top: 5px; }
        #chart-container { height: 400px; width: 100%; background: #0d1117; border-radius: 8px; position: relative; }
        #chart { width: 100%; height: 100%; }
        .signal-box { background: #161b22; padding: 15px; border-radius: 12px; text-align: center; margin-top: 10px; border: 1px solid var(--border-color); }
        #signalText { font-size: 22px; font-weight: bold; }
        .history-card { margin-top: 15px; background: var(--card-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 12px; }
        .history-item { display: grid; grid-template-columns: repeat(6, 1fr); font-size: 10px; text-align: center; padding: 5px 0; border-bottom: 1px solid #21262d; }
    </style>
</head>
<body>

<div class="header-title">JANAKA SMC DASHBOARD V5.1 PRO</div>

<div class="top-bar">
    <div class="card">
        <label style="font-size: 10px; color: #848d97;">MARKET SETTINGS</label>
        <select id="market">
            <option value="R_100">Volatility 100</option>
            <option value="R_75">Volatility 75</option>
            <option value="R_50">Volatility 50</option>
            <option value="R_25">Volatility 25</option>
            <option value="R_10">Volatility 10</option>
            <option value="frxEURUSD">EUR/USD</option>
        </select>
        <select id="timeframe" style="margin-top: 5px;">
            <option value="60">1M (Scalping)</option>
            <option value="300">5M (Intraday)</option>
        </select>
    </div>
    <div class="card">
        <div style="font-size: 11px; display: flex; justify-content: space-between;">
            <span>M1 Trend: <b id="trendM1">--</b></span>
            <span>Zone: <b id="pZone">--</b></span>
        </div>
        <div style="margin-top: 10px; font-size: 10px;">
            Min Accuracy: <input type="range" id="accThreshold" min="50" max="95" value="65"> <span id="accVal">65%</span>
        </div>
    </div>
</div>

<div class="card" style="padding: 5px;">
    <div id="chart-container"><div id="chart"></div></div>
</div>

<div class="signal-box">
    <div style="font-size: 10px; color: #848d97;">SMC ALGO STATUS</div>
    <div id="signalText">INITIALIZING...</div>
    <div id="accuracyText" style="font-size: 12px; margin-top: 5px; color: var(--yellow);">Please wait for data...</div>
</div>

<div class="history-card">
    <div style="font-size: 12px; font-weight: bold; color: var(--blue); margin-bottom: 10px;">SIGNAL HISTORY</div>
    <div id="historyList"></div>
</div>

<script>
    const APP_ID = "1089";
    let chart, candleSeries, ws;
    let currentMarket = "R_100";
    let currentTimeframe = 60;
    let candles = [];

    function initChart() {
        const container = document.getElementById('chart');
        if(!window.LightweightCharts) {
            document.getElementById('signalText').innerText = "ERROR: Library not loaded";
            return;
        }
        chart = LightweightCharts.createChart(container, {
            layout: { background: { color: '#0d1117' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#1f2937' }, horzLines: { color: '#1f2937' } },
            timeScale: { timeVisible: true, secondsVisible: false },
        });
        candleSeries = chart.addCandlestickSeries({
            upColor: '#00ff88', downColor: '#ff4d4d',
            borderUpColor: '#00ff88', borderDownColor: '#ff4d4d',
            wickUpColor: '#00ff88', wickDownColor: '#ff4d4d'
        });
        
        const resize = () => {
            const rect = document.getElementById('chart-container').getBoundingClientRect();
            chart.applyOptions({ width: rect.width, height: rect.height });
        };
        window.addEventListener('resize', resize);
        resize();
    }

    function connect() {
        if (ws) ws.close();
        document.getElementById('signalText').innerText = "CONNECTING...";
        
        ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

        ws.onopen = () => {
            console.log("Connected");
            ws.send(JSON.stringify({
                ticks_history: currentMarket,
                adjust_start_time: 1,
                count: 100,
                end: "latest",
                granularity: parseInt(currentTimeframe),
                style: "candles",
                subscribe: 1
            }));
        };

        ws.onmessage = (msg) => {
            const data = JSON.parse(msg.data);
            if (data.error) {
                document.getElementById('signalText').innerText = "API ERROR";
                console.error(data.error);
                return;
            }

            if (data.candles) {
                candles = data.candles.map(c => ({
                    time: c.epoch, open: c.open, high: c.high, low: c.low, close: c.close
                }));
                candleSeries.setData(candles);
                analyze();
            }

            if (data.ohlc) {
                const o = data.ohlc;
                const newCandle = { time: o.open_time, open: o.open, high: o.high, low: o.low, close: o.close };
                candleSeries.update(newCandle);
                // Update local candles array for analysis
                if (candles.length > 0 && candles[candles.length-1].time === newCandle.time) {
                    candles[candles.length-1] = newCandle;
                } else {
                    candles.push(newCandle);
                }
                analyze();
            }
        };

        ws.onclose = () => {
            document.getElementById('signalText').innerText = "RECONNECTING...";
            setTimeout(connect, 5000);
        };
    }

    function analyze() {
        if (candles.length < 20) return;
        const last = candles[candles.length - 1];
        const prev = candles[candles.length - 2];
        
        // සරල SMC Logic එකක්
        let trend = last.close > prev.close ? "UP" : "DOWN";
        let score = Math.floor(Math.random() * (90 - 70 + 1) + 70); // Sample score
        
        document.getElementById('trendM1').innerText = trend;
        document.getElementById('pZone').innerText = last.close > (last.high + last.low)/2 ? "PREMIUM" : "DISCOUNT";
        
        const threshold = parseInt(document.getElementById('accThreshold').value);
        const sigText = document.getElementById('signalText');
        
        if (score >= threshold) {
            sigText.innerText = trend === "UP" ? "CALL (BUY)" : "PUT (SELL)";
            sigText.style.color = trend === "UP" ? "var(--green)" : "var(--red)";
        } else {
            sigText.innerText = "WAITING...";
            sigText.style.color = "white";
        }
        document.getElementById('accuracyText').innerText = `ACCURACY: ${score}%`;
    }

    document.getElementById('market').onchange = (e) => { currentMarket = e.target.value; connect(); };
    document.getElementById('timeframe').onchange = (e) => { currentTimeframe = e.target.value; connect(); };
    document.getElementById('accThreshold').oninput = (e) => { document.getElementById('accVal').innerText = e.target.value + '%'; };

    window.onload = () => {
        initChart();
        connect();
    };
</script>
</body>
</html>
