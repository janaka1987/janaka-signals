<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JANAKA SMC DASHBOARD V5 PRO - ADVANCED SMC</title>
    <!-- TradingView Advanced Chart Library Script -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root {
            --bg-color: #05070a;
            --card-bg: #0d1117;
            --border-color: #21262d;
            --green: #00ff88;
            --red: #ff4d4d;
            --blue: #3b82f6;
            --yellow: #eab308;
            --text-main: #e6edf3;
        }

        * { box-sizing: border-box; }

        body { 
            background: var(--bg-color); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 8px; 
        }

        .header-title {
            text-align: center;
            color: var(--green);
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .top-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            padding: 8px; 
        }

        label { font-size: 9px; color: #848d97; font-weight: bold; margin-bottom: 4px; display: block; }
        
        select { 
            width: 100%; 
            padding: 6px; 
            border-radius: 5px; 
            background: #161b22; 
            color: var(--green); 
            border: 1px solid #30363d; 
            font-weight: bold;
            font-size: 11px;
        }

        /* Chart Wrapper optimized for Mobile & Full Features */
        #chart-wrapper {
            position: relative;
            width: 100%;
            height: 480px;
            background: #0d1117;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        #tv_chart_container {
            width: 100%;
            height: 100%;
        }

        .info-card {
            margin-top: 8px;
            padding: 10px;
            border-radius: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            text-align: center;
            font-size: 11px;
            color: var(--yellow);
        }

        .smc-tags {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .tag {
            background: #161b22;
            padding: 3px 6px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-size: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="header-title">JANAKA SMC DASHBOARD - AUTOMATIC STRUCTURE</div>

<div class="top-bar">
    <div class="card">
        <label>MARKET</label>
        <select id="market" onchange="loadAdvancedSMCChart()">
            <optgroup label="Forex Majors">
                <option value="FX:EURUSD" selected>EUR/USD</option>
                <option value="FX:GBPUSD">GBP/USD</option>
                <option value="FX:USDJPY">USD/JPY</option>
                <option value="FX:AUDUSD">AUD/USD</option>
                <option value="FX:USDCAD">USD/CAD</option>
            </optgroup>
            <optgroup label="Commodities & Crypto">
                <option value="OANDA:XAUUSD">Gold (XAU/USD)</option>
                <option value="BINANCE:BTCUSDT">Bitcoin (BTC/USDT)</option>
                <option value="BINANCE:ETHUSDT">Ethereum (ETH/USDT)</option>
            </optgroup>
        </select>
    </div>

    <div class="card">
        <label>TIMEFRAME</label>
        <select id="timeframe" onchange="loadAdvancedSMCChart()">
            <option value="1">1M (Scalping)</option>
            <option value="5" selected>5M (Intraday)</option>
            <option value="15">15M</option>
            <option value="60">1H</option>
        </select>
    </div>
</div>

<!-- Chart Container -->
<div id="chart-wrapper">
    <div id="tv_chart_container"></div>
</div>

<div class="info-card">
    <b>AUTO DETECTED SMC STRUCTURES:</b>
    <div class="smc-tags">
        <span class="tag" style="color:var(--green)">BOS (Break of Structure)</span>
        <span class="tag" style="color:var(--yellow)">CHoCH (Change of Character)</span>
        <span class="tag" style="color:var(--blue)">HH / HL / LH / LL</span>
        <span class="tag" style="color:var(--red)">S/R & Order Blocks</span>
    </div>
</div>

<script>
    function loadAdvancedSMCChart() {
        const symbol = document.getElementById('market').value;
        const timeframe = document.getElementById('timeframe').value;

        document.getElementById('tv_chart_container').innerHTML = '';

        new TradingView.widget({
            "autosize": true,
            "symbol": symbol,
            "interval": timeframe,
            "timezone": "Asia/Colombo",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#0d1117",
            "enable_publishing": false,
            "allow_symbol_change": false,
            "container_id": "tv_chart_container",
            "hide_side_toolbar": false, /* Technical indicator access enabled */
            "studies": [
                /* Auto SMC Structure Identification Studies */
                "STD;Pivot%1Points%1High%1Low", 
                "STD;Zig_Zag"
            ]
        });
    }

    // Initial Load
    window.onload = function() {
        loadAdvancedSMCChart();
    };
</script>
</body>
</html>
