<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>JANAKA SMC DASHBOARD V6 PRO</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
rel="stylesheet">

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

:root{

--bg:#05070A;

--card:#111827;

--card2:#0F172A;

--border:#233044;

--green:#00FF88;

--red:#FF4D4D;

--blue:#38BDF8;

--text:#FFFFFF;

--muted:#94A3B8;

}

body{

background:var(--bg);

font-family:'Inter',sans-serif;

color:var(--text);

padding:16px;

overflow-x:hidden;

}

.container{

width:100%;

max-width:1700px;

margin:auto;

}

.title{

font-size:32px;

font-weight:800;

text-align:center;

letter-spacing:2px;

margin-bottom:20px;

color:var(--green);

text-shadow:

0 0 8px rgba(0,255,136,.6),

0 0 25px rgba(0,255,136,.25);

}

.grid-top{

display:grid;

grid-template-columns:1fr 1fr;

gap:18px;

margin-bottom:18px;

}

.card{

background:linear-gradient(

180deg,

#111827,

#0B1220

);

border:1px solid var(--border);

border-radius:20px;

padding:18px;

box-shadow:

0 12px 25px

rgba(0,0,0,.35);

}

.card h3{

font-size:17px;

font-weight:700;

color:var(--blue);

margin-bottom:14px;

letter-spacing:.5px;

}

select{

width:100%;

height:56px;

background:#08111F;

color:white;

border:1px solid #334155;

border-radius:14px;

padding:0 16px;

font-size:17px;

outline:none;

transition:.25s;

}

select:focus{

border-color:var(--green);

box-shadow:

0 0 12px

rgba(0,255,136,.3);

}

.status{

font-size:17px;

line-height:34px;

}

.status span{

font-weight:700;

color:var(--green);

}

.chart-card{

padding:14px;

}

.chart-title{

font-size:18px;

font-weight:700;

color:var(--blue);

margin-bottom:12px;

}

#chart{

width:100%;

height:560px;

border-radius:16px;

overflow:hidden;

background:#0A1322;

border:1px solid var(--border);

}

.bottom-grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:18px;

margin-top:18px;

}

.info-box{

background:

linear-gradient(

180deg,

#111827,

#0A1322

);

border:1px solid var(--border);

border-radius:18px;

padding:22px;

text-align:center;

box-shadow:

0 8px 20px

rgba(0,0,0,.35);

}

.info-title{

font-size:14px;

font-weight:600;

letter-spacing:1px;

color:var(--muted);

margin-bottom:12px;

}

.info-value{

font-size:30px;

font-weight:700;

font-family:

'JetBrains Mono',

monospace;

}

.green{

color:var(--green);

}

.cyan{

color:var(--blue);

}

.red{

color:var(--red);

}

@media(max-width:900px){

.title{

font-size:26px;

}

.grid-top{

grid-template-columns:1fr;

}

.bottom-grid{

grid-template-columns:1fr 1fr;

}

#chart{

height:520px;

}

}

</style>

</head>
