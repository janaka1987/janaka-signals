<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMC Pro AI Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #05070a; --glass: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.08); }
        body { background-color: var(--bg); color: #e1e1e1; font-family: 'Inter', sans-serif; overflow-x: hidden; margin: 0; }
        .glass { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 12px; }
        .neon-text { font-family: 'Orbitron', sans-serif; text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        #chart-container { height: 500px; width: 100%; position: relative; }
        select { background: #1a1e23; color: white; border: 1px solid var(--border); padding: 5px 10px; border-radius: 8px; outline: none; }
    </style>
</head>
<body class="p-2 md:p-6">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="glass p-5 mb-4 flex flex-wrap justify-between items-center">
            <div class="flex items-center gap-4">
                <h1 class="neon-text text-xl font-bold text-blue-500 tracking-widest">SMC-AI ENGINE</h1>
                <select id="market-select" onchange="changeMarket()">
                    <option value="1HZ75V" selected>Volatility 75 (1s)</option>
                    <option value="1HZ10V">Volatility 10 (1s)</option>
                    <option value="1HZ100V">Volatility 100 (1s)</option>
                    <option value="R_100">Volatility 100 Index</option>
                </select>
            </div>
            <div class="flex gap-8">
                <div class="text-right"><p class="text-[10px] text-gray-500 uppercase">Live Price</p><p id="price" class="text-lg font-mono font-bold text-green-400">0.00</p></div>
                <div class="text-right"><p class="text-[10px] text-gray-500 uppercase">Structure</p><p id="struct" class="text-lg font-bold text-blue-400">CONNECTING...</p></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
            <!-- Sidebar -->
            <div class="lg:col-span-1 space-y-4">
                <div class="glass p-4">
                    <h3 class="text-xs text-gray-500 mb-2 uppercase">Market Trend</h3>
                    <div id="trend-box" class="h-2 w-full bg-gray-800 rounded-full overflow-hidden">
                        <div id="trend-bar" class="h-full bg-blue-500 transition-all duration-500" style="width: 50%"></div>
                    </div>
                    <p id="trend-text" class="mt-2 text-sm font-semibold text-center">Analysing...</p>
                </div>
                <div class="glass p-4">
                    <h3 class="text-xs text-gray-500 mb-2 uppercase">Structure Log</h3>
                    <div id="log" class="text-[11px] font-mono space-y-2 h-80 overflow-y-auto">
                        <p class="text-gray-500">System initialization...</p>
                    </div>
                </div>
            </div>

            <!-- Chart -->
            <div class="lg:col-span-3 glass relative overflow-hidden">
                <div id="chart-container"></div>
                <div class="absolute bottom-5 right-5 text-white/5 text-3xl font-black pointer-events-none uppercase italic">SMC PRO AI</div>
            </div>
        </div>
    </div>

    <script>
        let currentSymbol = '1HZ75V';
        let ws;
        let candleData = [];
        let markers = [];

        // 1. Chart Setup
        const chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
            layout: { background: { color: 'transparent' }, textColor: '#848e9c', fontSize: 11 },
            grid: { vertLines: { color: '#161a1e' }, horzLines: { color: '#161a1e' } },
            crosshair: { mode: 0 },
            timeScale: { borderColor: '#2b3139', timeVisible: true, secondsVisible: true },
        });

        const candleSeries = chart.addCandlestickSeries({
            upColor: '#089981', downColor: '#f23645', borderVisible: false,
            wickUpColor: '#089981', wickDownColor: '#f23645',
        });

        // 2. WebSocket Connection
        function connect() {
            if (ws) ws.close();
            ws = new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');

            ws.onopen = () => {
                addLog(`Connected to ${currentSymbol}`, 'text-blue-400');
                ws.send(JSON.stringify({
                    ticks_history: currentSymbol, adjust_start_time: 1, count: 100,
                    end: "latest", granularity: 60, style: "candles", subscribe: 1
                }));
            };

            ws.onmessage = (msg) => {
                const res = JSON.parse(msg.data);
                
                if (res.candles) {
                    candleData = res.candles.map(c => ({ 
                        time: c.epoch, open: c.open, high: c.high, low: c.low, close: c.close 
                    }));
                    candleSeries.setData(candleData);
                    analyzeSMC();
                }

                if (res.ohlc) {
                    const o = res.ohlc;
                    const update = { time: o.open_time, open: o.open, high: o.high, low: o.low, close: o.close };
                    candleSeries.update(update);
                    document.getElementById('price').innerText = o.close;
                    
                    // Update last candle in array
                    if (candleData.length > 0) {
                        candleData[candleData.length - 1] = update;
                    }
                    analyzeSMC();
                }
            };

            ws.onerror = () => addLog("Connection Error!", "text-red-500");
        }

        // 3. SMC Logic (BOS / CHOCH / HH-LL)
        function analyzeSMC() {
            if (candleData.length < 10) return;
            
            markers = [];
            const lookback = 3; 

            for (let i = lookback; i < candleData.length - lookback; i++) {
                let isHigh = true, isLow = true;
                for (let j = 1; j <= lookback; j++) {
                    if (candleData[i].high < candleData[i-j].high || candleData[i].high < candleData[i+j].high) isHigh = false;
                    if (candleData[i].low > candleData[i-j].low || candleData[i].low > candleData[i+j].low) isLow = false;
                }

                if (isHigh) {
                    markers.push({ time: candleData[i].time, position: 'aboveBar', color: '#00ffcc', shape: 'arrowDown', text: 'H' });
                }
                if (isLow) {
                    markers.push({ time: candleData[i].time, position: 'belowBar', color: '#ff4d4d', shape: 'arrowUp', text: 'L' });
                }
            }

            // Simple Trend Logic
            const last = candleData[candleData.length-1];
            const prev = candleData[candleData.length-5];
            if(last.close > prev.high) {
                document.getElementById('struct').innerText = "Bullish BOS";
                document.getElementById('trend-text').innerText = "Strong Buy";
                document.getElementById('trend-bar').style.width = "90%";
                document.getElementById('trend-bar').style.backgroundColor = "#089981";
            } else if (last.close < prev.low) {
                document.getElementById('struct').innerText = "Bearish CHOCH";
                document.getElementById('trend-text').innerText = "Strong Sell";
                document.getElementById('trend-bar').style.width = "10%";
                document.getElementById('trend-bar').style.backgroundColor = "#f23645";
            }

            candleSeries.setMarkers(markers);
        }

        function changeMarket() {
            currentSymbol = document.getElementById('market-select').value;
            candleData = [];
            addLog(`Switching to ${currentSymbol}...`, 'text-yellow-500');
            connect();
        }

        function addLog(txt, colorClass) {
            const log = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('p');
            entry.className = colorClass;
            entry.innerHTML = `<span class="text-gray-600">[${time}]</span> ${txt}`;
            log.prepend(entry);
        }

        // START
        window.onload = connect;

    </script>
</body>
</html>
