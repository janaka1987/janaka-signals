<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANAKA SMC DASHBOARD V6 PRO - UPDATED</title>
    <script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-color: #05070a;
            --card-bg: #0d1117;
            --border-color: #21262d;
            --green: #00ff88;
            --red: #ff4d4d;
            --blue: #3b82f6;
            --orange: #f39c12;
            --purple: #a855f7;
            --yellow: #eab308;
            --text-main: #e6edf3;
        }

        body { background: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
        .header-title { text-align: center; color: var(--green); font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .top-bar { display: grid; grid-template-columns: 1.2fr 2fr; gap: 10px; margin-bottom: 10px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; }
        label { font-size: 10px; color: #848d97; font-weight: bold; }
        select { width: 100%; padding: 8px; margin-top:5px; background: #161b22; color: var(--green); border: 1px solid #30363d; border-radius: 5px; outline: none; }
        #chart { height: 450px; width: 100%; border-radius: 8px; overflow: hidden; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        .stat-box { background: var(--card-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); text-align: center; }
        .stat-box span { display: block; font-size: 9px; color: #848d97; text-transform: uppercase; }
        .stat-box b { font-size: 13px; }
        .signal-box { background: linear-gradient(145deg, #161b22, #0d1117); padding: 15px; border-radius: 12px; text-align: center; border: 2px solid var(--border-color); margin-top: 10px; }
        #signalText { font-size: 22px; font-weight: bold; }
        .val-g { color: var(--green); } .val-r { color: var(--red); } .val-y { color: var(--yellow); }
    </style>
</head>
<body>

<div class="header-title">JANAKA SMC DASHBOARD V6 PRO</div>

<div class="top-bar">
    <div class="card">
        <label>SETTINGS</label>
        <select id="market">
            <option value="R_100">Volatility 100</option>
            <option value="R_75">Volatility 75</option>
            <option value="R_50">Volatility 50</option>
        </select>
        <select id="timeframe">
            <option value="60">1M (Scalping)</option>
            <option value="300">5M (Intraday)</option>
        </select>
    </div>
    <div class="card">
        <label>SMC STATUS</label>
        <div style="display: flex; justify-content: space-around; margin-top: 10px;">
            <div>Trend: <span id="trendM1" class="val-g">--</span></div>
            <div>Zone: <span id="pZone" class="val-y">--</span></div>
        </div>
    </div>
</div>

<div class="card" style="padding: 5px;">
    <div id="chart"></div>
</div>

<div class="stats-grid">
    <div class="stat-box"><span>1M TREND</span><b id="trendText">--</b></div>
    <div class="stat-box"><span>ORDER BLOCK</span><b id="obText" class="val-y">WAITING</b></div>
    <div class="stat-box"><span>BOS/CHoCH</span><b id="strucText" style="color:var(--blue)">NONE</b></div>
    <div class="stat-box"><span>LIQUIDITY</span><b id="liqText" style="color:var(--purple)">STABLE</b></div>
</div>

<div class="signal-box">
    <div id="signalText">ANALYZING MARKET...</div>
    <div id="accuracyText" style="font-size: 12px; color: #848d97;">WAITING FOR SETUP</div>
</div>

<script>
    const APP_ID = "1089";
    let chart, candleSeries, zigZagSeries, trendHighSeries, trendLowSeries;
    let ws, candles = [];
    let currentMarket = "R_100", currentTimeframe = 60;
    
    // Persistent Markers Arrays
    let structureMarkers = []; 
    let lastProcessedTime = 0;
    let supportLine, resistanceLine;

    function initChart() {
        chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: { background: { color: '#0d1117' }, textColor: '#cbd5e1' },
            grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
            rightPriceScale: { borderColor: '#30363d' },
            timeScale: { borderColor: '#30363d', timeVisible: true }
        });

        candleSeries = chart.addCandlestickSeries({ upColor: '#00ff88', downColor: '#ff4d4d' });
        zigZagSeries = chart.addLineSeries({ color: 'rgba(255, 255, 255, 0.2)', lineWidth: 1, lineStyle: 2 });
        
        // Series for Trend Lines
        trendHighSeries = chart.addLineSeries({ color: '#3b82f6', lineWidth: 1, lineStyle: 2 });
        trendLowSeries = chart.addLineSeries({ color: '#ff4d4d', lineWidth: 1, lineStyle: 2 });
    }

    function connect() {
        if (ws) ws.close();
        ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);
        ws.onopen = () => {
            candles = []; structureMarkers = [];
            ws.send(JSON.stringify({ ticks_history: currentMarket, end: "latest", style: "candles", granularity: parseInt(currentTimeframe), count: 500, subscribe: 1 }));
        };
        ws.onmessage = (msg) => {
            const data = JSON.parse(msg.data);
            if (data.candles) { candles = data.candles.map(c => ({ time: c.epoch, open: c.open, high: c.high, low: c.low, close: c.close })); candleSeries.setData(candles); }
            if (data.ohlc) {
                const o = data.ohlc;
                const newCandle = { time: o.open_time, open: o.open, high: o.high, low: o.low, close: o.close };
                if (candles.length > 0 && candles[candles.length - 1].time === newCandle.time) candles[candles.length - 1] = newCandle;
                else candles.push(newCandle);
                candleSeries.update(newCandle);
                analyzeSMC();
            }
        };
    }

    function analyzeSMC() {
        if (candles.length < 50) return;
        const lookback = 5;
        let pivots = [];

        // 1. Pivot Detection (HH, HL, LH, LL)
        for (let i = lookback; i < candles.length - lookback; i++) {
            let isH = true, isL = true;
            for (let j = i - lookback; j <= i + lookback; j++) {
                if (i === j) continue;
                if (candles[j].high > candles[i].high) isH = false;
                if (candles[j].low < candles[i].low) isL = false;
            }
            if (isH) pivots.push({ type: 'H', time: candles[i].time, price: candles[i].high });
            if (isL) pivots.push({ type: 'L', time: candles[i].time, price: candles[i].low });
        }

        let zigzag = [];
        pivots.forEach(p => {
            if (zigzag.length === 0 || zigzag[zigzag.length-1].type !== p.type) zigzag.push(p);
            else if ((p.type === 'H' && p.price > zigzag[zigzag.length-1].price) || (p.type === 'L' && p.price < zigzag[zigzag.length-1].price)) zigzag[zigzag.length-1] = p;
        });
        zigZagSeries.setData(zigzag.map(z => ({ time: z.time, value: z.price })));

        // 2. BOS & CHoCH Logic (Persistent)
        if (zigzag.length > 4) {
            let lastP = zigzag[zigzag.length-1];
            let prevP = zigzag[zigzag.length-2];
            let prevSameP = zigzag[zigzag.length-3];
            let currentPrice = candles[candles.length-1].close;

            // Trend & Structure logic
            let trend = zigzag[zigzag.length-1].price > zigzag[zigzag.length-3].price ? 'UP' : 'DOWN';

            // Detect BOS
            if (trend === 'UP' && currentPrice > lastP.price && lastP.type === 'H' && lastP.time > lastProcessedTime) {
                addMarker(lastP.time, 'BOS', '#3b82f6', 'aboveBar');
                lastProcessedTime = lastP.time;
            } 
            // Detect CHoCH (Trend Reversal)
            else if (trend === 'DOWN' && currentPrice > lastP.price && lastP.type === 'H' && lastP.time > lastProcessedTime) {
                addMarker(lastP.time, 'CHoCH', '#a855f7', 'aboveBar');
                lastProcessedTime = lastP.time;
            }

            document.getElementById('strucText').innerText = trend === 'UP' ? "BOS (BULL)" : "BOS (BEAR)";
        }

        // 3. Draw S/R Lines (Horizontal)
        const lastH = zigzag.filter(p => p.type === 'H').pop();
        const lastL = zigzag.filter(p => p.type === 'L').pop();

        if (lastH) {
            if (resistanceLine) candleSeries.removePriceLine(resistanceLine);
            resistanceLine = candleSeries.createPriceLine({ price: lastH.price, color: '#ff4d4d', lineWidth: 2, lineStyle: 0, axisLabelVisible: true, title: 'RESISTANCE' });
        }
        if (lastL) {
            if (supportLine) candleSeries.removePriceLine(supportLine);
            supportLine = candleSeries.createPriceLine({ price: lastL.price, color: '#00ff88', lineWidth: 2, lineStyle: 0, axisLabelVisible: true, title: 'SUPPORT' });
        }

        // 4. Draw Trend Lines (Connecting last two pivots)
        const highPivots = zigzag.filter(p => p.type === 'H').slice(-2);
        const lowPivots = zigzag.filter(p => p.type === 'L').slice(-2);
        if(highPivots.length == 2) trendHighSeries.setData([{time: highPivots[0].time, value: highPivots[0].price}, {time: highPivots[1].time, value: highPivots[1].price}]);
        if(lowPivots.length == 2) trendLowSeries.setData([{time: lowPivots[0].time, value: lowPivots[0].price}, {time: lowPivots[1].time, value: lowPivots[1].price}]);

        candleSeries.setMarkers(structureMarkers);
        updateUI(zigzag);
    }

    function addMarker(time, text, color, pos) {
        if (!structureMarkers.find(m => m.time === time && m.text === text)) {
            structureMarkers.push({ time: time, position: pos, color: color, shape: 'arrowUp', text: text });
        }
    }

    function updateUI(zigzag) {
        const trend = zigzag[zigzag.length-1].price > zigzag[zigzag.length-3].price ? 'UP' : 'DOWN';
        const cp = candles[candles.length-1].close;
        const eq = (Math.max(...candles.slice(-50).map(c=>c.high)) + Math.min(...candles.slice(-50).map(c=>c.low))) / 2;
        const zone = cp > eq ? 'PREMIUM' : 'DISCOUNT';

        document.getElementById('trendText').innerText = trend;
        document.getElementById('trendM1').innerText = trend;
        document.getElementById('pZone').innerText = zone;
        
        if (trend === 'UP' && zone === 'DISCOUNT') {
            document.getElementById('signalText').innerText = "BUY SETUP (2-3M)";
            document.getElementById('signalText').className = "val-g";
        } else if (trend === 'DOWN' && zone === 'PREMIUM') {
            document.getElementById('signalText').innerText = "SELL SETUP (2-3M)";
            document.getElementById('signalText').className = "val-r";
        } else {
            document.getElementById('signalText').innerText = "WAITING FOR SETUP...";
            document.getElementById('signalText').className = "";
        }
    }

    document.getElementById('market').onchange = (e) => { currentMarket = e.target.value; connect(); };
    document.getElementById('timeframe').onchange = (e) => { currentTimeframe = e.target.value; connect(); };
    window.onload = () => { initChart(); connect(); };
</script>
</body>
</html>
