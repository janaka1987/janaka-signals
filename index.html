<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JANAKA SMC DASHBOARD V6 PRO - FULL LABELS FIXED</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

<style>
*{ margin:0; padding:0; box-sizing:border-box; }
:root{
    --bg:#05070A;
    --card:#111827;
    --border:#233044;
    --green:#00FF88;
    --red:#FF4D4D;
    --blue:#38BDF8;
    --text:#FFFFFF;
    --muted:#94A3B8;
}

body{ background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); padding:16px; overflow-x:hidden; }
.container{ width:100%; max-width:1700px; margin:auto; }

.title{
    font-size:32px; font-weight:800; text-align:center; letter-spacing:2px; margin-bottom:20px;
    color:var(--green); text-shadow: 0 0 8px rgba(0,255,136,.6), 0 0 25px rgba(0,255,136,.25);
}

.grid-top{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:18px; }
.card{ background:linear-gradient(180deg, #111827, #0B1220); border:1px solid var(--border); border-radius:20px; padding:18px; box-shadow: 0 12px 25px rgba(0,0,0,.35); }
.card h3{ font-size:17px; font-weight:700; color:var(--blue); margin-bottom:14px; letter-spacing:.5px; }

select{ width:100%; height:56px; background:#08111F; color:white; border:1px solid #334155; border-radius:14px; padding:0 16px; font-size:17px; outline:none; transition:.25s; }
select:focus{ border-color:var(--green); box-shadow: 0 0 12px rgba(0,255,136,.3); }

.status{ font-size:17px; line-height:34px; }
.status span{ font-weight:700; color:var(--green); }

.chart-card{ padding:14px; }
.chart-title{ font-size:18px; font-weight:700; color:var(--blue); margin-bottom:12px; }

#chart-wrapper { 
    display: flex; 
    flex-direction: column; 
    border: 1px solid var(--border); 
    border-radius: 16px; 
    overflow: hidden; 
    background:#0A1322;
}
#chart{ width:100%; height:450px; }
#rsi-chart{ width:100%; height:150px; border-top: 1px solid var(--border); }

.bottom-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:18px; }

.info-box{
    background: linear-gradient(180deg, #111827, #0A1322); border:1px solid var(--border);
    border-radius:18px; padding:22px; text-align:center; box-shadow: 0 8px 20px rgba(0,0,0,.35);
}

.info-title{ font-size:14px; font-weight:600; letter-spacing:1px; color:var(--muted); margin-bottom:12px; }
.info-value{ font-size:26px; font-weight:700; font-family: 'JetBrains Mono', monospace; }

.led-box { display: flex; flex-direction: column; align-items: center; justify-content: center; }
.led-indicator { width: 20px; height: 20px; border-radius: 50%; margin-bottom: 10px; background: #334155; }
.led-active-buy { background: var(--green); box-shadow: 0 0 20px var(--green); }
.led-active-sell { background: var(--red); box-shadow: 0 0 20px var(--red); }

.green{ color:var(--green); } .cyan{ color:var(--blue); } .red{ color:var(--red); }

@media(max-width:900px){
    .grid-top{ grid-template-columns:1fr; }
    .bottom-grid{ grid-template-columns:1fr; }
    #chart{ height:350px; }
}
</style>
</head>
<body>

<div class="container">
    <div class="title">JANAKA SMC DASHBOARD V6 PRO</div>

    <div class="grid-top">
        <div class="card">
            <h3>📊 SELECT MARKET</h3>
            <select id="market">
                <option value="R_10">Volatility 10</option>
                <option value="R_25">Volatility 25</option>
                <option value="R_50" selected>Volatility 50</option>
                <option value="R_75">Volatility 75</option>
                <option value="R_100">Volatility 100</option>
            </select>
        </div>

        <div class="card">
            <h3>🌐 CONNECTION STATUS</h3>
            <div class="status">
                Status : <span id="status">Connecting...</span><br>
                Market : <span id="marketName">Volatility 50</span>
            </div>
        </div>
    </div>

    <div class="card chart-card">
        <div class="chart-title">📈 LIVE MARKET CHART & SMC LABELS</div>
        <div id="chart-wrapper">
            <div id="chart"></div>
            <div id="rsi-chart"></div>
        </div>
    </div>

    <div class="bottom-grid">
        <div class="info-box">
            <div class="info-title">📈 SMC TREND</div>
            <div class="info-value green" id="trend">WAIT</div>
        </div>
        <div class="info-box led-box">
            <div class="info-title">⚡ SIGNAL LED</div>
            <div id="led" class="led-indicator"></div>
            <div class="info-value" id="signalValue">NEUTRAL</div>
        </div>
        <div class="info-box">
            <div class="info-title">🛠 SYSTEM</div>
            <div class="info-value cyan" id="systemStatus">READY</div>
        </div>
    </div>
</div>

<script>
const APP_ID = "1089";
const TIMEFRAME = 60;
const MAX_CANDLES = 250;

let ws = null;
let mainChart = null, rsiChart = null;
let candleSeries = null, trendSeries = null, ema9Series = null, ema21Series = null, rsiLineSeries = null;
let candles = [];
let currentMarket = "R_50";

function createCharts() {
    const chartOptions = {
        layout: { background: { color: "#0A1322" }, textColor: "#94A3B8" },
        grid: { vertLines: { color: "#162033" }, horzLines: { color: "#162033" } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        timeScale: { borderColor: "#233044", timeVisible: true }
    };

    mainChart = LightweightCharts.createChart(document.getElementById("chart"), { ...chartOptions, height: 450 });
    candleSeries = mainChart.addCandlestickSeries({ upColor: "#00FF88", downColor: "#FF4D4D", borderUpColor: "#00FF88", borderDownColor: "#FF4D4D", wickUpColor: "#00FF88", wickDownColor: "#FF4D4D" });
    ema9Series = mainChart.addLineSeries({ color: '#38BDF8', lineWidth: 2 });
    ema21Series = mainChart.addLineSeries({ color: '#F59E0B', lineWidth: 2 });
    trendSeries = mainChart.addLineSeries({ color: 'rgba(56, 189, 248, 0.3)', lineWidth: 1, lineStyle: 2 });

    rsiChart = LightweightCharts.createChart(document.getElementById("rsi-chart"), { ...chartOptions, height: 150, timeScale: { visible: false } });
    rsiLineSeries = rsiChart.addLineSeries({ color: '#F59E0B', lineWidth: 2 });
    rsiLineSeries.createPriceLine({ price: 70, color: '#FF4D4D', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '70' });
    rsiLineSeries.createPriceLine({ price: 50, color: '#38BDF8', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '50' });
    rsiLineSeries.createPriceLine({ price: 30, color: '#00FF88', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '30' });

    mainChart.timeScale().subscribeVisibleTimeRangeChange(range => { if(range) rsiChart.timeScale().setVisibleRange(range); });
    window.addEventListener('resize', () => {
        mainChart.applyOptions({ width: document.getElementById("chart").clientWidth });
        rsiChart.applyOptions({ width: document.getElementById("rsi-chart").clientWidth });
    });
}

function calculateSMC() {
    if (candles.length < 20) return;
    let markers = [];
    let swings = [];
    const windowSize = 5;

    for (let i = windowSize; i < candles.length - windowSize; i++) {
        let isHigh = true, isLow = true;
        for (let j = 1; j <= windowSize; j++) {
            if (candles[i].high < candles[i-j].high || candles[i].high < candles[i+j].high) isHigh = false;
            if (candles[i].low > candles[i-j].low || candles[i].low > candles[i+j].low) isLow = false;
        }
        if (isHigh) swings.push({ type: 'H', price: candles[i].high, time: candles[i].time });
        if (isLow) swings.push({ type: 'L', price: candles[i].low, time: candles[i].time });
    }

    let lastH = null, lastL = null, currentDir = "";
    let lineData = [];

    swings.forEach((s) => {
        let label = ""; let color = "#FFFFFF";
        if (s.type === 'H') {
            if (lastH && s.price > lastH.price) {
                label = "HH"; color = "#00FF88";
                markers.push({ time: s.time, position: 'aboveBar', color: '#FFD700', shape: 'arrowDown', text: 'BOS' });
                currentDir = "UPTREND";
            } else if (lastH && s.price < lastH.price) {
                label = "LH"; color = "#FF4D4D";
                if(currentDir === "UPTREND") markers.push({ time: s.time, position: 'aboveBar', color: '#FF00FF', shape: 'arrowDown', text: 'CHOCH' });
                currentDir = "DOWNTREND";
            }
            lastH = s;
        } else {
            if (lastL && s.price < lastL.price) {
                label = "LL"; color = "#FF4D4D";
                markers.push({ time: s.time, position: 'belowBar', color: '#FFD700', shape: 'arrowUp', text: 'BOS' });
                currentDir = "DOWNTREND";
            } else if (lastL && s.price > lastL.price) {
                label = "HL"; color = "#00FF88";
                if(currentDir === "DOWNTREND") markers.push({ time: s.time, position: 'belowBar', color: '#FF00FF', shape: 'arrowUp', text: 'CHOCH' });
                currentDir = "UPTREND";
            }
            lastL = s;
        }
        if (label !== "") markers.push({ time: s.time, position: s.type === 'H' ? 'aboveBar' : 'belowBar', color: color, shape: 'text', text: label });
        lineData.push({ time: s.time, value: s.price });
    });

    candleSeries.setMarkers(markers);
    trendSeries.setData(lineData);
    document.getElementById("trend").innerText = currentDir || "ANALYZING";
    document.getElementById("trend").style.color = currentDir === "UPTREND" ? "#00FF88" : "#FF4D4D";
}

function calculateEMA(data, period) {
    let k = 2 / (period + 1);
    let emaArray = [];
    if(data.length === 0) return emaArray;
    let prevEma = data[0].close;
    data.forEach(d => {
        let val = (d.close - prevEma) * k + prevEma;
        emaArray.push({ time: d.time, value: val });
        prevEma = val;
    });
    return emaArray;
}

function calculateRSI(data, period = 14) {
    let rsiArray = [];
    if (data.length <= period) return rsiArray;
    for (let i = period; i < data.length; i++) {
        let gains = 0, losses = 0;
        for (let j = 0; j < period; j++) {
            let diff = data[i-j].close - data[i-j-1].close;
            if (diff >= 0) gains += diff; else losses -= diff;
        }
        let rs = (gains/period) / (losses/period || 1);
        rsiArray.push({ time: data[i].time, value: 100 - (100 / (1 + rs)) });
    }
    return rsiArray;
}

function updateIndicators() {
    if (candles.length < 25) return;
    const ema9 = calculateEMA(candles, 9);
    const ema21 = calculateEMA(candles, 21);
    const rsi = calculateRSI(candles, 14);
    ema9Series.setData(ema9);
    ema21Series.setData(ema21);
    rsiLineSeries.setData(rsi);

    const lastR = rsi.length > 0 ? rsi[rsi.length-1].value : 50;
    const lastE9 = ema9[ema9.length-1].value;
    const lastE21 = ema21[ema21.length-1].value;

    if(lastE9 > lastE21 && lastR > 50) {
        document.getElementById("signalValue").innerText = "BUY";
        document.getElementById("led").className = "led-indicator led-active-buy";
    } else if(lastE9 < lastE21 && lastR < 50) {
        document.getElementById("signalValue").innerText = "SELL";
        document.getElementById("led").className = "led-indicator led-active-sell";
    } else {
        document.getElementById("signalValue").innerText = "NEUTRAL";
        document.getElementById("led").className = "led-indicator";
    }
}

function connectDeriv() {
    if (ws) ws.close();
    ws = new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=" + APP_ID);
    ws.onopen = () => {
        document.getElementById("status").innerText = "ONLINE";
        ws.send(JSON.stringify({ ticks_history: currentMarket, count: MAX_CANDLES, end: "latest", granularity: TIMEFRAME, style: "candles" }));
    };
    ws.onmessage = (msg) => {
        const res = JSON.parse(msg.data);
        if (res.candles) {
            candles = res.candles.map(c => ({ time: Number(c.epoch), open: Number(c.open), high: Number(c.high), low: Number(c.low), close: Number(c.close) }));
            candleSeries.setData(candles);
            calculateSMC(); updateIndicators();
            ws.send(JSON.stringify({ ohlc: currentMarket, granularity: TIMEFRAME, subscribe: 1 }));
        }
        if (res.ohlc) {
            const o = res.ohlc;
            const newC = { time: Number(o.open_time), open: Number(o.open), high: Number(o.high), low: Number(o.low), close: Number(o.close) };
            if (candles.length > 0 && newC.time === candles[candles.length - 1].time) {
                candles[candles.length - 1] = newC;
            } else {
                candles.push(newC); if (candles.length > MAX_CANDLES) candles.shift();
                calculateSMC(); 
            }
            candleSeries.update(newC);
            updateIndicators();
        }
    };
}

document.getElementById("market").addEventListener("change", (e) => {
    currentMarket = e.target.value;
    document.getElementById("marketName").innerText = e.target.options[e.target.selectedIndex].text;
    connectDeriv();
});

createCharts();
connectDeriv();
</script>
</body>
</html>
