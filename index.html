<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JANAKA SMC DASHBOARD V6 PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

<style>
*{ margin:0; padding:0; box-sizing:border-box; }
:root{
    --bg:#05070A; --card:#111827; --card2:#0F172A; --border:#233044;
    --green:#00FF88; --red:#FF4D4D; --blue:#38BDF8; --text:#FFFFFF;
    --muted:#94A3B8; --gold:#FFD700; --off:#1F2937;
}
body{ background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); padding:16px; overflow-x:hidden; }
.container{ width:100%; max-width:1700px; margin:auto; }
.title{ font-size:32px; font-weight:800; text-align:center; letter-spacing:2px; margin-bottom:20px; color:var(--green); text-shadow: 0 0 8px rgba(0,255,136,.6), 0 0 25px rgba(0,255,136,.25); }

/* Grid Setup */
.grid-top{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:18px; }
.card{ background:linear-gradient(180deg, #111827, #0B1220); border:1px solid var(--border); border-radius:20px; padding:18px; box-shadow: 0 12px 25px rgba(0,0,0,.35); }
.card h3{ font-size:17px; font-weight:700; color:var(--blue); margin-bottom:14px; letter-spacing:.5px; }
select{ width:100%; height:56px; background:#08111F; color:white; border:1px solid #334155; border-radius:14px; padding:0 16px; font-size:17px; outline:none; transition:.25s; }

/* LED Area */
.led-panel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; border: 1px solid var(--border); }
.led-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.led-bulb { width: 18px; height: 18px; border-radius: 50%; background: var(--off); transition: 0.3s; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); }
.led-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; }

/* LED Colors */
.led-green { background: var(--green); box-shadow: 0 0 12px var(--green); }
.led-red { background: var(--red); box-shadow: 0 0 12px var(--red); }
.led-gold { background: var(--gold); box-shadow: 0 0 12px var(--gold); }

/* Signal Box */
.signal-box { margin-top: 15px; padding: 20px; border-radius: 15px; text-align: center; font-family: 'JetBrains Mono'; font-weight: 800; font-size: 24px; border: 2px solid var(--border); transition: 0.3s; }
.signal-wait { color: var(--muted); border-color: var(--border); }
.signal-buy { color: var(--green); border-color: var(--green); background: rgba(0, 255, 136, 0.1); box-shadow: 0 0 20px rgba(0, 255, 136, 0.2); }
.signal-sell { color: var(--red); border-color: var(--red); background: rgba(255, 77, 77, 0.1); box-shadow: 0 0 20px rgba(255, 77, 77, 0.2); }

#chart{ width:100%; height:560px; border-radius:16px; overflow:hidden; background:#0A1322; border:1px solid var(--border); }
.bottom-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:18px; margin-top:18px; }
.info-box{ background: linear-gradient(180deg, #111827, #0A1322); border:1px solid var(--border); border-radius:18px; padding:22px; text-align:center; }
.info-title{ font-size:14px; font-weight:600; color:var(--muted); margin-bottom:12px; }
.info-value{ font-size:30px; font-weight:700; font-family: 'JetBrains Mono', monospace; }

@media(max-width:900px){ .grid-top, .bottom-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="container">
    <div class="title">JANAKA SMC DASHBOARD V6 PRO</div>

    <div class="grid-top">
        <div class="card">
            <h3>📊 SELECT MARKET & ANALYSIS</h3>
            <select id="market">
                <option value="R_10">Volatility 10</option>
                <option value="R_25">Volatility 25</option>
                <option value="R_50" selected>Volatility 50</option>
                <option value="R_75">Volatility 75</option>
                <option value="R_100">Volatility 100</option>
                <option value="JD10">Jump 10</option>
                <option value="JD25">Jump 25</option>
                <option value="JD50">Jump 50</option>
                <option value="JD75">Jump 75</option>
                <option value="JD100">Jump 100</option>
                <option value="RDBEAR">Bear Market</option>
                <option value="RDBULL">Bull Market</option>
                <option value="frxEURUSD">EUR / USD</option>
                <option value="frxGBPUSD">GBP / USD</option>
            </select>

            <!-- LED Indicators Area -->
            <div class="led-panel">
                <div class="led-item">
                    <div id="ledTrend" class="led-bulb"></div>
                    <div class="led-label">Trend</div>
                </div>
                <div class="led-item">
                    <div id="ledSMC" class="led-bulb"></div>
                    <div class="led-label">SMC Conf</div>
                </div>
                <div class="led-item">
                    <div id="ledSR" class="led-bulb"></div>
                    <div class="led-label">SR Zone</div>
                </div>
                <div class="led-item">
                    <div id="ledCandle" class="led-bulb"></div>
                    <div class="led-label">Candle</div>
                </div>
            </div>

            <div id="mainSignal" class="signal-box signal-wait">WAITING FOR SETUP</div>
        </div>

        <div class="card">
            <h3>🌐 CONNECTION STATUS</h3>
            <div style="font-size:17px; line-height:34px;">
                Status : <span id="status" style="color:var(--green); font-weight:700;">Connecting...</span><br>
                Market : <span id="marketName" style="color:var(--blue); font-weight:700;">Volatility 50</span><br>
                Price : <span id="livePrice" style="font-family:'JetBrains Mono'; font-weight:700;">0.00</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div id="chart"></div>
    </div>

    <div class="bottom-grid">
        <div class="info-box">
            <div class="info-title">📈 MARKET TREND</div>
            <div class="info-value" id="trend">WAIT</div>
        </div>
        <div class="info-box">
            <div class="info-title">⚡ SYSTEM STATUS</div>
            <div class="info-value" id="systemStatus" style="color:var(--blue)">READY</div>
        </div>
    </div>
</div>

<script>
const APP_ID = "1089";
const TIMEFRAME = 60;
let ws = null, chart = null, candleSeries = null, trendSeries = null; 
let candles = [], currentMarket = "R_50", currentDir = "";
let resistanceLine = null, supportLine = null;
let lastSMCAction = ""; 

// DOM Elements
const marketSelect = document.getElementById("market");
const marketName = document.getElementById("marketName");
const status = document.getElementById("status");
const trend = document.getElementById("trend");
const systemStatus = document.getElementById("systemStatus");
const livePrice = document.getElementById("livePrice");
const mainSignal = document.getElementById("mainSignal");

// LED Elements
const ledTrend = document.getElementById("ledTrend");
const ledSMC = document.getElementById("ledSMC");
const ledSR = document.getElementById("ledSR");
const ledCandle = document.getElementById("ledCandle");

function createChart(){
    chart = LightweightCharts.createChart(document.getElementById("chart"),{
        layout:{ background:{ color:"#05070A" }, textColor:"#E5E7EB" },
        grid:{ vertLines:{ color:"#162033" }, horzLines:{ color:"#162033" } },
        rightPriceScale:{ borderColor:"#253244" },
        timeScale:{ borderColor:"#253244", timeVisible:true },
        crosshair:{ mode:1 },
        width: document.getElementById("chart").clientWidth,
        height:560
    });
    candleSeries = chart.addCandlestickSeries({ upColor:"#00FF88", downColor:"#FF4D4D", borderUpColor:"#00FF88", borderDownColor:"#FF4D4D", wickUpColor:"#00FF88", wickDownColor:"#FF4D4D" });
    trendSeries = chart.addLineSeries({ color: 'rgba(56, 189, 248, 0.4)', lineWidth: 1, lineStyle: 2 });
    window.addEventListener("resize",()=> chart.applyOptions({ width:document.getElementById("chart").clientWidth }));
}

function calculateSMC() {
    if (candles.length < 25) return;
    let markers = [];
    let swings = [];
    const windowSize = 4;

    for (let i = windowSize; i < candles.length - windowSize; i++) {
        let isHigh = true, isLow = true;
        for (let j = 1; j <= windowSize; j++) {
            if (candles[i].high < candles[i-j].high || candles[i].high < candles[i+j].high) isHigh = false;
            if (candles[i].low > candles[i-j].low || candles[i].low > candles[i+j].low) isLow = false;
        }
        if (isHigh) swings.push({ type: 'H', price: candles[i].high, time: candles[i].time });
        if (isLow) swings.push({ type: 'L', price: candles[i].low, time: candles[i].time });
    }

    let lastH = null, lastL = null;
    let lineData = [];
    lastSMCAction = ""; 

    swings.forEach((s) => {
        let label = ""; let color = "#FFFFFF";
        if (s.type === 'H') {
            if (lastH && s.price > lastH.price) {
                label = "HH"; color = "#00FF88";
                markers.push({ time: s.time, position: 'aboveBar', color: '#FFD700', shape: 'arrowDown', text: 'BOS' });
                currentDir = "UPTREND"; lastSMCAction = "BOS_UP";
            } else if (lastH && s.price < lastH.price) {
                label = "LH"; color = "#FF4D4D";
                if(currentDir === "UPTREND") {
                    markers.push({ time: s.time, position: 'aboveBar', color: '#FF00FF', shape: 'arrowDown', text: 'CHOCH' });
                    lastSMCAction = "CHOCH_DOWN";
                }
                currentDir = "DOWNTREND";
            }
            lastH = s;
        } else {
            if (lastL && s.price < lastL.price) {
                label = "LL"; color = "#FF4D4D";
                markers.push({ time: s.time, position: 'belowBar', color: '#FFD700', shape: 'arrowUp', text: 'BOS' });
                lastSMCAction = "BOS_DOWN";
                currentDir = "DOWNTREND";
            } else if (lastL && s.price > lastL.price) {
                label = "HL"; color = "#00FF88";
                if(currentDir === "DOWNTREND") {
                    markers.push({ time: s.time, position: 'belowBar', color: '#FF00FF', shape: 'arrowUp', text: 'CHOCH' });
                    lastSMCAction = "CHOCH_UP";
                }
                currentDir = "UPTREND";
            }
            lastL = s;
        }
        if (label !== "") markers.push({ time: s.time, position: s.type === 'H' ? 'aboveBar' : 'belowBar', color: color, shape: 'text', text: label });
        lineData.push({ time: s.time, value: s.price });
    });

    candleSeries.setMarkers(markers);
    trendSeries.setData(lineData);
    trend.innerText = currentDir || "ANALYZING";
    trend.style.color = currentDir === "UPTREND" ? "#00FF88" : "#FF4D4D";

    // Support / Resistance Logic
    if (resistanceLine) candleSeries.removePriceLine(resistanceLine);
    if (supportLine) candleSeries.removePriceLine(supportLine);
    const highSwings = swings.filter(s => s.type === 'H');
    const lowSwings = swings.filter(s => s.type === 'L');
    let resPrice = 0, supPrice = 0;

    if (highSwings.length > 0) {
        resPrice = highSwings[highSwings.length - 1].price;
        resistanceLine = candleSeries.createPriceLine({ price: resPrice, color: '#FF4D4D', lineWidth: 2, title: 'RESISTANCE' });
    }
    if (lowSwings.length > 0) {
        supPrice = lowSwings[lowSwings.length - 1].price;
        supportLine = candleSeries.createPriceLine({ price: supPrice, color: '#00FF88', lineWidth: 2, title: 'SUPPORT' });
    }

    updateSignalLogic(resPrice, supPrice);
}

function updateSignalLogic(res, sup) {
    if (candles.length < 2) return;
    const lastCandle = candles[candles.length - 1];
    const prevCandle = candles[candles.length - 2];
    const price = lastCandle.close;

    // Reset LEDs
    ledTrend.className = "led-bulb";
    ledSMC.className = "led-bulb";
    ledSR.className = "led-bulb";
    ledCandle.className = "led-bulb";

    let scoreBuy = 0;
    let scoreSell = 0;

    // 1. Trend LED
    if (currentDir === "UPTREND") { ledTrend.classList.add("led-green"); scoreBuy++; }
    else if (currentDir === "DOWNTREND") { ledTrend.classList.add("led-red"); scoreSell++; }

    // 2. SMC Conf LED
    if (lastSMCAction.includes("UP")) { ledSMC.classList.add("led-green"); scoreBuy++; }
    else if (lastSMCAction.includes("DOWN")) { ledSMC.classList.add("led-red"); scoreSell++; }

    // 3. SR Zone LED (Price near S/R buffer 0.05%)
    const buffer = price * 0.0005;
    if (Math.abs(price - sup) < buffer) { ledSR.classList.add("led-green"); scoreBuy++; }
    else if (Math.abs(price - res) < buffer) { ledSR.classList.add("led-red"); scoreSell++; }

    // 4. Candle Conf LED
    if (lastCandle.close > lastCandle.open) { ledCandle.classList.add("led-green"); scoreBuy++; }
    else if (lastCandle.close < lastCandle.open) { ledCandle.classList.add("led-red"); scoreSell++; }

    // Final Signal Decision
    if (scoreBuy >= 4) {
        mainSignal.innerText = "STRONG BUY";
        mainSignal.className = "signal-box signal-buy";
    } else if (scoreSell >= 4) {
        mainSignal.innerText = "STRONG SELL";
        mainSignal.className = "signal-box signal-sell";
    } else {
        mainSignal.innerText = "SCANNING MARKET...";
        mainSignal.className = "signal-box signal-wait";
    }
}

function connectDeriv() {
    status.innerHTML = "CONNECTING...";
    if (ws) ws.close();
    ws = new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=" + APP_ID);

    ws.onopen = () => {
        status.innerHTML = "ONLINE";
        ws.send(JSON.stringify({ ticks_history: currentMarket, adjust_start_time: 1, count: 300, end: "latest", granularity: TIMEFRAME, style: "candles" }));
    };

    ws.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        if (data.candles) {
            candles = data.candles.map(c => ({ time: Number(c.epoch), open: Number(c.open), high: Number(c.high), low: Number(c.low), close: Number(c.close) }));
            candleSeries.setData(candles);
            calculateSMC();
            ws.send(JSON.stringify({ ticks: currentMarket, subscribe: 1 }));
        }
        if (data.tick) {
            let price = Number(data.tick.quote);
            livePrice.innerText = price.toFixed(4);
            let epoch = Number(data.tick.epoch);
            let candleTime = Math.floor(epoch / TIMEFRAME) * TIMEFRAME;
            if (candles.length === 0) return;
            let lastCandle = candles[candles.length - 1];
            if (candleTime === lastCandle.time) {
                lastCandle.close = price;
                if (price > lastCandle.high) lastCandle.high = price;
                if (price < lastCandle.low) lastCandle.low = price;
                candleSeries.update(lastCandle);
            } else {
                let newCandle = { time: candleTime, open: price, high: price, low: price, close: price };
                candles.push(newCandle);
                if (candles.length > 300) candles.shift();
                candleSeries.update(newCandle);
                calculateSMC();
            }
        }
    };
}

marketSelect.addEventListener("change", () => {
    currentMarket = marketSelect.value;
    marketName.innerHTML = marketSelect.options[marketSelect.selectedIndex].text;
    candles = [];
    connectDeriv();
});

createChart();
connectDeriv();
</script>
</body>
</html>
