</div>

<div class="card">

<div class="card">
  <h3>📈 Live Candlestick Chart</h3>
  <div id="chart"></div>
</div>



<div class="card">
  <h3>⚡ Market Structure</h3>
  <p>BOS: <span id="bos">NONE</span></p>

</div>

<script>
const APP_ID = "1089";
const TIMEFRAME = 60; // 1 minute candles
const MAX_CANDLES = 300;

const marketSelect = document.getElementById("market");
const marketNameEl = document.getElementById("marketName");
const statusEl = document.getElementById("status");
const infoTextEl = document.getElementById("infoText");
const chartContainer = document.getElementById("chart");

let ws = null;
let chart = null;
let candleSeries = null;
//--------------------------------------------------
// DATA
//--------------------------------------------------

let candles = [];
let markers = [];

const PIVOT = 2;
const MAX_SWINGS = 200;

let currentMarket = marketSelect.value;

//--------------------------------------------------
// SWINGS
//--------------------------------------------------

let swingHighs = [];
let swingLows = [];

let lastSwingHigh = null;
let lastSwingLow = null;

//--------------------------------------------------
// MARKET STRUCTURE
//--------------------------------------------------

let HH = null;
let HL = null;
let LH = null;
let LL = null;



let trend = "RANGE";

let BOS = "NONE";
let CHOCH = "NONE";
// Support / Resistance
let supportLine = null;
let resistanceLine = null;

let currentSupport = null;
let currentResistance = null;


let trendLineSeries = null;


//--------------------------------------------------
// STRUCTURE STATE
//--------------------------------------------------

let lastBreakDirection = null;
let lastStructureType = null;

//--------------------------------------------------
// LIQUIDITY
//--------------------------------------------------

let weakHigh = null;
let weakLow = null;

let strongHigh = null;
let strongLow = null;

//--------------------------------------------------
// ARRAYS
//--------------------------------------------------

let bosLines = [];
let chochLines = [];
let structureLabels = [];

let lastBOS = null;
let lastCHOCH = null;
let brokenSwing = null;

let structureHistory = [];
let brokenCHOCH = null;

let chochDirection = null;

function setText(id, text){
  document.getElementById(id).innerText = text;
}

function resetStructure() {

    candles = [];
    markers = [];

    swingHighs = [];
    swingLows = [];

    lastSwingHigh = null;
    lastSwingLow = null;

    HH = null;
    HL = null;
    LH = null;
    LL = null;

    

    trend = "RANGE";

    BOS = "NONE";
    CHOCH = "NONE";

    lastBreakDirection = null;
lastStructureType = null;
lastCHOCH = null;
chochDirection = null;
brokenCHOCH = null;
brokenSwing = null;

weakHigh = null;
weakLow = null;
  

    strongHigh = null;
    strongLow = null;

    bosLines = [];
    chochLines = [];
    structureLabels = [];
structureHistory = [];
    

    setText("bos", "NONE");
    setText("choch", "NONE");
    setText("trend", "WAIT");

    if (candleSeries) {
        candleSeries.setData([]);
        if (candleSeries.setMarkers) {
            candleSeries.setMarkers([]);
        }
    }
}

function marketToDisplayName(value){
  const opt = [...marketSelect.options].find(o => o.value === value);
  return opt ? opt.text : value;
}

function updateMarketName(){
  marketNameEl.innerText = marketToDisplayName(currentMarket);
}

function createChartIfNeeded(){
  if (chart) return;

  chart = LightweightCharts.createChart(chartContainer, {
    layout: {
      background: { color: "#0f172a" },
      textColor: "#ffffff"
    },
    grid: {
      vertLines: { color: "#1f2937" },
      horzLines: { color: "#1f2937" }
    },
    rightPriceScale: {
      borderColor: "#1f2937"
    },
    timeScale: {
      borderColor: "#1f2937",
      timeVisible: true,
      secondsVisible: false
    },
    width: chartContainer.clientWidth,
    height: 500
  });

  candleSeries = chart.addCandlestickSeries({
    upColor: "#00ff88",
    downColor: "#ff4d4d",
    borderUpColor: "#00ff88",
    borderDownColor: "#ff4d4d",
    wickUpColor: "#00ff88",
    wickDownColor: "#ff4d4d"
});
    
    
    

  const ro = new ResizeObserver(entries => {
    for (const entry of entries) {
      const { width } = entry.contentRect;
      chart.applyOptions({ width: Math.floor(width) });
    }
  });
  ro.observe(chartContainer);
}

function connect(){
  if (ws) {
    try { ws.close(); } catch (e) {}
    ws = null;
  }

  statusEl.innerText = "Connecting...";
  infoTextEl.innerText = "Loading 1 minute candles...";
  resetStructure();
  candles = [];
  if (candleSeries) candleSeries.setData([]);

  ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

  ws.onopen = () => {
    statusEl.innerText = "Connected 🟢";

    ws.send(JSON.stringify({
      ticks_history: currentMarket,
      end: "latest",
      style: "candles",
      granularity: TIMEFRAME,
      count: MAX_CANDLES,
      subscribe: 1
    
    }));
  
ws.send(JSON.stringify({
    ticks: currentMarket,
    subscribe: 1
}));
};
  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
if (data.msg_type === "tick") {

    const price = Number(data.tick.quote);
    const epoch = Number(data.tick.epoch);

    const candleTime = Math.floor(epoch / 60) * 60;

    if (candles.length === 0) return;

    let last = candles[candles.length - 1];

    if (last.time === candleTime) {

        last.close = price;

        if (price > last.high) last.high = price;
        if (price < last.low) last.low = price;

        candleSeries.update(last);

    } else {

        const newCandle = {
            time: candleTime,
            open: last.close,
            high: price,
            low: price,
            close: price
        };

        candles.push(newCandle);

        if (candles.length > MAX_CANDLES) {
            candles.shift();
        }

        candleSeries.update(newCandle);

        buildStructureFromCandles();
    }

    return;
}
    if (data.error) {
      statusEl.innerText = "Error 🔴";
      infoTextEl.innerText = data.error.message || "API error";
      return;
    }

    if (data.msg_type === "candles" && Array.isArray(data.candles)) {
      const formatted = data.candles
        .map(c => ({
          time: Number(c.epoch),
          open: Number(c.open),
          high: Number(c.high),
          low: Number(c.low),
          close: Number(c.close)
        }))
        .filter(c => Number.isFinite(c.time) && Number.isFinite(c.open) && Number.isFinite(c.high) && Number.isFinite(c.low) && Number.isFinite(c.close));

      candles = formatted;
      candleSeries.setData(candles);
      chart.timeScale().fitContent();

      infoTextEl.innerText = `Loaded ${candles.length} candles`;
      buildStructureFromCandles();
      chart.timeScale().fitContent();

chart.timeScale().setVisibleLogicalRange({

    from: candles.length - 80,
    to: candles.length + 5

});

chart.timeScale().scrollToRealTime();

return;
    }

    if (data.msg_type === "history" && data.history && Array.isArray(data.history.prices) && Array.isArray(data.history.times)) {
      // Fallback if the API returns history arrays.
      const prices = data.history.prices;
      const times = data.history.times;

      const fallback = [];
      for (let i = 0; i < Math.min(prices.length, times.length); i++) {
        const p = Number(prices[i]);
        const t = Number(times[i]);
        if (Number.isFinite(p) && Number.isFinite(t)) {
          fallback.push({
            time: t,
            open: p,
            high: p,
            low: p,
            close: p
          });
        }
      }

      if (fallback.length) {
        candles = fallback;
        candleSeries.setData(candles);
        chart.timeScale().fitContent();
        infoTextEl.innerText = `Loaded ${candles.length} candles`;
        buildStructureFromCandles();
      }
      return;
    }

    // Live candle update fallback
    if (data.msg_type === "candles" && data.candles && !Array.isArray(data.candles)) {
      const c = data.candles;
      const candle = {
        time: Number(c.epoch),
        open: Number(c.open),
        high: Number(c.high),
        low: Number(c.low),
        close: Number(c.close)
      };

      if (Number.isFinite(candle.time) && Number.isFinite(candle.open) && Number.isFinite(candle.high) && Number.isFinite(candle.low) && Number.isFinite(candle.close)) {
        upsertCandle(candle);
      }
    }
  };

  ws.onerror = () => {
    statusEl.innerText = "Error 🔴";
    infoTextEl.innerText = "WebSocket error";
  };

  ws.onclose = () => {
    statusEl.innerText = "Disconnected 🔴";
  };
}

function upsertCandle(candle){
  if (!candles.length) {
    candles.push(candle);
    candleSeries.setData(candles);
    return;
  }

  const last = candles[candles.length - 1];

  if (last.time === candle.time) {
    candles[candles.length - 1] = candle;
    candleSeries.update(candle);
  } else if (candle.time > last.time) {
    candles.push(candle);
    if (candles.length > MAX_CANDLES) candles.shift();
    candleSeries.update(candle);
  } else {
    const idx = candles.findIndex(x => x.time === candle.time);
    if (idx >= 0) {
      candles[idx] = candle;
      candleSeries.setData(candles);
    }
  }

  buildStructureFromCandles();
}
function detectSwingPoints() {

    swingHighs = [];
    swingLows = [];
    markers = [];

    if (candles.length < (PIVOT * 2 + 1))
        return;

    for (let i = PIVOT; i < candles.length - PIVOT; i++) {

        let isSwingHigh = true;
        let isSwingLow = true;

        const currentHigh = candles[i].high;
        const currentLow = candles[i].low;

        for (let j = i - PIVOT; j <= i + PIVOT; j++) {

            if (j === i)
                continue;

            if (candles[j].high >= currentHigh)
                isSwingHigh = false;

            if (candles[j].low <= currentLow)
                isSwingLow = false;
        }

        if (isSwingHigh) {

            swingHighs.push({
                index: i,
                time: candles[i].time,
                price: currentHigh
            });

            markers.push({
                time: candles[i].time,
                position: "aboveBar",
                color: "#ff4444",
                shape: "arrowDown",
                text: ""
            });
        }

        if (isSwingLow) {

            swingLows.push({
                index: i,
                time: candles[i].time,
                price: currentLow
            });

            markers.push({
                time: candles[i].time,
                position: "belowBar",
                color: "#00ff88",
                shape: "arrowUp",
                text: ""
            });
        }
    }

    if (swingHighs.length > MAX_SWINGS)
        swingHighs.splice(0, swingHighs.length - MAX_SWINGS);

    if (swingLows.length > MAX_SWINGS)
        swingLows.splice(0, swingLows.length - MAX_SWINGS);

    
}

function filterStructureSwings() {

    // ------------------------------------
    // Merge all swings in time order
    // ------------------------------------

    let all = [];

    swingHighs.forEach(s => {

        all.push({
            ...s,
            swing: "HIGH"
        });

    });

    swingLows.forEach(s => {

        all.push({
            ...s,
            swing: "LOW"
        });

    });

    all.sort((a, b) => a.index - b.index);

    // ------------------------------------
    // Remove weak consecutive swings
    // ------------------------------------

    let filtered = [];

    for (const s of all) {

        if (filtered.length === 0) {

            filtered.push(s);
            continue;

        }

        let last = filtered[filtered.length - 1];

        // Same swing type
        if (last.swing === s.swing) {

            if (s.swing === "HIGH") {

                // keep higher High
                if (s.price > last.price) {

                    filtered[filtered.length - 1] = s;

                }

            } else {

                // keep lower Low
                if (s.price < last.price) {

                    filtered[filtered.length - 1] = s;

                }

            }

        } else {

            filtered.push(s);

        }

    }

    // ------------------------------------
    // Split again
    // ------------------------------------

    swingHighs = filtered
        .filter(x => x.swing === "HIGH")
        .slice(-MAX_SWINGS);

    swingLows = filtered
        .filter(x => x.swing === "LOW")
        .slice(-MAX_SWINGS);

}
    

function buildStructure() {

    // Reset
    HH = null;
    HL = null;
    LH = null;
    LL = null;

    structureHistory = [];

    //-------------------------
    // HIGHS
    //-------------------------

    let previousHigh = null;

    for (const sh of swingHighs) {

        if (previousHigh === null) {

            sh.type = "HH";
            HH = sh;

        } else if (sh.price > previousHigh.price) {

            sh.type = "HH";
            HH = sh;

        } else {

            sh.type = "LH";
            LH = sh;

        }

        previousHigh = sh;

        structureHistory.push({
            type: sh.type,
            time: sh.time,
            price: sh.price
        });

    }

    //-------------------------
    // LOWS
    //-------------------------

    let previousLow = null;

    for (const sl of swingLows) {

        if (previousLow === null) {

            sl.type = "HL";
            HL = sl;

        } else if (sl.price > previousLow.price) {

            sl.type = "HL";
            HL = sl;

        } else {

            sl.type = "LL";
            LL = sl;

        }

        previousLow = sl;

        structureHistory.push({
            type: sl.type,
            time: sl.time,
            price: sl.price
        });

    }

}
    

    
    

        
        

        

    
        

        

            
            

        

            
    

function buildStructureFromCandles() {

    if (candles.length < (PIVOT * 2 + 1))
        return;

    detectSwingPoints();
filterStructureSwings();

buildStructure();

    buildSignals();
    drawStructureMarkers();
drawSupportResistance();
drawTrendLine();

 }

    
        

        

            

    


        
    



               



    



    

        


        




    
            function drawStructureMarkers() {

    let allMarkers = [];




        

        
        
const visibleHistory = structureHistory.slice(-20);
const recentStructure = visibleHistory.filter(s =>
    s.type === "HH" ||
    s.type === "HL" ||
    s.type === "LH" ||
    s.type === "LL"
).slice(-6);

const recentSignals = visibleHistory.filter(s =>
    s.type === "BOS" ||
    s.type === "CHOCH"
);
    [...recentStructure, ...recentSignals].forEach(s => {

        // HH / HL / LH / LL
        if (
            s.type === "HH" ||
            s.type === "HL" ||
            s.type === "LH" ||
            s.type === "LL"
        ) {

            allMarkers.push({

                time: s.time,

                position:
                    s.type === "HH" || s.type === "LH"
                        ? "aboveBar"
                        : "belowBar",

                color:
                    s.type === "HH" ? "#00BFFF" :
                    s.type === "HL" ? "#00FF66" :
                    s.type === "LH" ? "#FF9900" :
                    "#FF3333",

                shape:
                    s.type === "HH" || s.type === "LH"
                        ? "arrowDown"
                        : "arrowUp",

                text: s.type

            });

        }

        // BOS
        if (s.type === "BOS") {

            allMarkers.push({

                time: s.time,

                position:
                    s.direction === "UP"
                        ? "aboveBar"
                        : "belowBar",

                color: "#FFD700",

                shape:
                    s.direction === "UP"
                        ? "arrowUp"
                        : "arrowDown",

                text:
                    s.direction === "UP"
                        ? "BOS↑"
                        : "BOS↓"

            });

        }

        // CHOCH
        if (s.type === "CHOCH") {

            allMarkers.push({

                time: s.time,

                position:
                    s.direction === "UP"
                        ? "belowBar"
                        : "aboveBar",

                color: "#00FFFF",

                shape:
                    s.direction === "UP"
                        ? "arrowUp"
                        : "arrowDown",

                text: "CHOCH"

            });

        }

    });

    candleSeries.setMarkers(allMarkers);

}

    
function drawSupportResistance() {

    if (!candleSeries)
        return;

    // Remove old lines
    if (supportLine) {
        candleSeries.removePriceLine(supportLine);
        supportLine = null;
    }

    if (resistanceLine) {
        candleSeries.removePriceLine(resistanceLine);
        resistanceLine = null;
    }

    // -------------------------
    // Support
    // -------------------------
    if (currentSupport !== null) {

        supportLine = candleSeries.createPriceLine({

            price: currentSupport,
            color: "#00ff88",
            lineWidth: 2,
            lineStyle: 2,
            axisLabelVisible: true,
            title: "SUPPORT"

        });

    }

    // -------------------------
    // Resistance
    // -------------------------
    if (currentResistance !== null) {

        resistanceLine = candleSeries.createPriceLine({

            price: currentResistance,
            color: "#ff4444",
            lineWidth: 2,
            lineStyle: 2,
            axisLabelVisible: true,
            title: "RESISTANCE"

        });

    }

}
        
function buildSignals() {

    let currentTrend = "RANGE";

    

    BOS = "NONE";
    CHOCH = "NONE";
lastBOS = null;
lastCHOCH = null;
    for (const c of candles) {

        // -------------------
        // BOS UP
        // -------------------
        if (
            HH &&
            c.close > HH.price
        ) {

            currentTrend = "UPTREND";
            BOS = "BOS UP";
if (lastBOS !== c.time) {

    lastBOS = c.time;

    structureHistory.push({
        type: "BOS",
        direction: "UP",
        time: c.time,
        price: c.close
    });

}
        }

        // -------------------
        // BOS DOWN
        // -------------------
        if (
            LL &&
            c.close < LL.price
        ) {

            currentTrend = "DOWNTREND";
            BOS = "BOS DOWN";
if (lastBOS !== c.time) {

    lastBOS = c.time;

    structureHistory.push({
        type: "BOS",
        direction: "DOWN",
        time: c.time,
        price: c.close
    });

}
        }

        // -------------------
        // CHOCH DOWN
        // -------------------
        if (
            currentTrend === "UPTREND" &&
            HL &&
            c.close < HL.price
        ) {

            currentTrend = "DOWNTREND";
            CHOCH = "CHOCH DOWN";
structureHistory.push({
    type: "CHOCH",
    direction: "DOWN",
    time: c.time,
    price: c.close
});
        }

        // -------------------
        // CHOCH UP
        // -------------------
        if (
            currentTrend === "DOWNTREND" &&
            LH &&
            c.close > LH.price
        ) {

            currentTrend = "UPTREND";
            CHOCH = "CHOCH UP";
structureHistory.push({
    type: "CHOCH",
    direction: "UP",
    time: c.time,
    price: c.close
});
        }

    }

    trend = currentTrend;

    // Support / Resistance
    currentSupport = null;
    currentResistance = null;

    if (trend === "UPTREND") {

        if (HL)
            currentSupport = HL.price;

        if (HH)
            currentResistance = HH.price;

    }

    if (trend === "DOWNTREND") {

        if (LL)
            currentSupport = LL.price;

        if (LH)
            currentResistance = LH.price;

    }

    setText("bos", BOS);
    setText("choch", CHOCH);
    setText("trend", trend);

}
  
    

    

        

        
        
//------------------------------------------------
// Trend Line
//------------------------------------------------

function drawTrendLine() {

    if (!chart)
        return;

    // Remove old trend line
    if (trendLineSeries) {
        chart.removeSeries(trendLineSeries);
        trendLineSeries = null;
    }

    trendLineSeries = chart.addLineSeries({

        color: "#00aaff",
        lineWidth: 2,
        crosshairMarkerVisible: false,
        lastValueVisible: false,
        priceLineVisible: false

    });
// -------------------------
// UPTREND
// -------------------------
if (trend === "UPTREND") {

    const hls = swingLows.filter(s => s.type === "HL");

if (hls.length >= 2) {

    const p1 = hls[hls.length - 2];
    const p2 = hls[hls.length - 1];

      const slope =
    (p2.price - p1.price) /
    (p2.time - p1.time);

const futureTime =
    candles[candles.length - 1].time + (TIMEFRAME * 10);

const futurePrice =
    p2.price +
    slope * (futureTime - p2.time);

trendLineSeries.setData([
    { time: p1.time, value: p1.price },
    { time: futureTime, value: futurePrice }
]);

    }

}

// -------------------------
// DOWNTREND
// -------------------------
if (trend === "DOWNTREND") {

    const lhs = swingHighs.filter(s => s.type === "LH");

if (lhs.length >= 2) {

    const p1 = lhs[lhs.length - 2];
    const p2 = lhs[lhs.length - 1];

        const slope =
    (p2.price - p1.price) /
    (p2.time - p1.time);

const futureTime =
    candles[candles.length - 1].time + (TIMEFRAME * 10);

const futurePrice =
    p2.price +
    slope * (futureTime - p2.time);

trendLineSeries.setData([
    { time: p1.time, value: p1.price },
    { time: futureTime, value: futurePrice }
]);

    }

}
}
    



    


    


marketSelect.addEventListener("change", () => {
  currentMarket = marketSelect.value;
  updateMarketName();
  connect();
});

updateMarketName();
createChartIfNeeded();
connect();
