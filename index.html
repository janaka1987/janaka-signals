<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JANAKA SMC DASHBOARD - AUTO SYMBOLS</title>

<!-- Lightweight Charts CDN -->
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

<style>
body {
  background: #0b1220;
  color: white;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 15px;
}

h1 {
  text-align: center;
  color: #00ff88;
  margin-top: 0;
  font-size: 22px;
}

.card {
  background: #111c2e;
  border: 1px solid #1f3b5b;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 12px;
}

select {
  width: 100%;
  padding: 12px;
  font-size: 15px;
  border-radius: 8px;
  background: #0f172a;
  color: white;
  border: 1px solid #334155;
  box-sizing: border-box;
}

#chart {
  height: 450px;
  width: 100%;
  background: #0f172a;
  border-radius: 8px;
}

.status-badge {
  font-weight: bold;
  padding: 4px 8px;
  border-radius: 4px;
  background: #334155;
}

#debug-log {
  background: #000;
  color: #00ff88;
  font-family: monospace;
  padding: 10px;
  border-radius: 6px;
  max-height: 120px;
  overflow-y: auto;
  font-size: 12px;
}
</style>
</head>

<body>

<h1>JANAKA SMC DASHBOARD (AUTO-FETCH)</h1>

<div class="card">
  <label for="market"><b>Select Active Market:</b></label><br><br>
  <select id="market">
    <option value="">Fetching active symbols from Deriv...</option>
  </select>
</div>

<div class="card">
  <div>Status: <span id="status" class="status-badge">Connecting...</span></div>
  <div style="margin-top:8px; font-size:14px; color:#94a3b8;" id="infoText">Starting system...</div>
</div>

<div class="card">
  <h3>📈 Live Chart</h3>
  <div id="chart"></div>
</div>

<div class="card">
  <h3>⚡ Market Structure</h3>
  <div>BOS: <b id="bos" style="color:#00ff88;">NONE</b></div>
  <div>CHOCH: <b id="choch" style="color:#ffaa00;">NONE</b></div>
  <div>Trend: <b id="trend" style="color:#38bdf8;">WAIT</b></div>
</div>

<div class="card">
  <h4 style="margin:0 0 8px 0; color:#aaa;">System Log / Errors</h4>
  <div id="debug-log">Log started...</div>
</div>

<script>
function log(msg, isError = false) {
  const el = document.getElementById("debug-log");
  const color = isError ? "#ff5555" : "#00ff88";
  el.innerHTML += `<div style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

window.onerror = function(msg, url, line) {
  log(`CRITICAL ERROR: ${msg} (Line ${line})`, true);
};

const marketSelect = document.getElementById("market");
const statusEl = document.getElementById("status");
const infoTextEl = document.getElementById("infoText");
const chartContainer = document.getElementById("chart");

let ws = null;
let chart = null;
let candleSeries = null;
let candles = [];
let activeSymbolsList = [];
let currentSymbol = "";
const PIVOT = 2;

function initChart() {
  if (typeof LightweightCharts === 'undefined') {
    log("ERROR: LightweightCharts library failed to load!", true);
    statusEl.innerText = "CDN Error 🔴";
    return false;
  }

  try {
    chart = LightweightCharts.createChart(chartContainer, {
      layout: { background: { color: "#0f172a" }, textColor: "#ffffff" },
      grid: { vertLines: { color: "#1e293b" }, horzLines: { color: "#1e293b" } },
      timeScale: { timeVisible: true, secondsVisible: false }
    });

    candleSeries = chart.addCandlestickSeries({
      upColor: "#00ff88", downColor: "#ff4d4d",
      borderUpColor: "#00ff88", borderDownColor: "#ff4d4d",
      wickUpColor: "#00ff88", wickDownColor: "#ff4d4d"
    });

    log("Chart Library Initialized Successfully.");
    return true;
  } catch (e) {
    log("Chart Creation Failed: " + e.message, true);
    return false;
  }
}

function connectWebSocket() {
  statusEl.innerText = "Connecting... 🟡";
  log("Connecting to Deriv WebSocket...");

  ws = new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=1089");

  ws.onopen = () => {
    statusEl.innerText = "Connected 🟢";
    log("WebSocket Connected. Requesting Active Symbols list...");
    
    // Step 1: Get all active symbols live from Deriv
    ws.send(JSON.stringify({
      active_symbols: "brief",
      product_type: "basic"
    }));
  };

  ws.onmessage = (evt) => {
    try {
      const data = JSON.parse(evt.data);

      if (data.error) {
        statusEl.innerText = "Error 🔴";
        log(`API ERROR: ${data.error.message}`, true);
        return;
      }

      // Handle Active Symbols list from Deriv
      if (data.msg_type === "active_symbols") {
        activeSymbolsList = data.active_symbols;
        log(`Fetched ${activeSymbolsList.length} active symbols dynamically!`);
        populateSymbolDropdown();
        return;
      }

      // History candles payload
      if (data.msg_type === "candles") {
        candles = data.candles.map(c => ({
          time: Number(c.epoch),
          open: Number(c.open),
          high: Number(c.high),
          low: Number(c.low),
          close: Number(c.close)
        }));

        candleSeries.setData(candles);
        chart.timeScale().fitContent();
        infoTextEl.innerText = `Loaded ${candles.length} candles for ${currentSymbol}`;
        log(`Loaded ${candles.length} candles successfully.`);
        calculateSMC();
      }

      // Live tick candle update
      if (data.msg_type === "ohlc") {
        const c = data.ohlc;
        const newCandle = {
          time: Number(c.open_time),
          open: Number(c.open),
          high: Number(c.high),
          low: Number(c.low),
          close: Number(c.close)
        };

        if (candles.length > 0) {
          const last = candles[candles.length - 1];
          if (last.time === newCandle.time) {
            candles[candles.length - 1] = newCandle;
          } else if (newCandle.time > last.time) {
            candles.push(newCandle);
            if (candles.length > 150) candles.shift();
          }
          candleSeries.update(newCandle);
          calculateSMC();
        }
      }
    } catch (err) {
      log("Data Parsing Error: " + err.message, true);
    }
  };

  ws.onerror = (e) => {
    statusEl.innerText = "WS Error 🔴";
    log("WebSocket Connection Error!", true);
  };

  ws.onclose = () => {
    statusEl.innerText = "Disconnected 🔴";
  };
}

function populateSymbolDropdown() {
  marketSelect.innerHTML = "";

  // Filter & sort symbols (Prioritize Synthetic Indices)
  const synthetics = activeSymbolsList.filter(s => s.market === "synthetic_index");
  const forex = activeSymbolsList.filter(s => s.market === "forex");

  const addGroup = (title, items) => {
    if (items.length === 0) return;
    const group = document.createElement("optgroup");
    group.label = title;
    items.forEach(s => {
      const opt = document.createElement("option");
      opt.value = s.symbol;
      opt.textContent = `${s.display_name} (${s.symbol})`;
      group.appendChild(opt);
    });
    marketSelect.appendChild(group);
  };

  addGroup("Synthetic Indices", synthetics);
  addGroup("Forex Pairs", forex);

  // Auto-select first symbol and load candles
  if (marketSelect.options.length > 0) {
    currentSymbol = marketSelect.options[0].value;
    marketSelect.value = currentSymbol;
    log(`Selected active market: ${currentSymbol}`);
    requestCandles(currentSymbol);
  }
}

marketSelect.addEventListener("change", () => {
  currentSymbol = marketSelect.value;
  if (currentSymbol) {
    log(`Changing market to: ${currentSymbol}...`);
    requestCandles(currentSymbol);
  }
});

function requestCandles(symbol) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;

  log(`Requesting candles for ${symbol}...`);
  
  // Clear existing candle data on chart
  candles = [];
  candleSeries.setData([]);

  ws.send(JSON.stringify({
    ticks_history: symbol,
    adjust_start_time: 1,
    count: 150,
    end: "latest",
    style: "candles",
    granularity: 60,
    subscribe: 1
  }));
}

function calculateSMC() {
  if (candles.length < (PIVOT * 2 + 1)) return;

  let swingHighs = [];
  let swingLows = [];

  for (let i = PIVOT; i < candles.length - PIVOT; i++) {
    let isHigh = true, isLow = true;
    for (let j = i - PIVOT; j <= i + PIVOT; j++) {
      if (j === i) continue;
      if (candles[j].high >= candles[i].high) isHigh = false;
      if (candles[j].low <= candles[i].low) isLow = false;
    }
    if (isHigh) swingHighs.push(candles[i]);
    if (isLow) swingLows.push(candles[i]);
  }

  let trend = "RANGE", bos = "NONE", choch = "NONE";

  if (swingHighs.length >= 2 && swingLows.length >= 2) {
    const h1 = swingHighs[swingHighs.length - 2].high;
    const h2 = swingHighs[swingHighs.length - 1].high;
    const l1 = swingLows[swingLows.length - 2].low;
    const l2 = swingLows[swingLows.length - 1].low;

    if (h2 > h1 && l2 > l1) { trend = "UPTREND"; bos = "BOS UP"; }
    else if (h2 < h1 && l2 < l1) { trend = "DOWNTREND"; bos = "BOS DOWN"; }
    else if (h2 > h1 && l2 < l1) { choch = "CHOCH DOWN"; }
    else if (h2 < h1 && l2 > l1) { choch = "CHOCH UP"; }
  }

  document.getElementById("bos").innerText = bos;
  document.getElementById("choch").innerText = choch;
  document.getElementById("trend").innerText = trend;
}

// Start
if (initChart()) {
  connectWebSocket();
}
</script>

</body>
</html>
