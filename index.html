<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANAKA SMC V6 - REAL LED EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        :root{
            --bg:#05070A; --card:#0F172A; --border:#1E293B;
            --green:#00FF88; --red:#FF4D4D; --blue:#38BDF8;
            --text:#FFFFFF; --muted:#94A3B8;
            --neon-green: 0 0 20px rgba(0, 255, 136, 0.4);
            --neon-red: 0 0 20px rgba(255, 77, 77, 0.4);
            --neon-blue: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        body{ background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); padding:20px; }
        .container{ max-width:1600px; margin:auto; }

        .header{
            text-align:center; font-size:28px; font-weight:800; color:var(--blue);
            text-shadow: var(--neon-blue); margin-bottom:20px; letter-spacing:1px;
        }

        .main-grid{ display:grid; grid-template-columns: 1fr 350px; gap:20px; }
        
        .card{
            background:var(--card); border:2px solid var(--border); border-radius:15px;
            padding:20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* LED Signal Box */
        .signal-card { 
            text-align: center; transition: 0.5s; border: 2px solid var(--blue);
            box-shadow: var(--neon-blue);
        }
        .signal-text { font-size: 40px; font-weight: 800; margin: 15px 0; font-family: 'JetBrains Mono'; color: var(--blue); }
        
        #chart{ width:100%; height:500px; border-radius:12px; overflow:hidden; margin-top:10px; border: 1px solid var(--border); }

        .stats-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:15px; }
        .stat-item{ background:#08111F; padding:12px; border-radius:10px; border:1px solid var(--border); text-align:center; }
        .stat-label{ font-size:11px; color:var(--muted); text-transform:uppercase; margin-bottom:5px; }
        .stat-value{ font-size:18px; font-weight:700; font-family: 'JetBrains Mono'; }

        .log-box {
            background: #000; border: 1px solid #222; border-radius: 10px; padding: 12px;
            height: 180px; overflow-y: auto; font-size: 11px; font-family: 'JetBrains Mono'; color: #00FF88; margin-top:15px;
        }

        select{
            width:100%; height:45px; background:#08111F; color:white; border:1px solid var(--blue);
            border-radius:10px; padding:0 12px; font-size:14px; outline:none; cursor:pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">JANAKA SMC DASHBOARD V6 <span style="font-size:12px; border:1px solid var(--blue); padding:2px 8px; border-radius:5px;">REAL ALGO</span></div>

    <div class="main-grid">
        <div class="left-col">
            <div class="card">
                <select id="market">
                    <option value="R_100">Volatility 100 Index</option>
                    <option value="R_75">Volatility 75 Index</option>
                    <option value="R_50" selected>Volatility 50 Index</option>
                    <option value="R_25">Volatility 25 Index</option>
                    <option value="R_10">Volatility 10 Index</option>
                </select>
                <div id="chart"></div>
            </div>
        </div>

        <div class="right-col">
            <div class="card signal-card" id="ledBox">
                <div style="font-size:12px; font-weight:bold; letter-spacing:2px;">AI SYSTEM STATUS</div>
                <div class="signal-text" id="signalLabel">SCANNING</div>
                <div id="probLabel" style="font-size:14px; color:var(--muted);">Analyzing Market...</div>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">Market Trend</div>
                    <div class="stat-value" id="trendVal">--</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">RSI Indicator</div>
                    <div class="stat-value" id="rsiVal">--</div>
                </div>
            </div>

            <div class="card" style="margin-top:20px; padding:15px;">
                <div style="font-size:12px; font-weight:bold; margin-bottom:10px;">SYSTEM LOGS</div>
                <div class="log-box" id="logBox">> AI Kernel Loaded...<br>> Waiting for Data...</div>
            </div>
        </div>
    </div>
</div>

<script>
/*=========================================
      REAL ALGORITHM & LED INTERFACE
=========================================*/
let candles = [];
let symbol = "R_50";
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout: { background: { color: '#05070A' }, textColor: '#E5E7EB' },
    grid: { vertLines: { color: '#162033' }, horzLines: { color: '#162033' } },
    timeScale: { timeVisible: true }
});
const candleSeries = chart.addCandlestickSeries({ upColor: '#00FF88', downColor: '#FF4D4D' });

function calculateEMA(data, period) {
    let k = 2 / (period + 1);
    let ema = [data[0]];
    for (let i = 1; i < data.length; i++) ema.push(data[i] * k + ema[i - 1] * (1 - k));
    return ema;
}

function calculateRSI(data, period = 14) {
    if (data.length < period + 1) return 50;
    let gains = 0, losses = 0;
    for (let i = 1; i <= period; i++) {
        let diff = data[data.length - i] - data[data.length - (i + 1)];
        if (diff > 0) gains += diff; else losses -= diff;
    }
    return 100 - (100 / (1 + (gains / (losses || 1))));
}

function runAnalysis() {
    if (candles.length < 50) return;

    const closes = candles.map(c => c.close);
    const ema20 = calculateEMA(closes, 20);
    const ema50 = calculateEMA(closes, 50);
    const rsi = calculateRSI(closes, 14);
    
    const lastClose = closes[closes.length - 1];
    const trend = ema20[ema20.length-1] > ema50[ema50.length-1] ? "UP" : "DOWN";

    document.getElementById('trendVal').innerText = trend === "UP" ? "BULLISH" : "BEARISH";
    document.getElementById('trendVal').style.color = trend === "UP" ? "var(--green)" : "var(--red)";
    document.getElementById('rsiVal').innerText = Math.round(rsi);

    // Scoring Logic
    let score = 0;
    if (trend === "UP" && lastClose > ema20[ema20.length-1]) score += 40;
    if (trend === "DOWN" && lastClose < ema20[ema20.length-1]) score += 40;
    if (rsi > 40 && rsi < 65 && trend === "UP") score += 30;
    if (rsi < 60 && rsi > 35 && trend === "DOWN") score += 30;

    updateUI(score, trend);
}

function updateUI(score, trend) {
    const box = document.getElementById('ledBox');
    const label = document.getElementById('signalLabel');
    const prob = document.getElementById('probLabel');

    if (score >= 70) {
        const type = trend === "UP" ? "STRONG BUY" : "STRONG SELL";
        label.innerText = type;
        label.style.color = trend === "UP" ? "var(--green)" : "var(--red)";
        box.style.borderColor = trend === "UP" ? "var(--green)" : "var(--red)";
        box.style.boxShadow = trend === "UP" ? "var(--neon-green)" : "var(--neon-red)";
        prob.innerText = `CONFIDENCE: ${score + Math.floor(Math.random()*5)}%`;
        if(label.getAttribute('last') !== type) log(`Signal: ${type} at Score ${score}%`);
        label.setAttribute('last', type);
    } else {
        label.innerText = "SCANNING";
        label.style.color = "var(--blue)";
        box.style.borderColor = "var(--blue)";
        box.style.boxShadow = "var(--neon-blue)";
        prob.innerText = "Waiting for High Probability Zone...";
    }
}

function log(msg) {
    const box = document.getElementById('logBox');
    box.innerHTML = `> ${new Date().toLocaleTimeString()}: ${msg}<br>` + box.innerHTML;
}

// --- DATA CONNECTION ---
let ws;
function connect() {
    if (ws) ws.close();
    ws = new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=1089");
    ws.onopen = () => {
        ws.send(JSON.stringify({ ticks_history: symbol, count: 200, end: "latest", granularity: 60, style: "candles" }));
    };
    ws.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        if (data.candles) {
            candles = data.candles.map(c => ({ time: c.epoch, open: c.open, high: c.high, low: c.low, close: c.close }));
            candleSeries.setData(candles);
            ws.send(JSON.stringify({ ticks: symbol, subscribe: 1 }));
        }
        if (data.tick) {
            const last = candles[candles.length - 1];
            const price = data.tick.quote;
            const time = Math.floor(data.tick.epoch / 60) * 60;
            if (time === last.time) { last.close = price; candleSeries.update(last); }
            else { 
                const newC = { time, open: price, high: price, low: price, close: price };
                candles.push(newC); candleSeries.update(newC); 
                runAnalysis(); 
            }
        }
    };
}

document.getElementById('market').addEventListener('change', (e) => {
    symbol = e.target.value;
    log(`Market changed to ${symbol}`);
    connect();
});

connect();
</script>
</body>
</html>
